server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Cache-Control différencié (Annexe B point 2) ──

  # index.html : toujours revérifié (référence les fichiers à jour)
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # le service worker : jamais mis en cache (doit toujours être frais)
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # manifeste + icônes : cache modéré 24h
  location ~* \.(webmanifest|png|svg|ico)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # JS/CSS : cache long (le nom change si le contenu change)
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # fichiers du portail (design Manus = index.html)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # espace d'administration (back-office)
  location /admin/ {
    alias /usr/share/nginx/html/admin/;
    try_files $uri $uri/ /admin/connexion.html;
  }

  # l'API est proxifiée sous /api/ (retire le préfixe)
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
