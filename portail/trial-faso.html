<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moto Trial Faso</title>
<style>
  :root{--vert:#0E7A3C;--rouge:#E32219;--or:#F5C21B;--nuit:#12130F;--craie:#FAF7EF;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--nuit);font-family:"Arial Black","Segoe UI",Arial,sans-serif;color:var(--craie);
    display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
  header{width:100%;max-width:430px;padding:10px 14px 6px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:18px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:8.5px;letter-spacing:2.5px;color:#8b8f84;margin-top:3px;}
  .scores{text-align:right;line-height:1.25;}
  .scores .val{font-size:19px;color:var(--or);}
  .scores .lbl{font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;color:#8b8f84;}
  #msg{height:22px;font-size:13px;letter-spacing:.5px;text-align:center;color:var(--or);}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;justify-content:center;padding:0 10px 4px;}
  canvas{display:block;border-radius:12px;}
  #cmd{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;}
  .btnC{width:78px;height:78px;border-radius:50%;background:rgba(18,19,15,.55);border:2px solid rgba(250,247,239,.35);
    display:flex;align-items:center;justify-content:center;font-size:30px;pointer-events:auto;backdrop-filter:blur(2px);}
  .btnC:active{background:rgba(245,194,27,.4);}
  #fin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,19,15,.9);text-align:center;padding:22px;border-radius:12px;}
  #fin h2{font-size:28px;color:var(--or);margin-bottom:6px;}
  #fin p{font-family:Arial,sans-serif;font-size:14px;color:#c9ccc0;margin-bottom:18px;line-height:1.5;}
  #fin button{font-family:inherit;font-size:15px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:13px 32px;}
  footer{width:100%;max-width:430px;padding:6px 14px 10px;text-align:center;
    font-family:Arial,sans-serif;font-size:10.5px;color:#6c7064;letter-spacing:.5px;}
</style>
</head>
<body>
<header>
  <div class="logo">MOTO TRIAL <span>FASO</span><small>PILOTE SANS TOMBER</small></div>
  <div style="display:flex;align-items:center;gap:8px">
    <button id="btnSon" style="background:none;border:1px solid #57594f;color:var(--craie);border-radius:999px;width:30px;height:30px;font-size:13px">🔊</button>
    <div class="scores"><div class="val" id="dist">0 m</div>
    <div class="lbl">RECORD <span id="best">0</span></div></div>
  </div>
</header>
<div id="msg">Accélère à droite, penche avec les boutons 🏍️</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="cmd">
    <div class="btnC" id="bFrein">◀</div>
    <div class="btnC" id="bGaz">▶</div>
  </div>
  <div id="fin"><h2 id="finTitre"></h2><p id="finTexte"></p><button id="rejouer">REJOUER</button></div>
</div>
<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>

// ---------- Son ----------
var actx,muet=false;
try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function tone(f,d,t,v,gl){if(muet)return;try{var c=ac(),o=c.createOscillator(),g=c.createGain();
o.type=t||'sine';o.frequency.value=f;if(gl)o.frequency.linearRampToValueAtTime(gl,c.currentTime+d);
g.gain.value=v||0.12;g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
var SFX={saut:function(){tone(300,0.12,'square',0.07,620);},
  atterri:function(){tone(140,0.09,'sine',0.09);},
  crash:function(){[300,200,120].forEach(function(f,i){setTimeout(function(){tone(f,0.2,'sawtooth',0.11);},i*70);});},
  victoire:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.17,'sine',0.14);},i*85);});},
  bonus:function(){tone(988,0.08,'triangle',0.11,1500);},
  estMuet:function(){return muet;},
  toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}};
(function(){var b=document.getElementById('btnSon');
function m(){b.textContent=SFX.estMuet()?'🔇':'🔊';}m();
b.addEventListener('click',function(){SFX.toggle();m();});})();

var IMG={},texPretes=false,patSable=null;
(function(){
  var cles=Object.keys(TEX),n=0;
  cles.forEach(function(k){

function texOk(k){return texPretes&&IMG[k]&&IMG[k].complete&&IMG[k].naturalWidth;}
var cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
var distEl=document.getElementById('dist'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');

var W=0,H=0,DPR=1;
function resize(){

  W=r.width-20;H=r.height-8;
  cvs.style.width=W+'px';cvs.style.height=H+'px';

// ---------- Terrain ----------
var terrain=[], SEG=26, terrainMax=0;
function hauteurBase(){return H*0.62;}
function genererTerrain(jusqua){
  while(terrainMax<jusqua){
    var i=terrain.length;
    var x=i*SEG;
    var y;
    if(i<8){ y=hauteurBase(); }
    else{
      var p=i*0.055;
      var collines=Math.sin(p)*H*0.10+Math.sin(p*0.42+1.3)*H*0.13+Math.sin(p*2.1)*H*0.035;
      // rampes ponctuelles
      var bosse=0;
      var mod=i%47;
      if(mod>=20&&mod<=27){ bosse=-Math.sin((mod-20)/7*Math.PI)*H*0.17; }
      var mod2=i%83;
      if(mod2>=40&&mod2<=52){ bosse-=Math.sin((mod2-40)/12*Math.PI)*H*0.13; }
      y=hauteurBase()+collines+bosse;
      y=Math.max(H*0.30,Math.min(H*0.86,y));
    }
    terrain.push({x:x,y:y});
    terrainMax=x;
  }
}
function solY(x){
  var i=Math.floor(x/SEG);
  if(i<0)i=0;
  genererTerrain(x+SEG*40);
  if(i>=terrain.length-1)return hauteurBase();
  var a=terrain[i],b2=terrain[i+1];
  var t=(x-a.x)/SEG;
  return a.y+(b2.y-a.y)*t;
}
function penteSol(x){
  var y1=solY(x-6),y2=solY(x+6);
  return Math.atan2(y2-y1,12);
}

// ---------- Moto ----------
var moto,cam,alive,tempsDebut,record=0,pieces=[],retournements,angleCumul,dernierAngle;
var gaz=false,frein=false,enAir=false,tempsAir=0;
function reset(){
  terrain=[];terrainMax=0;genererTerrain(W*3);
  moto={x:60,y:hauteurBase()-30,vx:0,vy:0,angle:0,va:0,rayon:13,empatt:19};
  cam=0;alive=true;tempsDebut=Date.now();
  pieces=[];retournements=0;angleCumul=0;dernierAngle=0;
  enAir=false;tempsAir=0;
  for(var k=1;k<80;k++){
    var px=k*140+80;
    pieces.push({x:px,y:solY(px)-42-Math.random()*40,pris:false});
  }
  fin.style.display='none';
  msg.textContent="Accélère à droite, penche avec les boutons 🏍️";
}

function angleNorm(a){
  while(a>Math.PI)a-=Math.PI*2;
  while(a<-Math.PI)a+=Math.PI*2;
  return a;
}
function step(dt){
  if(!alive)return;
  var G=0.42;
  // moteur
  if(gaz)moto.vx+=0.30*dt;
  if(frein)moto.vx-=0.34*dt;
  moto.vx*=Math.pow(0.992,dt);
  if(moto.vx<0)moto.vx*=0.9;
  moto.vx=Math.max(-3.2,Math.min(8.4,moto.vx));

  // gravité
  moto.vy+=G*dt;
  moto.x+=moto.vx*dt;
  moto.y+=moto.vy*dt;

  // roues : positions selon l'angle
  var ca=Math.cos(moto.angle),sa=Math.sin(moto.angle);
  var arrX=moto.x-ca*moto.empatt, arrY=moto.y-sa*moto.empatt;
  var avX=moto.x+ca*moto.empatt,  avY=moto.y+sa*moto.empatt;
  var solArr=solY(arrX)-moto.rayon, solAv=solY(avX)-moto.rayon;

  var contactArr=arrY>=solArr-1, contactAv=avY>=solAv-1;
  var contact=contactArr||contactAv;

  if(contact){
    if(enAir&&tempsAir>12){SFX.atterri();VFX.particule(moto.x,moto.y+18,{n:8,vitesse:2.2,taille:3,col:'#c9a066',gravite:0.2,decl:0.04});}
    enAir=false;tempsAir=0;
    // replacer sur le sol
    var cible=Math.min(contactArr?solArr:1e9,contactAv?solAv:1e9);
    var corr=0;
    if(contactArr&&contactAv)corr=Math.min(arrY-solArr,avY-solAv);
    else if(contactArr)corr=arrY-solArr;
    else corr=avY-solAv;
    moto.y-=corr;
    if(moto.vy>0){
      if(moto.vy>9.5&&Math.abs(angleNorm(moto.angle))>1.35)return crash('Réception ratée !');
      moto.vy*=-0.16;
    }
    // aligner sur la pente
    var pente=penteSol(moto.x);
    var diff=pente-angleNorm(moto.angle);
    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;
    moto.va+=diff*0.26*dt;
    moto.va*=Math.pow(0.72,dt);
    // wheeling si on accélère fort
    if(gaz&&moto.vx>2.2)moto.va-=0.0034*dt;
    // frottement
    moto.vx*=Math.pow(0.995,dt);
    // tête dans le sol = chute
    if(Math.abs(angleNorm(moto.angle))>2.25)return crash('La tête dans le sable !');
  }else{
    enAir=true;tempsAir+=dt;
    // contrôle aérien
    if(gaz)moto.va+=0.0062*dt;
    if(frein)moto.va-=0.0062*dt;
    moto.va*=Math.pow(0.995,dt);
  }
  moto.angle+=moto.va*dt;

  // comptage des loopings
  var da=moto.angle-dernierAngle;
  while(da>Math.PI)da-=Math.PI*2;
  while(da<-Math.PI)da+=Math.PI*2;
  if(enAir)angleCumul+=da;
  dernierAngle=moto.angle;
  if(Math.abs(angleCumul)>Math.PI*2){
    retournements++;angleCumul=0;
    SFX.bonus();
    msg.textContent='🌀 Salto ! +'+(retournements*50)+' pts bonus';
    VFX.particule(moto.x,moto.y,{n:14,vitesse:3.4,taille:4,col:'#F5C21B',gravite:0.1,decl:0.03});
  }

  // pièces
  for(var i=0;i<pieces.length;i++){
    var p=pieces[i];
    if(p.pris)continue;
    if(Math.abs(p.x-moto.x)<20&&Math.abs(p.y-moto.y)<24){
      p.pris=true;SFX.bonus();
      VFX.particule(p.x,p.y,{n:9,vitesse:2.6,taille:3.4,col:'#F5C21B',gravite:0.08,decl:0.035});
    }
  }

  // sortie par le bas
  if(moto.y>H+80)return crash('Tombé du décor !');
  // caméra
  var cible2=moto.x-W*0.32;
  cam+=(cible2-cam)*0.11*dt;
  if(cam<0)cam=0;
  distEl.textContent=Math.floor(moto.x/12)+' m';
}

function crash(raison){
  alive=false;
  SFX.crash();
  VFX.secousse(11,18);VFX.flash('#E32219',12);
  VFX.particule(moto.x,moto.y,{n:22,vitesse:4.2,taille:4.5,col:'#E32219',gravite:0.22,decl:0.024});
  VFX.particule(moto.x,moto.y+16,{n:12,vitesse:2.8,taille:4,col:'#c9a066',gravite:0.24,decl:0.03});
  var m=Math.floor(moto.x/12);
  var prises=pieces.filter(function(p){return p.pris;}).length;
  var score=m*2+prises*25+retournements*50;
  if(m>record){record=m;bestEl.textContent=record;}
  finTitre.textContent=m+' m';
  finTexte.textContent=raison+' Tu as ramassé '+prises+' pièce'+(prises>1?'s':'')+
    (retournements>0?' et réussi '+retournements+' salto'+(retournements>1?'s':''):'')+
    '. Score : '+score+' pts.';
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Moto Trial',score:score,victoire:m>=250},'*');}catch(e){}}
  setTimeout(function(){fin.style.display='flex';},600);
}
document.getElementById('rejouer').addEventListener('click',function(){VFX.reset();reset();});

// ---------- Rendu ----------
function draw(dt){
  var secoue=VFX.appliquerSecousse(ctx,dt);
  // ciel
  if(texOk('CIEL')){
    var iw=IMG.CIEL.naturalWidth, ih=IMG.CIEL.naturalHeight;
    var ech=Math.max(W/iw, H/ih);
    var dw=iw*ech, dh=ih*ech;
    ctx.drawImage(IMG.CIEL,(W-dw)/2,0,dw,dh);
  }else{
    var ciel=ctx.createLinearGradient(0,0,0,H);
    ciel.addColorStop(0,'#5eb8e8');ciel.addColorStop(0.55,'#9fd8f0');ciel.addColorStop(1,'#e8d9a8');
    ctx.fillStyle=ciel;ctx.fillRect(0,0,W,H);
    var sol2=ctx.createRadialGradient(W*0.78,H*0.16,4,W*0.78,H*0.16,46);
    sol2.addColorStop(0,'rgba(255,250,200,.95)');sol2.addColorStop(1,'rgba(255,240,150,0)');
    ctx.fillStyle=sol2;ctx.beginPath();ctx.arc(W*0.78,H*0.16,46,0,7);ctx.fill();
  }

  // montagnes lointaines (parallaxe lente)
  ctx.fillStyle='rgba(120,150,120,.42)';
  ctx.beginPath();ctx.moveTo(0,H*0.60);
  for(var mx=0;mx<=W;mx+=18){
    var wx=(mx+cam*0.15)*0.012;
    ctx.lineTo(mx,H*0.46+Math.sin(wx)*20+Math.sin(wx*2.3)*10);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  // palmiers (parallaxe moyenne)
  for(var pi=0;pi<14;pi++){
    var px2=(pi*260-(cam*0.45)%(260*14)+260*14)%(260*14)-60;
    if(px2<-120||px2>W+120)continue;
    var ech2=0.75+((pi*7)%3)*0.13;
    if(texOk('PALMIER')){
      var pw2=IMG.PALMIER.naturalWidth*ech2*0.9;
      var ph2=IMG.PALMIER.naturalHeight*ech2*0.9;
      ctx.drawImage(IMG.PALMIER,px2-pw2/2,H*0.66-ph2,pw2,ph2);
    }else{
      dessinerPalmier(px2,H*0.66,ech2);
    }
  }

  ctx.save();
  ctx.translate(-cam,0);

  // terrain (sable)
  genererTerrain(cam+W+SEG*10);
  var i0=Math.max(0,Math.floor(cam/SEG)-2), i1=Math.min(terrain.length-1,Math.floor((cam+W)/SEG)+3);
  ctx.beginPath();
  ctx.moveTo(terrain[i0].x,H+50);
  for(var ii=i0;ii<=i1;ii++)ctx.lineTo(terrain[ii].x,terrain[ii].y);
  ctx.lineTo(terrain[i1].x,H+50);ctx.closePath();
  if(texOk('SABLE')){
    if(!patSable)patSable=ctx.createPattern(IMG.SABLE,'repeat');
    ctx.fillStyle=patSable;
    ctx.fill();
    // ombrage vers le bas pour la profondeur
    ctx.save();ctx.clip();
    var omb=ctx.createLinearGradient(0,H*0.45,0,H);
    omb.addColorStop(0,'rgba(255,220,160,.10)');
    omb.addColorStop(1,'rgba(60,25,5,.45)');
    ctx.fillStyle=omb;ctx.fillRect(cam-20,0,W+40,H);
    ctx.restore();
  }else{
    var sable=ctx.createLinearGradient(0,H*0.4,0,H);
    sable.addColorStop(0,'#f0c878');sable.addColorStop(0.4,'#dba85a');sable.addColorStop(1,'#a87838');
    ctx.fillStyle=sable;ctx.fill();
  }
  // liseré supérieur du sol
  ctx.strokeStyle='#8a5a2a';ctx.lineWidth=3;
  ctx.beginPath();
  for(var jj=i0;jj<=i1;jj++){if(jj===i0)ctx.moveTo(terrain[jj].x,terrain[jj].y);else ctx.lineTo(terrain[jj].x,terrain[jj].y);}
  ctx.stroke();
  // touffes d'herbe
  for(var hh=i0;hh<=i1;hh+=3){
    var t2=terrain[hh];
    ctx.strokeStyle='rgba(60,120,50,.6)';ctx.lineWidth=1.8;
    for(var b3=0;b3<3;b3++){
      ctx.beginPath();ctx.moveTo(t2.x+b3*4,t2.y);
      ctx.lineTo(t2.x+b3*4+(b3-1)*3,t2.y-7-((hh+b3)%3)*3);ctx.stroke();
    }
  }

  // pièces
  for(var pk=0;pk<pieces.length;pk++){
    var pc=pieces[pk];
    if(pc.pris)continue;
    if(pc.x<cam-40||pc.x>cam+W+40)continue;
    var puls=1+Math.sin(Date.now()*0.005+pk)*0.12;
    ctx.save();ctx.translate(pc.x,pc.y);
    ctx.shadowBlur=10;ctx.shadowColor='rgba(245,194,27,.8)';
    var gp=ctx.createRadialGradient(-3,-3,1,0,0,10*puls);
    gp.addColorStop(0,'#fff3b0');gp.addColorStop(1,'#d9a406');
    ctx.fillStyle=gp;ctx.beginPath();ctx.arc(0,0,9.5*puls,0,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(120,80,0,.5)';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('F',0,0.5);
    ctx.restore();
  }

  // moto
  dessinerMoto();

  VFX.maj(ctx,dt,W+cam,H);
  ctx.restore();
  if(secoue)ctx.restore();
}

function dessinerPalmier(x,y,ech){
  ctx.save();ctx.translate(x,y);ctx.scale(ech,ech);
  // tronc
  ctx.strokeStyle='#8a6a3a';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-8,-60,-4,-108);ctx.stroke();
  ctx.strokeStyle='rgba(60,42,20,.4)';ctx.lineWidth=2;
  for(var s=0;s<7;s++){
    var ty=-14-s*14;
    ctx.beginPath();ctx.moveTo(-8+s*0.6,ty);ctx.lineTo(2+s*0.4,ty-2);ctx.stroke();
  }
  // palmes
  var pal=['#2e8b45','#3aa055','#256e37'];
  for(var f=0;f<7;f++){
    var a=(-Math.PI*0.92)+f*(Math.PI*1.05/6);
    ctx.save();ctx.translate(-4,-108);ctx.rotate(a);
    ctx.fillStyle=pal[f%3];
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(30,-13,62,-3);
    ctx.quadraticCurveTo(32,7,0,5);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  // noix de coco
  ctx.fillStyle='#5a3a1f';
  ctx.beginPath();ctx.arc(-11,-101,5,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(2,-99,4.5,0,7);ctx.fill();
  ctx.restore();
}

function dessinerMoto(){
  var ca=Math.cos(moto.angle),sa=Math.sin(moto.angle);
  var arrX=moto.x-ca*moto.empatt, arrY=moto.y-sa*moto.empatt;
  var avX=moto.x+ca*moto.empatt,  avY=moto.y+sa*moto.empatt;
  var sy=solY(moto.x);
  // ombre au sol
  ctx.fillStyle='rgba(80,40,10,.32)';
  ctx.beginPath();ctx.ellipse(moto.x,sy+2,26,5.5,0,0,7);ctx.fill();

  var utilise=texOk('MOTO')&&texOk('ROUE');
  if(utilise){
    var rd=moto.rayon*2.35; // diamètre visuel de la roue
    // ROUES (tournent selon la distance parcourue)
    [[arrX,arrY],[avX,avY]].forEach(function(r){
      ctx.save();
      ctx.translate(r[0],r[1]);
      ctx.rotate(moto.x*0.055);
      ctx.drawImage(IMG.ROUE,-rd/2,-rd/2,rd,rd);
      ctx.restore();
    });
    // CHÂSSIS
    ctx.save();
    ctx.translate(moto.x,moto.y);
    ctx.rotate(moto.angle);
    var mw=moto.empatt*3.5;
    var mh=mw*IMG.MOTO.naturalHeight/IMG.MOTO.naturalWidth;
    ctx.drawImage(IMG.MOTO,-mw*0.50,-mh*0.62,mw,mh);
    // PILOTE (penché en avant si on accélère)
    if(texOk('PILOTE')){
      var pw3=moto.empatt*2.15;
      var ph3=pw3*IMG.PILOTE.naturalHeight/IMG.PILOTE.naturalWidth;
      var penche=gaz?0.10:(frein?-0.09:0);
      ctx.save();
      ctx.translate(-2,-mh*0.42);
      ctx.rotate(penche);
      ctx.drawImage(IMG.PILOTE,-pw3*0.42,-ph3*0.88,pw3,ph3);
      ctx.restore();
    }
    ctx.restore();
    return;
  }

  // --- repli vectoriel si les images ne chargent pas ---
  [[arrX,arrY],[avX,avY]].forEach(function(r){
    ctx.save();ctx.translate(r[0],r[1]);ctx.rotate(moto.x*0.09);
    ctx.fillStyle='#1a1a18';
    ctx.beginPath();ctx.arc(0,0,moto.rayon,0,7);ctx.fill();
    ctx.strokeStyle='#3d3d38';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,moto.rayon-2.5,0,7);ctx.stroke();
    ctx.strokeStyle='#c9c4b6';ctx.lineWidth=1.6;
    for(var s2=0;s2<5;s2++){
      var aa=s2*Math.PI*2/5;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(aa)*(moto.rayon-4),Math.sin(aa)*(moto.rayon-4));ctx.stroke();
    }
    ctx.fillStyle='#F5C21B';
    ctx.beginPath();ctx.arc(0,0,3,0,7);ctx.fill();
    ctx.restore();
  });
  ctx.save();
  ctx.translate(moto.x,moto.y);
  ctx.rotate(moto.angle);
  ctx.strokeStyle='#E32219';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-moto.empatt,0);ctx.lineTo(-4,-9);ctx.lineTo(10,-7);ctx.lineTo(moto.empatt,0);
  ctx.stroke();
  ctx.fillStyle='#E32219';
  ctx.beginPath();
  ctx.moveTo(-9,-6);ctx.lineTo(6,-10);ctx.lineTo(15,-4);ctx.lineTo(2,-1);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#4a4a45';
  ctx.beginPath();ctx.roundRect(-6,-4,13,9,2);ctx.fill();
  ctx.strokeStyle='#2a2a26';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(13,-6);ctx.lineTo(17,-15);ctx.stroke();
  ctx.fillStyle='#0E7A3C';
  ctx.beginPath();ctx.roundRect(-6,-24,12,15,4);ctx.fill();
  ctx.strokeStyle='#0E7A3C';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(2,-18);ctx.lineTo(15,-14);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-3,-11);ctx.lineTo(-6,-2);ctx.stroke();
  ctx.fillStyle='#F5C21B';
  ctx.beginPath();ctx.arc(0,-28,7,0,7);ctx.fill();
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.arc(3,-28,4.5,-0.7,0.7);ctx.fill();
  ctx.restore();
}

// ---------- Kit VFX ----------
var VFX=(function(){
  var shake={t:0,force:0},particules=[],flashes=[];
  function secousse(f,d){shake.force=f;shake.t=d||12;}
  function appliquerSecousse(c,dt){
    if(shake.t<=0)return false;
    shake.t-=dt;var f=shake.force*(shake.t/12);
    c.save();c.translate((Math.random()-0.5)*f,(Math.random()-0.5)*f);return true;
  }
  function particule(x,y,o){o=o||{};var n=o.n||12;
    for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=(o.vitesse||3)*(0.5+Math.random());
      particules.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:o.gravite!==undefined?o.gravite:0.12,
        vie:1,decl:o.decl||0.025,taille:(o.taille||4)*(0.6+Math.random()*0.8),col:o.col||'#F5C21B'});}}
  function flash(c,d){flashes.push({col:c||'#FFF',vie:1,decl:1/(d||10)});}
  function maj(c,dt,w,h){
    for(var i=particules.length-1;i>=0;i--){var p=particules[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=p.decl*dt;
      if(p.vie<=0){particules.splice(i,1);continue;}
      c.globalAlpha=Math.max(0,p.vie);c.fillStyle=p.col;
      c.beginPath();c.arc(p.x,p.y,p.taille*p.vie,0,7);c.fill();c.globalAlpha=1;}
    for(var j=flashes.length-1;j>=0;j--){var f=flashes[j];f.vie-=f.decl*dt;
      if(f.vie<=0){flashes.splice(j,1);continue;}
      c.globalAlpha=f.vie*0.45;c.fillStyle=f.col;c.fillRect(cam-10,0,w+20,h);c.globalAlpha=1;}}
  function reset(){particules=[];flashes=[];shake.t=0;}
  return{secousse:secousse,appliquerSecousse:appliquerSecousse,particule:particule,flash:flash,maj:maj,reset:reset,
    nb:function(){return particules.length;}};
})();

// ---------- Commandes ----------
function presser(el,set){
  el.addEventListener('touchstart',function(e){set(true);e.preventDefault();},{passive:false});
  el.addEventListener('touchend',function(e){set(false);e.preventDefault();},{passive:false});
  el.addEventListener('mousedown',function(){set(true);});
  window.addEventListener('mouseup',function(){set(false);});
}
presser(document.getElementById('bGaz'),function(v){gaz=v;});
presser(document.getElementById('bFrein'),function(v){frein=v;});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')gaz=true;
  if(e.key==='ArrowLeft')frein=true;
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowRight')gaz=false;
  if(e.key==='ArrowLeft')frein=false;
});

window.__trial={
  state:function(){return {x:moto.x,y:moto.y,angle:moto.angle,vx:moto.vx,alive:alive,
    m:Math.floor(moto.x/12),enAir:enAir,retournements:retournements,
    prises:pieces.filter(function(p){return p.pris;}).length,particules:VFX.nb(),muet:SFX.estMuet()};},
  gaz:function(v){gaz=v;},frein:function(v){frein=v;},
  forcerCrash:function(){crash('Test');}
};

var last=0;
function loop(now){
  var dt=Math.min(2.5,(now-last)/16.7);last=now;
  step(dt);draw(dt);
  requestAnimationFrame(loop);
}
resize();reset();
requestAnimationFrame(loop);
})();
</script>
