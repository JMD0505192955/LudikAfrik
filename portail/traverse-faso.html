<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Traverse Faso</title>
<style>
  :root{--vert:#0E7A3C;--rouge:#E32219;--or:#F5C21B;--nuit:#12130F;--craie:#FAF7EF;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--nuit);font-family:"Arial Black","Segoe UI",Arial,sans-serif;color:var(--craie);
    display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
  header{width:100%;max-width:430px;padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:20px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:9px;letter-spacing:3px;color:#8b8f84;margin-top:3px;}
  .scores{text-align:right;line-height:1.25;}
  .scores .val{font-size:20px;color:var(--or);}
  .scores .lbl{font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;color:#8b8f84;}
  #msg{height:26px;font-size:14px;letter-spacing:.5px;text-align:center;color:var(--or);}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;justify-content:center;padding:0 12px 4px;}
  canvas{display:block;border-radius:14px;}
  #fin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,19,15,.88);text-align:center;padding:24px;border-radius:14px;}
  #fin h2{font-size:30px;color:var(--or);margin-bottom:6px;}
  #fin p{font-family:Arial,sans-serif;font-size:14px;color:#c9ccc0;margin-bottom:20px;line-height:1.5;}
  #fin button{font-family:inherit;font-size:16px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:14px 34px;}
  #fin button:active{transform:scale(.96);}
  footer{width:100%;max-width:430px;padding:8px 16px 14px;text-align:center;
    font-family:Arial,sans-serif;font-size:11px;color:#6c7064;letter-spacing:.5px;}
</style>
</head>
<body>
<header>
  <div class="logo">TRAVERSE <span>FASO</span><small>L'AVENUE AUX MILLE MOTOS</small></div>
  <div style="display:flex;align-items:center;gap:0"><button id="btnSon" style="background:none;border:1px solid #57594f;color:var(--craie);border-radius:999px;width:32px;height:32px;font-size:14px;margin-right:8px">🔊</button>
<div class="scores"><div class="val" id="score">0</div>
  <div class="lbl">VIES <span id="vies">❤❤❤</span></div></div>
</div>
</header>
<div id="msg">Touche l'écran pour avancer, glisse pour te déplacer 🚸</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="fin"><h2 id="finTitre"></h2><p id="finTexte"></p><button id="rejouer">REJOUER</button></div>
</div>
<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>
<script>
(function(){
"use strict";
// ===== Kit sonore Faso Games (synthétisé, 0 Ko d'assets, silencieux par défaut respecté) =====
var SFX=(function(){
  var ctx,muet=false;
  try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
  function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
  function tone(freq,dur,type,vol,glide){
    if(muet)return;
    try{
      var c=ac();var o=c.createOscillator();var g=c.createGain();
      o.type=type||'sine';o.frequency.value=freq;
      if(glide)o.frequency.linearRampToValueAtTime(glide,c.currentTime+dur);
      g.gain.value=vol||0.15;
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+dur);
    }catch(e){}
  }
  return{
    tap:function(){tone(440,0.05,'square',0.08);},
    bon:function(){tone(523,0.09,'sine',0.14);setTimeout(function(){tone(784,0.12,'sine',0.14);},70);},
    mauvais:function(){tone(160,0.22,'sawtooth',0.12,90);},
    victoire:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'sine',0.15);},i*90);});},
    defaite:function(){[392,330,262].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'sine',0.12);},i*120);});},
    piece:function(){tone(988,0.08,'triangle',0.12,1400);},
    tick:function(){tone(300,0.03,'square',0.05);},
    estMuet:function(){return muet;},
    toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}
  };
})();
// Bouton mute (à placer dans le header de chaque jeu)
function initBoutonSon(id){
  var b=document.getElementById(id);
  if(!b)return;
  function maj(){b.textContent=SFX.estMuet()?'🔇':'🔊';}
  maj();
  b.addEventListener('click',function(){SFX.toggle();maj();});
}
// Confetti simple (petites particules colorées, pour les écrans de victoire)
function confetti(canvas,ctx,cx,cy){
  var parts=[];
  var couleurs=['#F5C21B','#E32219','#0E7A3C','#3d5a80','#FAF7EF'];
  for(var i=0;i<24;i++){
    var a=Math.random()*Math.PI*2,v=2+Math.random()*3;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:0.12,vie:1,col:couleurs[i%couleurs.length],taille:3+Math.random()*3});
  }
  return parts;
}
function drawConfetti(ctx,parts,dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=0.018*dt;
    if(p.vie<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.vie);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.taille/2,p.y-p.taille/2,p.taille,p.taille);
    ctx.globalAlpha=1;
  }
}
initBoutonSon("btnSon");

const finTitre=document.getElementById('finTitre'),finTexte=document.getElementById('finTexte');
let W=0,H=0,DPR=1,CELL=0;
let confettiParts=[];
const COLSN=9, ROWS=12;
// rangées : 0 trottoir haut (but), 1-5 voies sens droite→gauche, 6 terre-plein, 7-10 voies gauche→droite, 11 trottoir bas
const SAFE=[0,6,11];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cvs.parentElement.getBoundingClientRect();
  W=r.width-24;H=r.height-8;
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  cvs.width=W*DPR;cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CELL=Math.min(W/COLSN,H/ROWS);
}
window.addEventListener('resize',resize);

let pieton, lanes, score=0, vies=3, traversees=0, over=false, started=false, mult=1, flashT=0;

const TYPES={
  moto:   {w:1.0, h:0.80, v:2.6, col:'#E32219'},
  taxi:   {w:1.8, h:0.86, v:1.7, col:'#128a44'},
  camion: {w:2.7, h:0.90, v:1.1, col:'#c9c4b6'},
  charrette:{w:2.0,h:0.84, v:0.6, col:'#8a5a33'},
};
function reset(full){
  if(full){score=0;vies=3;traversees=0;mult=1;
    scoreEl.textContent='0';viesEl.textContent='❤❤❤';}
  pieton={c:4,r:11,px:4,pr:11,maxR:11};
  buildLanes();
  over=false;flashT=0;
  msg.textContent=full?"Touche l'écran pour avancer, glisse pour te déplacer 🚸":"C'est reparti !";
}
function buildLanes(){
  lanes=[];
  const kinds=['moto','taxi','moto','camion','charrette'];
  for(let r=1;r<=10;r++){
    if(SAFE.includes(r))continue;
    const dir=r<=5?-1:1;
    const type=kinds[(r*3+traversees)%kinds.length];
    lanes.push({r,dir,type,
      speed:TYPES[type].v*(0.85+Math.random()*0.4)*mult,
      gap:2.6+Math.random()*2.2,
      cars:[],spawn:Math.random()*60});
  }
}
function step(dt){
  if(flashT>0)flashT-=dt;
  for(const l of lanes){
    l.spawn-=dt;
    const T=TYPES[l.type];
    if(l.spawn<=0){
      l.cars.push({x:l.dir===1?-T.w-0.5:COLSN+0.5});
      l.spawn=(l.gap+T.w)/l.speed*60/ (started?1:1);
    }
    for(const c of l.cars)c.x+=l.dir*l.speed*dt/60*4;
    l.cars=l.cars.filter(c=>c.x>-4&&c.x<COLSN+4);
  }
  if(over)return;
  // interpolation du pas
  pieton.px+=(pieton.c-pieton.px)*0.35*dt;
  pieton.pr+=(pieton.r-pieton.pr)*0.35*dt;
  // collision
  if(!SAFE.includes(pieton.r)){
    const l=lanes.find(x=>x.r===pieton.r);
    if(l){
      const T=TYPES[l.type];
      for(const c of l.cars){
        if(pieton.px+0.32>c.x&&pieton.px-0.32<c.x+T.w){
          return touche();
        }
      }
    }
  }
}
function touche(){
  vies--;
  viesEl.textContent='❤'.repeat(Math.max(0,vies));
  flashT=18;
  SFX.mauvais();
  if(vies<=0){
    finTitre.textContent=score+" pts";
    finTexte.textContent=traversees>=6?"Champion du goudron ! Le classement hebdo t'attend."
      :traversees>=3?"Belles traversées ! L'avenue s'énerve à chaque passage."
      :"L'avenue de Ouaga ne pardonne pas... Observe le trafic et rejoue !";
    if(traversees>=6){SFX.victoire();confettiParts=confetti(cvs,ctx,W/2,H*0.4);}else{SFX.defaite();}
    if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Traverse !',score:score,victoire:traversees>=6},'*');}catch(e){}}
  fin.style.display='flex';
    over=true;
    return;
  }
  msg.textContent="💥 Touché ! Plus que "+vies+" vie"+(vies>1?"s":"");
  pieton={c:4,r:11,px:4,pr:11,maxR:11};
}
function bouge(dc,dr){
  if(over)return;
  if(!started){started=true;msg.textContent="Traverse jusqu'en haut !";}
  const nc=pieton.c+dc, nr=pieton.r+dr;
  if(nc<0||nc>=COLSN||nr<0||nr>=ROWS)return;
  pieton.c=nc;pieton.r=nr;
  if(nr<pieton.maxR){
    pieton.maxR=nr;
    score+=10;scoreEl.textContent=score;
  }
  if(nr===0){
    traversees++;mult=1+traversees*0.16;
    score+=100;scoreEl.textContent=score;
    msg.textContent="🎉 Traversée n°"+traversees+" ! +100";
    SFX.bon();
    setTimeout(()=>{if(!over)reset(false);},600);
  }
}
document.getElementById('rejouer').addEventListener('click',()=>{fin.style.display='none';confettiParts=[];reset(true);});

// ---- Rendu ----
function rowY(r){return (H-ROWS*CELL)/2+r*CELL;}
function draw(){
  ctx.fillStyle='#12130F';ctx.fillRect(0,0,W,H);
  const ox=(W-COLSN*CELL)/2;
  if(texOk('BITUME')&&!patBitume)patBitume=ctx.createPattern(IMG.BITUME,'repeat');
  if(texOk('TROTTOIR')&&!patTrottoir)patTrottoir=ctx.createPattern(IMG.TROTTOIR,'repeat');
  for(let r=0;r<ROWS;r++){
    const y=rowY(r);
    if(SAFE.includes(r)){
      if(r===6){
        // terre-plein central
        if(patTrottoir){ctx.save();ctx.translate(0,y);ctx.fillStyle=patTrottoir;ctx.fillRect(ox,0,COLSN*CELL,CELL);ctx.restore();}
        else{ctx.fillStyle='#0A5C2D';ctx.fillRect(ox,y,COLSN*CELL,CELL);}
        ctx.fillStyle='rgba(250,247,239,.3)';
        for(let x=ox+8;x<ox+COLSN*CELL;x+=30)ctx.fillRect(x,y+CELL*0.42,4,CELL*0.22);
      }else{
        // trottoirs haut et bas (bordure retournée en haut)
        if(patTrottoir){
          ctx.save();
          if(r===0){ctx.translate(0,y+CELL);ctx.scale(1,-1);}else{ctx.translate(0,y);}
          ctx.fillStyle=patTrottoir;ctx.fillRect(ox,0,COLSN*CELL,CELL);
          ctx.restore();
        }else{
          ctx.fillStyle='#8a5a33';ctx.fillRect(ox,y,COLSN*CELL,CELL);
        }
      }
      if(r===0){
        ctx.save();
        ctx.shadowBlur=6;ctx.shadowColor='rgba(0,0,0,.8)';
        ctx.fillStyle='#F5C21B';
        ctx.font='bold '+Math.round(CELL*0.4)+'px Arial';
        ctx.textAlign='center';
        ctx.fillText('★ ARRIVÉE ★',ox+COLSN*CELL/2,y+CELL*0.62);
        ctx.restore();
      }
    }else{
      // chaussée bitume
      if(patBitume){ctx.save();ctx.translate(0,y);ctx.fillStyle=patBitume;ctx.fillRect(ox,0,COLSN*CELL,CELL);ctx.restore();}
      else{ctx.fillStyle='#3a3d36';ctx.fillRect(ox,y,COLSN*CELL,CELL);}
      // marquage au sol
      ctx.fillStyle='rgba(245,220,120,.65)';
      for(let x=ox;x<ox+COLSN*CELL;x+=34)ctx.fillRect(x,y+CELL-2,17,2.5);
    }
  }
  // véhicules
  const SPRITES={moto:'MOTO',taxi:'TAXI',camion:'CAMION',charrette:'CHARRETTE'};
  for(const l of lanes){
    const T=TYPES[l.type], y=rowY(l.r);
    for(const c of l.cars){
      const vx=ox+c.x*CELL, vy=y+CELL*(1-T.h)/2;
      const vw=T.w*CELL, vh=T.h*CELL;
      const cle=SPRITES[l.type];
      if(texOk(cle)){
        // ombre portée au sol
        ctx.fillStyle='rgba(0,0,0,.3)';
        ctx.beginPath();ctx.ellipse(vx+vw/2+2,vy+vh/2+3,vw*0.44,vh*0.36,0,0,7);ctx.fill();
        ctx.save();
        ctx.translate(vx+vw/2,vy+vh/2);
        // sprite orienté vers le haut -> pivoter vers la direction de circulation
        ctx.rotate(l.dir===1?Math.PI/2:-Math.PI/2);
        // après rotation, la longueur du sprite s'aligne sur vw
        ctx.drawImage(IMG[cle],-vh/2,-vw/2,vh,vw);
        ctx.restore();
      }else{
        ctx.fillStyle=T.col;
        ctx.beginPath();ctx.roundRect(vx,vy,vw,vh,5);ctx.fill();
        if(l.type==='moto'){
          ctx.fillStyle='#FAF7EF';
          ctx.beginPath();ctx.arc(vx+vw*(l.dir===1?0.75:0.25),vy+vh/2,CELL*0.14,0,7);ctx.fill();
        }else if(l.type==='taxi'){
          ctx.fillStyle='#F5C21B';
          ctx.fillRect(vx+vw*0.38,vy+2,vw*0.24,vh-4);
        }
      }
    }
  }
  // piéton
  const px=ox+(pieton.px+0.5)*CELL, py=rowY(pieton.pr)+CELL*0.5;
  if(texOk('PIETON')){
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();ctx.ellipse(px,py+CELL*0.26,CELL*0.24,CELL*0.10,0,0,7);ctx.fill();
    const ps=CELL*0.78;
    ctx.drawImage(IMG.PIETON,px-ps/2,py-ps/2,ps,ps);
  }else{
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(px,py+CELL*0.3,CELL*0.24,CELL*0.1,0,0,7);ctx.fill();
    ctx.fillStyle='#F5C21B';
    ctx.beginPath();ctx.roundRect(px-CELL*0.18,py-CELL*0.1,CELL*0.36,CELL*0.34,5);ctx.fill();
    ctx.fillStyle='#8a5a33';
    ctx.beginPath();ctx.arc(px,py-CELL*0.22,CELL*0.16,0,7);ctx.fill();
    ctx.fillStyle='#E32219';
    ctx.beginPath();ctx.arc(px,py-CELL*0.32,CELL*0.1,3.4,6);ctx.fill();
  }
  // flash de collision
  if(flashT>0&&Math.floor(flashT/4)%2===0){
    ctx.fillStyle='rgba(227,34,25,.28)';
    ctx.fillRect(0,0,W,H);
  }
}
// ---- Entrées : tap = avancer, swipe = direction ----
let ts=null;
cvs.addEventListener('touchstart',e=>{
  ts={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};
  e.preventDefault();
},{passive:false});
cvs.addEventListener('touchend',e=>{
  if(!ts)return;
  const dx=e.changedTouches[0].clientX-ts.x, dy=e.changedTouches[0].clientY-ts.y;
  ts=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22){bouge(0,-1);return;}
  if(Math.abs(dx)>Math.abs(dy))bouge(Math.sign(dx),0);
  else bouge(0,Math.sign(dy));
  e.preventDefault();
},{passive:false});
let ms=null;
cvs.addEventListener('mousedown',e=>{ms={x:e.clientX,y:e.clientY};});
window.addEventListener('mouseup',e=>{
  if(!ms)return;
  const dx=e.clientX-ms.x,dy=e.clientY-ms.y;ms=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22){bouge(0,-1);return;}
  if(Math.abs(dx)>Math.abs(dy))bouge(Math.sign(dx),0);
  else bouge(0,Math.sign(dy));
});
window.addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if(m[e.key]){bouge(...m[e.key]);e.preventDefault();}
});
window.__trav={state:()=>({score,vies,traversees,over,r:pieton.r,confettiN:confettiParts.length,muet:SFX.estMuet()}),bouge,
  forcerVictoire:()=>{traversees=6;vies=1;touche();}};
// ---- Boucle ----
let last=0;
function loop(now){
  const dt=Math.min(2.5,(now-last)/16.7);last=now;
  step(dt);draw();
  if(confettiParts.length)drawConfetti(ctx,confettiParts,dt);
  requestAnimationFrame(loop);
}
resize();reset(true);
requestAnimationFrame(loop);
})();
</script>
