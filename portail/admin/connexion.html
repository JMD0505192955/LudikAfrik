<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludikafrik — Administration</title>
<link rel="icon" href="../assets/favicon.svg">
<style>
  :root{--bleu:#012662;--jaune:#FBAD01;--ivoire:#FFF8E8;--ciel:#DCE8F8;--blanc:#fff;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--ivoire);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#1a2230;}
  .carte{background:var(--blanc);border-radius:20px;box-shadow:0 20px 60px rgba(1,38,98,.14);
    width:100%;max-width:400px;padding:38px 34px;}
  .logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px;}
  .logo svg{width:44px;height:44px;}
  .logo .nom{font-weight:800;font-size:22px;letter-spacing:.5px;color:var(--bleu);}
  .sous{text-align:center;color:#7a8194;font-size:13px;margin-bottom:28px;}
  label{display:block;font-size:12.5px;font-weight:600;color:#4a5266;margin:14px 0 6px;}
  input{width:100%;padding:12px 14px;border:1.5px solid #e2e0d4;border-radius:11px;
    font-size:15px;font-family:inherit;background:#fbfaf5;}
  input:focus{outline:none;border-color:var(--bleu);background:#fff;}
  button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:11px;
    background:var(--bleu);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  button:hover{background:#023680;}
  button:disabled{opacity:.6;cursor:default;}
  .err{background:#fdeceb;border:1px solid #f5c2bd;color:#c0392b;border-radius:10px;
    padding:10px 12px;font-size:13px;margin-top:16px;display:none;}
  .pied{text-align:center;font-size:11.5px;color:#a0a6b4;margin-top:22px;}
</style>
</head>
<body>
  <div class="carte">
    <div class="logo">
      <svg viewBox="0 0 120 120"><path d="M30 22 C30 17 35 14 39 17 L92 52 C97 55 97 61 92 64 L39 99 C35 102 30 99 30 94 Z" fill="#012662"/><circle cx="99" cy="80" r="15" fill="#FBAD01"/></svg>
      <span class="nom">LUDIKAFRIK</span>
    </div>
    <div class="sous">Espace d'administration</div>

    <label for="courriel">Adresse e-mail</label>
    <input id="courriel" type="email" autocomplete="username" placeholder="admin@ludikafrik.com">

    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password" placeholder="••••••••">

    <button id="btn">Se connecter</button>
    <div class="err" id="err"></div>
    <div class="pied">Accès réservé · Ludikafrik</div>
  </div>

<script>
  var $=function(i){return document.getElementById(i);};
  function erreur(m){var e=$('err');e.textContent=m;e.style.display='block';}
  // si déjà connecté, filer au tableau de bord
  if(localStorage.getItem('ludik_admin_jeton')) location.href='tableau.html';

  async function connecter(){
    var courriel=$('courriel').value.trim(), motdepasse=$('mdp').value;
    if(!courriel||!motdepasse){erreur('Renseigne l\'e-mail et le mot de passe.');return;}
    $('btn').disabled=true; $('err').style.display='none';
    try{
      var r=await fetch('/api/admin/connexion',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({courriel:courriel,motdepasse:motdepasse})});
      var j=await r.json();
      if(!r.ok||!j.ok){erreur(j.erreur||'Connexion impossible.');$('btn').disabled=false;return;}
      localStorage.setItem('ludik_admin_jeton',j.jeton);
      localStorage.setItem('ludik_admin_nom',j.admin.nom||'');
      location.href='tableau.html';
    }catch(e){erreur('Serveur injoignable.');$('btn').disabled=false;}
  }
  $('btn').addEventListener('click',connecter);
  $('mdp').addEventListener('keydown',function(e){if(e.key==='Enter')connecter();});
</script>
</body>
</html>
