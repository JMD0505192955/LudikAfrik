<style>

  html,body{height:100%;}
  body{background:var(--nuit);font-family:"Arial Black","Segoe UI",Arial,sans-serif;color:var(--craie);
    display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:manipulation;
    user-select:none;-webkit-user-select:none;}
  header{width:100%;max-width:430px;padding:10px 14px 6px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:18px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:8.5px;letter-spacing:2.5px;color:#8b8f84;margin-top:3px;}
  .scores{text-align:right;line-height:1.25;}
  .scores .val{font-size:19px;color:var(--or);}
  .scores .lbl{font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;color:#8b8f84;}
  #niveaux{display:flex;gap:6px;justify-content:center;padding:0 14px 8px;width:100%;max-width:430px;}
  .nivBtn{flex:1;background:#1d1f19;border:1.5px solid #2a2c24;color:#8b8f84;border-radius:999px;
    padding:7px 4px;font-family:inherit;font-size:11.5px;}
  .nivBtn.sel{background:var(--or);border-color:var(--or);color:var(--nuit);font-weight:bold;}
  .nivBtn:active{transform:scale(.96);}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;flex-direction:column;padding:0 14px 10px;}
  #barreTemps{height:6px;background:#1d1f19;border-radius:99px;overflow:hidden;margin-bottom:12px;}
  #barreTemps>div{height:100%;background:var(--or);width:100%;transition:width .1s linear;}
  #cat{text-align:center;font-family:Arial;font-size:11px;letter-spacing:1.5px;color:#8b8f84;
    text-transform:uppercase;margin-bottom:6px;}
  #cat b{color:var(--or);}
  #indice{text-align:center;font-family:Arial;font-size:12.5px;color:#c9ccc0;min-height:34px;
    margin-bottom:10px;line-height:1.4;font-style:italic;}
  #zoneRep{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;min-height:52px;margin-bottom:10px;
    align-content:flex-start;}
  .slot{width:34px;height:44px;border-radius:8px;background:#1d1f19;border:2px dashed #2a2c24;
    display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--craie);}
  .slot.plein{border-style:solid;border-color:var(--or);background:#2a2410;}
  .slot.bon{border-color:var(--vert);background:#0f2a17;}
  .slot.faux{border-color:var(--rouge);background:#2e0f0c;animation:secousse .4s;}
  @keyframes secousse{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  #zoneLettres{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px;}
  .lettre{width:40px;height:48px;border-radius:9px;background:#2a2c24;border:1.5px solid #3d4036;
    color:var(--craie);font-family:inherit;font-size:22px;display:flex;align-items:center;justify-content:center;
    transition:.12s;}
  .lettre:active{transform:scale(.92);}
  .lettre.prise{opacity:.22;pointer-events:none;}
  #actions{display:flex;gap:8px;margin-bottom:12px;}
  #actions button{flex:1;background:#1d1f19;border:1px solid #2a2c24;color:var(--craie);
    border-radius:10px;padding:11px 4px;font-family:inherit;font-size:12px;}
  #actions button:active{transform:scale(.97);}
  #actions .valider{background:var(--vert);border-color:var(--vert);font-weight:bold;}
  #actions .valider:disabled{opacity:.35;}
  #msg{text-align:center;height:24px;font-size:14px;color:var(--or);}
  #fin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,19,15,.95);text-align:center;padding:22px;}
  #fin h2{font-size:42px;color:var(--or);margin-bottom:4px;}
  #fin .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;width:100%;max-width:330px;margin:10px 0 18px;}
  #fin .stat{background:#1d1f19;border-radius:10px;padding:11px 5px;}
  #fin .stat .v{font-size:20px;font-weight:bold;color:var(--or);}
  #fin .stat .l{font-size:9.5px;color:#8b8f84;letter-spacing:1px;margin-top:2px;}
  #fin p{font-family:Arial;font-size:13.5px;color:#c9ccc0;margin-bottom:18px;line-height:1.5;max-width:330px;}
  #fin button{font-family:inherit;font-size:15px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:13px 34px;}
  #partageBtns{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px;margin-bottom:14px;}
  #partageBtns button{background:#1d1f19;border:1px solid #2a2c24;color:var(--craie);
    border-radius:10px;padding:11px;font-size:13px;letter-spacing:.3px;}
  #partageBtns button:active{transform:scale(.97);}
  #partageBtns #btnPartager{border-color:#25D366;color:#25D366;}
  #partageBtns #btnDefier{border-color:var(--or);color:var(--or);}
  footer{width:100%;max-width:430px;padding:6px 14px 10px;text-align:center;
    font-family:Arial;font-size:10.5px;color:#6c7064;letter-spacing:.5px;}
</style>
</head>

<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>

(function(){
"use strict";
// ---------- Son ----------
var actx,muet=false;
try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function tone(f,d,t,v,gl){if(muet)return;try{var c=ac(),o=c.createOscillator(),g=c.createGain();
o.type=t||'sine';o.frequency.value=f;if(gl)o.frequency.linearRampToValueAtTime(gl,c.currentTime+d);
g.gain.value=v||0.12;g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
var tickTimer=null;
var SFX={
  tap:function(){tone(440,0.05,'square',0.07);},
  bon:function(){tone(523,0.09,'sine',0.13);setTimeout(function(){tone(784,0.12,'sine',0.13);},70);},
  mauvais:function(){tone(160,0.22,'sawtooth',0.11,90);},
  victoire:function(){[523,659,784,988,1319].forEach(function(f,i){setTimeout(function(){tone(f,0.20,'sine',0.15);},i*100);});},
  echec:function(){[392,330,262,196].forEach(function(f,i){setTimeout(function(){tone(f,0.28,'sine',0.13);},i*150);});},
  // tic-tac de suspense quand le temps presse
  suspense:function(aigu){tone(aigu?900:620,0.055,'square',0.075);},
  demarrerSuspense:function(){
    if(tickTimer)return;
    var alt=false;
    tickTimer=setInterval(function(){SFX.suspense(alt);alt=!alt;},480);
  },
  arreterSuspense:function(){if(tickTimer){clearInterval(tickTimer);tickTimer=null;}},
  estMuet:function(){return muet;},
  toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}
    if(muet)SFX.arreterSuspense();return muet;}
};
(function(){var b=document.getElementById('btnSon');
function m(){b.textContent=SFX.estMuet()?'🔇':'🔊';}m();
b.addEventListener('click',function(){SFX.toggle();m();});})();

function domConfetti(){
  var cols=['#F5C21B','#E32219','#0E7A3C','#3d5a80','#FAF7EF'];
  for(var i=0;i<26;i++){
    var el=document.createElement('div'),s=4+Math.random()*4;
    el.style.cssText='position:fixed;z-index:60;pointer-events:none;border-radius:2px;';
    el.style.width=s+'px';el.style.height=s+'px';el.style.background=cols[i%cols.length];
    el.style.left=(window.innerWidth/2+(Math.random()-0.5)*70)+'px';el.style.top='40%';
    document.body.appendChild(el);
    var dx=(Math.random()-0.5)*260,dy=200+Math.random()*200,r=Math.random()*720-360,d=900+Math.random()*500;
    el.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:'translate('+dx+'px,'+dy+'px) rotate('+r+'deg)',opacity:0}],
      {duration:d,easing:'cubic-bezier(.25,.46,.45,.94)'});
    (function(e,t){setTimeout(function(){e.remove();},t+50);})(el,d);
  }
}

var NIVEAUX={
  facile:{nom:'Facile',min:3,max:5,coef:0.8,pts:60},
  moyen: {nom:'Moyen', min:6,max:7,coef:1.0,pts:90},
  expert:{nom:'Expert',min:8,max:20,coef:1.5,pts:130},
};
var niveau='facile';
try{var nv=localStorage.getItem('fasogames_ana_niv');if(nv&&NIVEAUX[nv])niveau=nv;}catch(e){}
function N(){return NIVEAUX[niveau];}

var $=function(i){return document.getElementById(i);};
var DUREE=30;
var motCourant,lettresMel,composition,score,serie,meilleureSerie,trouves,tempsRestant,timer,over,indiceUtilise;
var pioche=[], dejaVus=[];

function motsDuNiveau(){
  var n=N();
  return BANQUE.filter(function(x){return x.m.length>=n.min&&x.m.length<=n.max;});
}
function melanger(t){
  var a=t.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}
  return a;
}
function preparerPioche(){
  // tirage SANS REMISE : on mélange tous les mots du niveau une fois pour la session
  pioche=melanger(motsDuNiveau());
  dejaVus=[];
}
function nouveauMot(){
  if(!pioche.length)preparerPioche(); // sécurité : si tout a été vu, on repart d'un nouveau mélange
  motCourant=pioche.shift();
  dejaVus.push(motCourant.m);
  // mélanger jusqu'à ce que ce ne soit pas le mot lui-même
  var essais=0;
  do{ lettresMel=melanger(motCourant.m.split('')); essais++; }
  while(lettresMel.join('')===motCourant.m && essais<20);
  composition=[];
  indiceUtilise=false;
  $('catNom').textContent=motCourant.c;
  $('indice').textContent='« '+motCourant.i+' »';
  rendre();
}
function rendre(){
  // emplacements de réponse
  var zr=$('zoneRep'); zr.innerHTML='';
  for(var i=0;i<motCourant.m.length;i++){
    var d=document.createElement('div');
    d.className='slot'+(composition[i]!==undefined?' plein':'');
    d.textContent=composition[i]!==undefined?lettresMel[composition[i]]:'';
    (function(pos){
      d.addEventListener('click',function(){retirerA(pos);});
    })(i);
    zr.appendChild(d);
  }
  // lettres disponibles
  var zl=$('zoneLettres'); zl.innerHTML='';
  lettresMel.forEach(function(L,idx){
    var b=document.createElement('button');
    b.className='lettre'+(composition.indexOf(idx)!==-1?' prise':'');
    b.textContent=L;
    b.addEventListener('click',function(){ajouter(idx);});
    zl.appendChild(b);
  });
  $('btnValider').disabled = composition.length!==motCourant.m.length;
}
function ajouter(idx){
  if(over)return;
  if(composition.indexOf(idx)!==-1)return;
  if(composition.length>=motCourant.m.length)return;
  composition.push(idx);
  SFX.tap();
  rendre();
  if(composition.length===motCourant.m.length)verifier();
}
function retirerA(pos){
  if(over)return;
  if(composition[pos]===undefined)return;
  composition.splice(pos,1);
  SFX.tap();
  rendre();
}
function motCompose(){
  return composition.map(function(i){return lettresMel[i];}).join('');
}
function verifier(){
  var prop=motCompose();
  var slots=$('zoneRep').children;
  if(prop===motCourant.m){
    for(var i=0;i<slots.length;i++)slots[i].className='slot bon';
    trouves++; serie++;
    if(serie>meilleureSerie)meilleureSerie=serie;
    var pts=Math.round((N().pts+Math.min(60,(serie-1)*15))*(indiceUtilise?0.6:1));
    score+=pts;
    $('score').textContent=score;$('serieN').textContent=serie;
    $('msg').textContent='✅ '+motCourant.m+' — +'+pts+' pts'+(serie>=3?' (série x'+serie+' 🔥)':'');
    SFX.bon();
    setTimeout(function(){if(!over&&tempsRestant>0)nouveauMot();},900);
  }else{
    for(var j=0;j<slots.length;j++)slots[j].className='slot faux';
    serie=0;$('serieN').textContent='0';
    $('msg').textContent='❌ Ce n\'est pas le bon mot';
    SFX.mauvais();
    setTimeout(function(){composition=[];rendre();$('msg').textContent='Réessaie !';},700);
  }
}
function reset(){
  SFX.arreterSuspense();
  score=0;serie=0;meilleureSerie=0;trouves=0;tempsRestant=DUREE;over=false;
  preparerPioche();
  $('score').textContent='0';$('serieN').textContent='0';
  $('fin').style.display='none';
  $('msg').textContent='Touche les lettres pour composer le mot';
  majBoutons();
  nouveauMot();
  $('jauge').style.width='100%';$('jauge').style.background='#F5C21B';
  clearInterval(timer);
  timer=setInterval(tick,100);
}
function tick(){
  tempsRestant-=0.1;
  $('jauge').style.width=Math.max(0,tempsRestant/DUREE*100)+'%';
  $('jauge').style.background=tempsRestant<8?'#E32219':'#F5C21B';
  if(tempsRestant<=8&&tempsRestant>0)SFX.demarrerSuspense();
  if(tempsRestant<=0){clearInterval(timer);SFX.arreterSuspense();terminer();}
}
function terminer(){
  over=true;
  $('fin').style.display='flex';
  $('finScore').textContent=score+' pts';
  $('fTrouves').textContent=trouves;
  $('fSerie').textContent=meilleureSerie;
  $('fNiveau').textContent=N().nom;
  var seuil=Math.round(400*N().coef);
  $('finTexte').textContent = score>=seuil
    ? "Mémoire d'éléphant ! Tu connais ton Afrique de l'Ouest."
    : score>=seuil*0.5
    ? "Bon score ! Les indices t'aident, mais la vitesse fait la différence."
    : "Continue à explorer : capitales, plats, fleuves, tout y passe !";
  if(score>=seuil){SFX.victoire();domConfetti();}
  else if(score<seuil*0.35){SFX.echec();}
  var envoi=Math.round(score*N().coef);
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Anagrammes',score:envoi,victoire:score>=seuil},'*');}catch(e){}}
}
function majBoutons(){
  document.querySelectorAll('.nivBtn').forEach(function(b){
    b.classList.toggle('sel',b.dataset.n===niveau);
  });
}
function changerNiveau(n){
  if(!NIVEAUX[n])return;
  niveau=n;
  try{localStorage.setItem('fasogames_ana_niv',n);}catch(e){}
  reset();
}
document.querySelectorAll('.nivBtn').forEach(function(b){
  b.addEventListener('click',function(){changerNiveau(b.dataset.n);});
});
$('btnEffacer').addEventListener('click',function(){if(over)return;composition=[];SFX.tap();rendre();$('msg').textContent='Recommence la composition';});
$('btnMelanger').addEventListener('click',function(){
  if(over)return;
  var restantes=lettresMel.filter(function(_,i){return composition.indexOf(i)===-1;});
  var pris=composition.map(function(i){return lettresMel[i];});
  lettresMel=pris.concat(melanger(restantes));
  composition=pris.map(function(_,i){return i;});
  SFX.tap();rendre();
});
$('btnIndice').addEventListener('click',function(){
  if(over||composition.length>=motCourant.m.length)return;
  // placer la prochaine lettre correcte
  var pos=composition.length;
  var cible=motCourant.m[pos];
  for(var i=0;i<lettresMel.length;i++){
    if(lettresMel[i]===cible&&composition.indexOf(i)===-1){
      composition.push(i);indiceUtilise=true;
      SFX.tap();rendre();
      $('msg').textContent='💡 Indice utilisé (points réduits)';
      if(composition.length===motCourant.m.length)verifier();
      return;
    }
  }
});
$('rejouer').addEventListener('click',reset);

// ---------- Partage & défi ----------
var LIEN='https://teal-muffin-8e3f01.netlify.app';
function messageScore(){
  return "🔤 J'ai marqué "+score+" pts aux Anagrammes Faso ("+N().nom+", "+trouves+
    " mots trouvés) ! Capitales, plats, fleuves, foot d'Afrique de l'Ouest. À ton tour de jouer ici 👉 "+LIEN;
}
function messageDefi(){
  return "⚔️ Je te défie aux Anagrammes Faso ! Mon score : "+score+" pts en niveau "+N().nom+
    ". Bats-moi si tu peux 👉 "+LIEN;
}
function envoyer(msg){
  if(navigator.share){
    navigator.share({title:'Anagrammes Faso',text:msg,url:LIEN}).catch(function(){});
  }else{
    window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
  }
}
$('btnPartager').addEventListener('click',function(){SFX.tap();envoyer(messageScore());});
$('btnDefier').addEventListener('click',function(){SFX.tap();envoyer(messageDefi());});

window.__ana={
  state:function(){return {score:score,serie:serie,trouves:trouves,tempsRestant:tempsRestant,
    over:over,niveau:niveau,mot:motCourant?motCourant.m:null,compose:motCompose(),
    nbLettres:lettresMel?lettresMel.length:0,muet:SFX.estMuet()};},
  changerNiveau:changerNiveau,
  resoudre:function(){
    if(over||!motCourant)return;
    composition=[];
    for(var p=0;p<motCourant.m.length;p++){
      var c=motCourant.m[p];
      for(var i=0;i<lettresMel.length;i++){
        if(lettresMel[i]===c&&composition.indexOf(i)===-1){composition.push(i);break;}
      }
    }
    rendre();verifier();
  },
  forcerFin:function(){tempsRestant=0;clearInterval(timer);terminer();},
  nbMots:function(){return motsDuNiveau().length;},
  msgScore:function(){return messageScore();},
  msgDefi:function(){return messageDefi();},
  motsVus:function(){return dejaVus.slice();}
};

reset();
})();
</script>
