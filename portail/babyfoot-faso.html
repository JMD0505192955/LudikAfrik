<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Babyfoot Faso</title>
<style>
  :root{
    --vert:#0E7A3C; --vert-fonce:#0A5C2D; --rouge:#E32219; --or:#F5C21B;
    --nuit:#12130F; --craie:#FAF7EF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--nuit);
    font-family:"Arial Black","Segoe UI",Arial,sans-serif;
    color:var(--craie);
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  header{
    width:100%;max-width:430px;padding:12px 16px 8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{font-size:20px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:9px;letter-spacing:3px;color:#8b8f84;margin-top:3px;}
  .marque{display:flex;align-items:center;gap:8px;font-size:22px;}
  .marque .toi{color:var(--or);}
  .marque .sep{color:#57594f;font-size:16px;}
  .marque .ia{color:#c9ccc0;}
  #msg{height:26px;font-size:14px;letter-spacing:.5px;text-align:center;color:var(--or);}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;justify-content:center;padding:0 12px 4px;}
  canvas{display:block;border-radius:14px;}
  #fin{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,19,15,.88);text-align:center;padding:24px;border-radius:14px;
  }
  #fin h2{font-size:30px;color:var(--or);margin-bottom:6px;}
  #fin p{font-family:Arial,sans-serif;font-size:14px;color:#c9ccc0;margin-bottom:20px;line-height:1.5;}
  #fin button{
    font-family:inherit;font-size:16px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:14px 34px;
  }
  #fin button:active{transform:scale(.96);}
  footer{
    width:100%;max-width:430px;padding:8px 16px 14px;text-align:center;
    font-family:Arial,sans-serif;font-size:11px;color:#6c7064;letter-spacing:.5px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">BABYFOOT <span>FASO</span><small>PREMIER À 5 BUTS</small></div>
  <div style="display:flex;align-items:center;gap:0"><button id="btnSon" style="background:none;border:1px solid #57594f;color:var(--craie);border-radius:999px;width:32px;height:32px;font-size:14px;margin-right:8px">🔊</button>
<div class="marque"><span class="toi" id="sToi">0</span><span class="sep">—</span><span class="ia" id="sIa">0</span></div>
</div>
</header>
<div id="msg">Glisse le doigt pour bouger ta barre 🔴</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="fin">
    <h2 id="finTitre"></h2>
    <p id="finTexte"></p>
    <button id="rejouer">REJOUER</button>
  </div>
</div>
<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>

<script>
(function(){
"use strict";
// ===== Kit sonore Faso Games (synthétisé, 0 Ko d'assets, silencieux par défaut respecté) =====
var SFX=(function(){
  var ctx,muet=false;
  try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
  function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
  function tone(freq,dur,type,vol,glide){
    if(muet)return;
    try{
      var c=ac();var o=c.createOscillator();var g=c.createGain();
      o.type=type||'sine';o.frequency.value=freq;
      if(glide)o.frequency.linearRampToValueAtTime(glide,c.currentTime+dur);
      g.gain.value=vol||0.15;
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+dur);
    }catch(e){}
  }
  return{
    tap:function(){tone(440,0.05,'square',0.08);},
    bon:function(){tone(523,0.09,'sine',0.14);setTimeout(function(){tone(784,0.12,'sine',0.14);},70);},
    mauvais:function(){tone(160,0.22,'sawtooth',0.12,90);},
    victoire:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'sine',0.15);},i*90);});},
    defaite:function(){[392,330,262].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'sine',0.12);},i*120);});},
    piece:function(){tone(988,0.08,'triangle',0.12,1400);},
    tick:function(){tone(300,0.03,'square',0.05);},
    estMuet:function(){return muet;},
    toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}
  };
})();
// Bouton mute (à placer dans le header de chaque jeu)
function initBoutonSon(id){
  var b=document.getElementById(id);
  if(!b)return;
  function maj(){b.textContent=SFX.estMuet()?'🔇':'🔊';}
  maj();
  b.addEventListener('click',function(){SFX.toggle();maj();});
}
// Confetti simple (petites particules colorées, pour les écrans de victoire)
function confetti(canvas,ctx,cx,cy){
  var parts=[];
  var couleurs=['#F5C21B','#E32219','#0E7A3C','#3d5a80','#FAF7EF'];
  for(var i=0;i<24;i++){
    var a=Math.random()*Math.PI*2,v=2+Math.random()*3;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:0.12,vie:1,col:couleurs[i%couleurs.length],taille:3+Math.random()*3});
  }
  return parts;
}
function drawConfetti(ctx,parts,dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=0.018*dt;
    if(p.vie<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.vie);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.taille/2,p.y-p.taille/2,p.taille,p.taille);
    ctx.globalAlpha=1;
  }
}
initBoutonSon("btnSon");

var IMG={},texPretes=false;
(function(){
  var cles=Object.keys(TEX),n=0;
  cles.forEach(function(k){
    var im=new Image();
    im.onload=function(){if(++n===cles.length)texPretes=true;};
    im.onerror=function(){if(++n===cles.length)texPretes=true;};
    im.src=TEX[k];IMG[k]=im;
  });
})();
function texOk(k){return texPretes&&IMG[k]&&IMG[k].complete&&IMG[k].naturalWidth;}


const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
const sToi=document.getElementById('sToi'), sIa=document.getElementById('sIa');
const msg=document.getElementById('msg');
const fin=document.getElementById('fin'), finTitre=document.getElementById('finTitre'),
      finTexte=document.getElementById('finTexte');
let W=0,H=0,DPR=1;
let confettiParts=[];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cvs.parentElement.getBoundingClientRect();
  W=r.width-24; H=r.height-8;
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  cvs.width=W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize',resize);

// ---- Géométrie ----
let table={}, goalW=0, FIG_R=0;
let rodToi, rodIa, ball;
let scoreToi=0, scoreIa=0, playing=true, started=false, pause=0;

function layout(){
  table={x:W*0.10, y:H*0.075, w:W*0.80, h:H*0.85};
  goalW=table.w*0.34;
  FIG_R=Math.max(13,table.w*0.045);
  rodToi={y:table.y+table.h*0.78, x:W/2, tx:W/2, vx:0, n:3, col:'#E32219'};
  rodIa ={y:table.y+table.h*0.22, x:W/2, tx:W/2, vx:0, n:3, col:'#3d5a80'};
  serve(Math.random()<0.5?1:-1);
}

function serve(direction){ // 1 = vers l'IA (haut), -1 = vers toi
  ball={x:W/2, y:H/2, r:Math.max(9,table.w*0.028),
        vx:(Math.random()-0.5)*3, vy:direction*-4.2};
  pause=40;
}

function figXs(rod){
  const span=table.w*0.62;
  const xs=[];
  for(let i=0;i<rod.n;i++){
    xs.push(rod.x-span/2+span*i/(rod.n-1));
  }
  return xs;
}

// ---- Logique ----
function step(dt){
  if(!playing)return;
  if(pause>0){pause-=dt;return;}
  if(!started)return;

  // barre joueur : suit le doigt
  const old=rodToi.x;
  rodToi.x+=(rodToi.tx-rodToi.x)*0.25*dt;
  clampRod(rodToi);
  rodToi.vx=(rodToi.x-old)/dt;

  // IA : suit la balle avec vitesse limitée + petite erreur
  const diff=2.1+Math.min(1.6,(scoreToi+scoreIa)*0.25);
  const err=Math.sin(performance.now()/700)*18;
  const oldIa=rodIa.x;
  const cible=ball.vy<0 ? ball.x+err : W/2; // ne défend que si la balle monte
  rodIa.x+=Math.max(-diff*dt,Math.min(diff*dt,cible-rodIa.x));
  clampRod(rodIa);
  rodIa.vx=(rodIa.x-oldIa)/dt;

  // balle
  ball.x+=ball.vx*dt;
  ball.y+=ball.vy*dt;

  // bandes latérales
  if(ball.x-ball.r<table.x){ball.x=table.x+ball.r;ball.vx=Math.abs(ball.vx);}
  if(ball.x+ball.r>table.x+table.w){ball.x=table.x+table.w-ball.r;ball.vx=-Math.abs(ball.vx);}

  // fond de table haut/bas : but si dans l'ouverture, rebond sinon
  const gL=W/2-goalW/2, gR=W/2+goalW/2;
  if(ball.y-ball.r<table.y){
    if(ball.x>gL&&ball.x<gR){return but('toi');}
    ball.y=table.y+ball.r; ball.vy=Math.abs(ball.vy);
  }
  if(ball.y+ball.r>table.y+table.h){
    if(ball.x>gL&&ball.x<gR){return but('ia');}
    ball.y=table.y+table.h-ball.r; ball.vy=-Math.abs(ball.vy);
  }

  // collisions avec les figurines
  hitRod(rodToi,-1);
  hitRod(rodIa,1);

  // anti-blocage horizontal
  if(Math.abs(ball.vy)<1.4) ball.vy=Math.sign(ball.vy||1)*1.4;
  // plafond de vitesse
  const sp=Math.hypot(ball.vx,ball.vy), max=9.5;
  if(sp>max){ball.vx*=max/sp;ball.vy*=max/sp;}
}

function clampRod(rod){
  const span=table.w*0.62;
  rod.x=Math.max(table.x+span/2+FIG_R,Math.min(table.x+table.w-span/2-FIG_R,rod.x));
}

function hitRod(rod,dirOut){ // dirOut : -1 renvoie vers le haut, 1 vers le bas
  for(const fx of figXs(rod)){
    const dx=ball.x-fx, dy=ball.y-rod.y;
    const d=Math.hypot(dx,dy), min=ball.r+FIG_R;
    if(d<min && Math.sign(ball.vy)!==dirOut){
      // replace + renvoi
      const nx=dx/(d||1), ny=dy/(d||1);
      ball.x=fx+nx*min; ball.y=rod.y+ny*min;
      const sp=Math.hypot(ball.vx,ball.vy)*1.05+0.3;
      ball.vy=dirOut*Math.abs(sp*0.82);
      ball.vx=nx*sp*0.7+rod.vx*0.5;
      if(rod===rodToi) msg.textContent=["⚡ Frappe !","💥 Tir !","🔥 Boum !"][Math.floor(Math.random()*3)];
      return;
    }
  }
}

function but(qui){
  if(qui==='toi'){scoreToi++;sToi.textContent=scoreToi;msg.textContent="⚽ BUUUT pour toi !";SFX.bon();}
  else{scoreIa++;sIa.textContent=scoreIa;msg.textContent="😤 But encaissé...";SFX.mauvais();}
  if(scoreToi>=5||scoreIa>=5){finMatch();return;}
  serve(qui==='toi'?-1:1); // l'équipe qui encaisse engage vers l'autre
}

function finMatch(){
  playing=false;
  const gagne=scoreToi>=5;
  finTitre.textContent=scoreToi+" — "+scoreIa;
  finTexte.textContent = gagne
    ? "Victoire ! Monte au classement hebdo et défends ton titre."
    : "Défaite... L'IA a été plus rapide sur les barres. Prends ta revanche !";
  if(gagne){SFX.victoire();confettiParts=confetti(cvs,ctx,W/2,H*0.35);}else{SFX.defaite();}
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Babyfoot',score:scoreToi*90+(scoreToi>=5?150:0),victoire:scoreToi>=5},'*');}catch(e){}}
  fin.style.display='flex';
}

document.getElementById('rejouer').addEventListener('click',()=>{
  scoreToi=0;scoreIa=0;sToi.textContent='0';sIa.textContent='0';
  playing=true;started=false;fin.style.display='none';confettiParts=[];
  serve(Math.random()<0.5?1:-1);
  msg.textContent="Glisse le doigt pour bouger ta barre 🔴";
});

// ---- Rendu ----
function draw(){
  // --- Décor : intérieur de maquis ---
  if(texOk('MAQUIS')){
    ctx.drawImage(IMG.MAQUIS,0,0,W,H);
  }else{
    ctx.fillStyle='#8a5a33';
    ctx.beginPath();ctx.roundRect(0,0,W,H,14);ctx.fill();
  }

  // --- Table de babyfoot ---
  if(texOk('TABLE')){
    // ombre portée de la table sur le sol du maquis
    ctx.fillStyle='rgba(20,10,2,.5)';
    ctx.beginPath();ctx.roundRect(table.x-14,table.y-18,table.w+30,table.h+40,14);ctx.fill();
    ctx.drawImage(IMG.TABLE,table.x-12,table.y-16,table.w+24,table.h+34);
  }else{
    const g=ctx.createLinearGradient(0,table.y,0,table.y+table.h);
    g.addColorStop(0,'#128a44');g.addColorStop(1,'#0A5C2D');
    ctx.fillStyle=g;
    ctx.fillRect(table.x,table.y,table.w,table.h);
    ctx.strokeStyle='rgba(250,247,239,.7)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(table.x,H/2);ctx.lineTo(table.x+table.w,H/2);ctx.stroke();
    ctx.beginPath();ctx.arc(W/2,H/2,table.w*0.14,0,7);ctx.stroke();
    ctx.fillStyle='rgba(250,247,239,.7)';
    ctx.beginPath();ctx.arc(W/2,H/2,4,0,7);ctx.fill();
  }

  // buts (ouvertures or + filet)
  const gL=W/2-goalW/2;
  drawBut(gL,table.y-8,goalW,10);
  drawBut(gL,table.y+table.h-2,goalW,10);

  // barres + figurines
  drawRod(rodIa);
  drawRod(rodToi);

  // balle
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(ball.x+1.5,ball.y+ball.r*0.8,ball.r*0.95,ball.r*0.4,0,0,7);ctx.fill();
  if(texOk('BALLE')){
    const bs=ball.r*2.5;
    ctx.drawImage(IMG.BALLE,ball.x-bs/2,ball.y-bs/2,bs,bs);
  }else{
    ctx.fillStyle='#FAF7EF';
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
    ctx.fillStyle='#12130F';
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*0.35,0,7);ctx.fill();
  }
  ctx.restore();

  // compte à rebours d'engagement
  if(pause>0&&playing&&started){
    ctx.fillStyle='rgba(245,194,27,.9)';
    ctx.font='bold 30px "Arial Black"';
    ctx.textAlign='center';
    ctx.fillText('•••',W/2,H/2-30);
  }
  if(confettiParts.length)drawConfetti(ctx,confettiParts,1);
}

function drawBut(x,y,w,h){
  ctx.fillStyle='#F5C21B';
  ctx.fillRect(x-5,y,5,h);
  ctx.fillRect(x+w,y,5,h);
  ctx.strokeStyle='rgba(250,247,239,.4)';ctx.lineWidth=1;
  for(let i=0;i<=6;i++){
    ctx.beginPath();ctx.moveTo(x+w*i/6,y);ctx.lineTo(x+w*i/6,y+h);ctx.stroke();
  }
}

function drawRod(rod){
  const cle = rod===rodToi ? 'BARRE_R' : 'BARRE_B';
  if(texOk(cle)){
    // la barre illustrée est glissée horizontalement selon la position du rod
    const src=IMG[cle];
    // largeur de la barre à l'écran : couvre le terrain + débord
    const bw=table.w*1.12;
    const bh=bw*src.naturalHeight/src.naturalWidth;
    // décalage : les 3 figurines suivent le mouvement du joueur
    const centre=figXs(rod)[1]; // figurine du milieu = référence
    ctx.save();
    ctx.beginPath();
    ctx.rect(table.x-6,rod.y-bh,table.w+12,bh*2);
    ctx.clip();
    ctx.drawImage(src,centre-bw/2,rod.y-bh/2,bw,bh);
    ctx.restore();
    return;
  }
  // repli dessiné
  ctx.strokeStyle='#c9c4b6';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(table.x-4,rod.y);ctx.lineTo(table.x+table.w+4,rod.y);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(table.x,rod.y-1.5);ctx.lineTo(table.x+table.w,rod.y-1.5);ctx.stroke();
  for(const fx of figXs(rod)){
    ctx.fillStyle='rgba(0,0,0,.25)';
    ctx.beginPath();ctx.ellipse(fx,rod.y+FIG_R*0.8,FIG_R*0.9,FIG_R*0.35,0,0,7);ctx.fill();
    ctx.fillStyle=rod.col;
    ctx.beginPath();ctx.arc(fx,rod.y,FIG_R,0,7);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=rod===rodToi?'#F5C21B':'#FAF7EF';
    ctx.beginPath();ctx.arc(fx,rod.y,FIG_R*0.45,0,7);ctx.fill();
  }
}

// ---- Entrées ----
function steer(clientX){
  const r=cvs.getBoundingClientRect();
  rodToi.tx=clientX-r.left;
  if(!started&&playing){started=true;msg.textContent="Défends ton but, marque dans le sien !";}
}
cvs.addEventListener('touchstart',e=>{steer(e.touches[0].clientX);e.preventDefault();},{passive:false});
cvs.addEventListener('touchmove',e=>{steer(e.touches[0].clientX);e.preventDefault();},{passive:false});
let mdown=false;
cvs.addEventListener('mousedown',e=>{mdown=true;steer(e.clientX);});
window.addEventListener('mousemove',e=>{if(mdown)steer(e.clientX);});
window.addEventListener('mouseup',()=>{mdown=false;});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){rodToi.tx=rodToi.x-60;if(!started){started=true;}}
  if(e.key==='ArrowRight'){rodToi.tx=rodToi.x+60;if(!started){started=true;}}
});

// ---- Boucle ----
let last=0;
function loop(now){
  const dt=Math.min(2.5,(now-last)/16.7); last=now;
  step(dt);
  draw();
  if(confettiParts.length)drawConfetti(ctx,confettiParts,dt);
  requestAnimationFrame(loop);
}
resize();
window.__baby={state:()=>({scoreToi,scoreIa,confettiN:confettiParts.length,muet:SFX.estMuet()}),
  marquer:(qui)=>but(qui)};
requestAnimationFrame(loop);
})();
</script>
