<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Calao Faso</title>
<style>
  :root{
    --vert:#0E7A3C; --vert-fonce:#0A5C2D; --rouge:#E32219; --or:#F5C21B;
    --nuit:#12130F; --craie:#FAF7EF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--nuit);
    font-family:"Arial Black","Segoe UI",Arial,sans-serif;
    color:var(--craie);
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  header{
    width:100%;max-width:430px;padding:12px 16px 8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{font-size:20px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:9px;letter-spacing:3px;color:#8b8f84;margin-top:3px;}
  .scores{text-align:right;line-height:1.25;}
  .scores .val{font-size:20px;color:var(--or);}
  .scores .lbl{font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;color:#8b8f84;}
  #msg{height:26px;font-size:14px;letter-spacing:.5px;text-align:center;color:var(--or);}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;justify-content:center;padding:0 12px 4px;}
  canvas{display:block;border-radius:14px;}
  #fin{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,19,15,.88);text-align:center;padding:24px;border-radius:14px;
  }
  #fin h2{font-size:30px;color:var(--or);margin-bottom:6px;}
  #fin p{font-family:Arial,sans-serif;font-size:14px;color:#c9ccc0;margin-bottom:20px;line-height:1.5;}
  #fin button{
    font-family:inherit;font-size:16px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:14px 34px;
  }
  #fin button:active{transform:scale(.96);}
  footer{
    width:100%;max-width:430px;padding:8px 16px 14px;text-align:center;
    font-family:Arial,sans-serif;font-size:11px;color:#6c7064;letter-spacing:.5px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">CALAO <span>FASO</span><small>VOLE ENTRE LES BAOBABS</small></div>
  <div style="display:flex;align-items:center;gap:0"><button id="btnSon" style="background:none;border:1px solid #57594f;color:var(--craie);border-radius:999px;width:32px;height:32px;font-size:14px;margin-right:8px">🔊</button>
<div class="scores">
    <div class="val" id="score">0</div>
    <div class="lbl">RECORD <span id="best">0</span></div>
  </div>
</div>
</header>
<div id="msg">Touche l'écran pour battre des ailes 🐦</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="fin">
    <h2 id="finTitre"></h2>
    <p id="finTexte"></p>
    <button id="rejouer">REJOUER</button>
  </div>
</div>
<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>

<script>
(function(){
"use strict";
// ===== Kit sonore Faso Games (synthétisé, 0 Ko d'assets, silencieux par défaut respecté) =====
var SFX=(function(){
  var ctx,muet=false;
  try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
  function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
  function tone(freq,dur,type,vol,glide){
    if(muet)return;
    try{
      var c=ac();var o=c.createOscillator();var g=c.createGain();
      o.type=type||'sine';o.frequency.value=freq;
      if(glide)o.frequency.linearRampToValueAtTime(glide,c.currentTime+dur);
      g.gain.value=vol||0.15;
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+dur);
    }catch(e){}
  }
  return{
    tap:function(){tone(440,0.05,'square',0.08);},
    bon:function(){tone(523,0.09,'sine',0.14);setTimeout(function(){tone(784,0.12,'sine',0.14);},70);},
    mauvais:function(){tone(160,0.22,'sawtooth',0.12,90);},
    victoire:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'sine',0.15);},i*90);});},
    defaite:function(){[392,330,262].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'sine',0.12);},i*120);});},
    piece:function(){tone(988,0.08,'triangle',0.12,1400);},
    tick:function(){tone(300,0.03,'square',0.05);},
    estMuet:function(){return muet;},
    toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}
  };
})();
// Bouton mute (à placer dans le header de chaque jeu)
function initBoutonSon(id){
  var b=document.getElementById(id);
  if(!b)return;
  function maj(){b.textContent=SFX.estMuet()?'🔇':'🔊';}
  maj();
  b.addEventListener('click',function(){SFX.toggle();maj();});
}
// Confetti simple (petites particules colorées, pour les écrans de victoire)
function confetti(canvas,ctx,cx,cy){
  var parts=[];
  var couleurs=['#F5C21B','#E32219','#0E7A3C','#3d5a80','#FAF7EF'];
  for(var i=0;i<24;i++){
    var a=Math.random()*Math.PI*2,v=2+Math.random()*3;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:0.12,vie:1,col:couleurs[i%couleurs.length],taille:3+Math.random()*3});
  }
  return parts;
}
function drawConfetti(ctx,parts,dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=0.018*dt;
    if(p.vie<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.vie);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.taille/2,p.y-p.taille/2,p.taille,p.taille);
    ctx.globalAlpha=1;
  }
}
initBoutonSon("btnSon");

const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
const msg=document.getElementById('msg');
const fin=document.getElementById('fin'), finTitre=document.getElementById('finTitre'),
      finTexte=document.getElementById('finTexte');
let W=0,H=0,DPR=1;
let confettiParts=[];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cvs.parentElement.getBoundingClientRect();
  W=r.width-24; H=r.height-8;
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  cvs.width=W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);

// ---- État ----
let bird, pipes, score=0, best=0, alive=true, started=false, flap=0, groundOff=0;
const GAP0=190, SPEED0=2.6;
let gap=GAP0, speed=SPEED0;

function reset(){
  bird={x:W*0.3, y:H*0.45, vy:0, r:15, tilt:0};
  pipes=[]; score=0; gap=GAP0; speed=SPEED0;
  alive=true; started=false;
  scoreEl.textContent='0';
  msg.textContent="Touche l'écran pour battre des ailes 🐦";
  spawnPipe(W+80);
  spawnPipe(W+80+W*0.62);
}

function spawnPipe(x){
  const margin=H*0.12;
  const gy=margin+Math.random()*(H-gap-2*margin-H*0.1);
  pipes.push({x, top:gy, bot:gy+gap, w:58, passed:false});
}

// ---- Logique ----
function step(dt){
  groundOff=(groundOff+speed*dt)%24;
  if(!started||!alive)return;

  bird.vy+=0.38*dt;
  bird.y+=bird.vy*dt;
  bird.tilt+=((bird.vy*0.06)-bird.tilt)*0.15*dt;
  bird.tilt=Math.max(-0.5,Math.min(1.1,bird.tilt));
  flap=Math.max(0,flap-0.12*dt);

  // sol / plafond
  const groundY=H-H*0.08;
  if(bird.y+bird.r>groundY){bird.y=groundY-bird.r;return crash();}
  if(bird.y-bird.r<0){bird.y=bird.r;bird.vy=0;}

  // tuyaux (baobabs)
  for(const p of pipes){
    p.x-=speed*dt;
    // passage
    if(!p.passed && p.x+p.w<bird.x-bird.r){
      p.passed=true; score++;
      scoreEl.textContent=score;
      SFX.tap();
      if(score%10===0){
        speed=Math.min(4.4,speed+0.25);
        gap=Math.max(150,gap-6);
        msg.textContent="🔥 Ça se corse !";
      }
    }
    // collision
    if(bird.x+bird.r>p.x+6 && bird.x-bird.r<p.x+p.w-6){
      if(bird.y-bird.r<p.top || bird.y+bird.r>p.bot) return crash();
    }
  }
  // recyclage
  if(pipes[0].x+pipes[0].w<-20){
    pipes.shift();
    spawnPipe(pipes[pipes.length-1].x+W*0.62);
  }
}

function doFlap(){
  if(!alive)return;
  if(!started){started=true;msg.textContent="Passe entre les baobabs !";}
  bird.vy=-6.6;
  flap=1;
}

function crash(){
  alive=false;
  if(score>best){best=score;bestEl.textContent=best;}
  finTitre.textContent=score+" pts";
  finTexte.textContent = score>=30 ? "Roi du ciel sahélien ! Le classement hebdo t'attend."
                   : score>=12 ? "Beau vol ! Encore quelques baobabs et tu montes au classement."
                   : "Le calao a piqué du bec... Reprends ton envol !";
  if(score>=30){SFX.victoire();confettiParts=confetti(cvs,ctx,W/2,H*0.35);}else SFX.defaite();
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Calao',score:Math.round(score*9),victoire:score>=30},'*');}catch(e){}}
  fin.style.display='flex';
}

document.getElementById('rejouer').addEventListener('click',()=>{
  fin.style.display='none';confettiParts=[];reset();
});

// ---- Rendu ----
function draw(){
  // ciel crépuscule sahélien
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1b2a4a');g.addColorStop(0.65,'#3d5a80');g.addColorStop(1,'#8a5a33');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // lune
  ctx.fillStyle='rgba(250,247,239,.9)';
  ctx.beginPath();ctx.arc(W*0.82,H*0.14,22,0,7);ctx.fill();
  ctx.fillStyle='rgba(27,42,74,.5)';
  ctx.beginPath();ctx.arc(W*0.82+9,H*0.14-4,19,0,7);ctx.fill();

  // baobabs (troncs)
  for(const p of pipes){
    drawTrunk(p.x,0,p.w,p.top,true);
    drawTrunk(p.x,p.bot,p.w,H-p.bot,false);
  }

  // sol
  const groundY=H-H*0.08;
  ctx.fillStyle='#0A5C2D';
  ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='rgba(245,194,27,.25)';
  for(let x=-24+groundOff*-1;x<W;x+=24){
    ctx.fillRect(x,groundY,12,4);
  }

  drawBird();
}

function drawTrunk(x,y,w,h,fromTop){
  // tronc de baobab : brun, évasé
  ctx.fillStyle='#6e4525';
  ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();
  ctx.fillStyle='#8a5a33';
  ctx.beginPath();ctx.roundRect(x+6,y,10,h,5);ctx.fill();
  // collerette feuillue à l'ouverture
  const fy=fromTop? y+h-14 : y;
  ctx.fillStyle='#0E7A3C';
  ctx.beginPath();ctx.roundRect(x-6,fy,w+12,14,7);ctx.fill();
  ctx.fillStyle='#128a44';
  ctx.beginPath();ctx.roundRect(x-6,fy+(fromTop?0:7),w+12,7,4);ctx.fill();
}

function drawBird(){
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.tilt);
  // queue
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-24,-6);ctx.lineTo(-24,6);ctx.closePath();ctx.fill();
  // corps noir de calao
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.ellipse(0,0,14,11,0,0,7);ctx.fill();
  // ventre blanc
  ctx.fillStyle='#FAF7EF';
  ctx.beginPath();ctx.ellipse(-2,4,8,5,0,0,7);ctx.fill();
  // aile (battement)
  ctx.fillStyle='#2a2c24';
  ctx.save();
  ctx.rotate(flap>0.4?-0.7:0.25);
  ctx.beginPath();ctx.ellipse(-3,-2,9,5,0,0,7);ctx.fill();
  ctx.restore();
  // tête
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.arc(10,-6,7,0,7);ctx.fill();
  // grand bec de calao (orange, casqué)
  ctx.fillStyle='#F28C1B';
  ctx.beginPath();
  ctx.moveTo(13,-9);ctx.lineTo(30,-3);ctx.lineTo(14,-1);ctx.closePath();ctx.fill();
  ctx.fillStyle='#E32219';
  ctx.beginPath();
  ctx.moveTo(13,-11);ctx.lineTo(24,-9);ctx.lineTo(14,-7);ctx.closePath();ctx.fill();
  // œil
  ctx.fillStyle='#FAF7EF';
  ctx.beginPath();ctx.arc(10,-7,2.6,0,7);ctx.fill();
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.arc(10.8,-7,1.3,0,7);ctx.fill();
  ctx.restore();
}

// ---- Entrées ----
cvs.addEventListener('touchstart',e=>{doFlap();e.preventDefault();},{passive:false});
cvs.addEventListener('mousedown',e=>{doFlap();});
window.addEventListener('keydown',e=>{if(e.code==='Space')doFlap();});

// ---- Boucle ----
let last=0;
function loop(now){
  const dt=Math.min(2.5,(now-last)/16.7); last=now;
  step(dt);
  draw();
  if(confettiParts.length)drawConfetti(ctx,confettiParts,dt);
  requestAnimationFrame(loop);
}
window.__calao={state:()=>({score,alive,confettiN:confettiParts.length,muet:SFX.estMuet()}),
  forcerCrash:(s)=>{score=s;crash();}};
resize();reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
