<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moto Faso</title>
<style>
  :root{
    --vert:#0E7A3C; --vert-fonce:#0A5C2D; --rouge:#E32219; --or:#F5C21B;
    --nuit:#12130F; --craie:#FAF7EF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--nuit);
    font-family:"Arial Black","Segoe UI",Arial,sans-serif;
    color:var(--craie);
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  header{
    width:100%;max-width:430px;padding:12px 16px 8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{font-size:20px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:9px;letter-spacing:3px;color:#8b8f84;margin-top:3px;}
  .scores{text-align:right;line-height:1.25;}
  .scores .val{font-size:20px;color:var(--or);}
  .scores .lbl{font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;color:#8b8f84;}
  #msg{height:26px;font-size:14px;letter-spacing:.5px;text-align:center;color:var(--or);}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;justify-content:center;padding:0 12px 4px;}
  canvas{display:block;border-radius:14px;}
  #fin{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,19,15,.88);text-align:center;padding:24px;border-radius:14px;
  }
  #fin h2{font-size:30px;color:var(--or);margin-bottom:6px;}
  #fin p{font-family:Arial,sans-serif;font-size:14px;color:#c9ccc0;margin-bottom:20px;line-height:1.5;}
  #fin button{
    font-family:inherit;font-size:16px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:14px 34px;
  }
  #fin button:active{transform:scale(.96);}
  #niveaux{display:flex;gap:6px;justify-content:center;padding:0 14px 6px;width:100%;max-width:430px;}
  .nivBtn{flex:1;background:#1d1f19;border:1.5px solid #2a2c24;color:#8b8f84;border-radius:999px;
    padding:7px 4px;font-family:inherit;font-size:11.5px;letter-spacing:.3px;}
  .nivBtn.sel{background:var(--or);border-color:var(--or);color:var(--nuit);font-weight:bold;}
  .nivBtn:active{transform:scale(.96);}
  footer{
    width:100%;max-width:430px;padding:8px 16px 14px;text-align:center;
    font-family:Arial,sans-serif;font-size:11px;color:#6c7064;letter-spacing:.5px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">MOTO <span>FASO</span><small>ESQUIVE LE TRAFIC</small></div>
  <div style="display:flex;align-items:center;gap:0"><button id="btnSon" style="background:none;border:1px solid #57594f;color:var(--craie);border-radius:999px;width:32px;height:32px;font-size:14px;margin-right:8px">🔊</button>
<div class="scores">
    <div class="val"><span id="score">0</span> m</div>
    <div class="lbl">RECORD <span id="best">0</span> m</div>
  </div>
</div>
</header>
<div id="msg">Glisse le doigt pour piloter 🏍️</div>
<div id="niveaux">
  <button class="nivBtn" data-n="balade">🟢 Balade</button>
  <button class="nivBtn sel" data-n="ville">🟡 Ville</button>
  <button class="nivBtn" data-n="rushhour">🔴 Rush</button>
</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="fin">
    <h2 id="finTitre"></h2>
    <p id="finTexte"></p>
    <button id="rejouer">REJOUER</button>
  </div>
</div>
<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>

<script>
(function(){
"use strict";
// ===== Kit sonore Faso Games (synthétisé, 0 Ko d'assets, silencieux par défaut respecté) =====
var SFX=(function(){
  var ctx,muet=false;
  try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
  function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
  function tone(freq,dur,type,vol,glide){
    if(muet)return;
    try{
      var c=ac();var o=c.createOscillator();var g=c.createGain();
      o.type=type||'sine';o.frequency.value=freq;
      if(glide)o.frequency.linearRampToValueAtTime(glide,c.currentTime+dur);
      g.gain.value=vol||0.15;
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+dur);
    }catch(e){}
  }
  return{
    tap:function(){tone(440,0.05,'square',0.08);},
    bon:function(){tone(523,0.09,'sine',0.14);setTimeout(function(){tone(784,0.12,'sine',0.14);},70);},
    mauvais:function(){tone(160,0.22,'sawtooth',0.12,90);},
    victoire:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'sine',0.15);},i*90);});},
    defaite:function(){[392,330,262].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'sine',0.12);},i*120);});},
    piece:function(){tone(988,0.08,'triangle',0.12,1400);},
    tick:function(){tone(300,0.03,'square',0.05);},
    estMuet:function(){return muet;},
    toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}
  };
})();
// Bouton mute (à placer dans le header de chaque jeu)
function initBoutonSon(id){
  var b=document.getElementById(id);
  if(!b)return;
  function maj(){b.textContent=SFX.estMuet()?'🔇':'🔊';}
  maj();
  b.addEventListener('click',function(){SFX.toggle();maj();});
}
// Confetti simple (petites particules colorées, pour les écrans de victoire)
function confetti(canvas,ctx,cx,cy){
  var parts=[];
  var couleurs=['#F5C21B','#E32219','#0E7A3C','#3d5a80','#FAF7EF'];
  for(var i=0;i<24;i++){
    var a=Math.random()*Math.PI*2,v=2+Math.random()*3;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:0.12,vie:1,col:couleurs[i%couleurs.length],taille:3+Math.random()*3});
  }
  return parts;
}
function drawConfetti(ctx,parts,dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=0.018*dt;
    if(p.vie<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.vie);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.taille/2,p.y-p.taille/2,p.taille,p.taille);
    ctx.globalAlpha=1;
  }
}
initBoutonSon("btnSon");

var IMG={},texPretes=false,patBitume=null,patBas=null;
(function(){
  var cles=Object.keys(TEX),n=0;
  cles.forEach(function(k){
    var im=new Image();
    im.onload=function(){if(++n===cles.length)texPretes=true;};
    im.onerror=function(){if(++n===cles.length)texPretes=true;};
    im.src=TEX[k];IMG[k]=im;
  });
})();
function texOk(k){return texPretes&&IMG[k]&&IMG[k].complete&&IMG[k].naturalWidth;}


const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
const msg=document.getElementById('msg');
const fin=document.getElementById('fin'), finTitre=document.getElementById('finTitre'),
      finTexte=document.getElementById('finTexte');
let W=0,H=0,DPR=1, roadL=0, roadR=0;
let confettiParts=[];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cvs.parentElement.getBoundingClientRect();
  W=r.width-24; H=r.height-8;
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  cvs.width=W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  roadL=W*0.12; roadR=W*0.88;
}
window.addEventListener('resize',resize);

// ---- État ----
let moto, obs, coins, dust, dist, speed, lineOff, alive=true, started=false, best=0;
let obsTimer=0, coinTimer=0, bonus=0;

// ---- Niveaux de difficulté ----
var NIVEAUX={
  balade: {nom:'Balade', ic:'🟢', v0:3.4, vmax:2.8, accel:2800, ecart:250, ecartMin:130,
           coef:0.75, txt:'Trafic calme, tu as le temps de voir venir'},
  ville:  {nom:'Ville',  ic:'🟡', v0:4.2, vmax:4.5, accel:2200, ecart:190, ecartMin:80,
           coef:1.0,  txt:"Le trafic normal de Ouaga"},
  rushhour:{nom:'Rush',  ic:'🔴', v0:5.4, vmax:6.5, accel:1500, ecart:140, ecartMin:52,
           coef:1.45, txt:'Heure de pointe : ça klaxonne de partout'},
};
var niveau='ville';
try{var nv=localStorage.getItem('fasogames_moto_niv'); if(nv&&NIVEAUX[nv])niveau=nv;}catch(e){}
function N(){return NIVEAUX[niveau];}

function reset(){
  moto={x:W/2, tx:W/2, y:H*0.8, lean:0};
  obs=[]; coins=[]; dust=[];
  dist=0; bonus=0; speed=N().v0; lineOff=0;
  alive=true; started=false;
  obsTimer=60; coinTimer=160;
  scoreEl.textContent='0';
  msg.textContent=N().ic+' '+N().nom+" — glisse le doigt pour piloter 🏍️";
  majBoutonsNiveau();
}
function majBoutonsNiveau(){
  document.querySelectorAll('.nivBtn').forEach(function(b){
    b.classList.toggle('sel', b.dataset.n===niveau);
  });
}
function changerNiveau(n){
  if(!NIVEAUX[n])return;
  niveau=n;
  try{localStorage.setItem('fasogames_moto_niv',n);}catch(e){}
  reset();
}

// ---- Obstacles ----
// types : taxi (voiture verte), camion, nid de poule, baril
function spawnObs(){
  const t=Math.random();
  const type = t<0.38?'taxi' : t<0.55?'camion' : t<0.82?'trou' : 'baril';
  const w = type==='taxi'?46 : type==='camion'?54 : type==='trou'?44 : 26;
  const h = type==='taxi'?78 : type==='camion'?110 : type==='trou'?30 : 26;
  const x = roadL+10+Math.random()*(roadR-roadL-w-20);
  const vy = (type==='taxi'||type==='camion') ? speed*0.45 : 0; // véhicules roulent aussi
  obs.push({type,x,y:-h-10,w,h,vy});
}
function spawnCoin(){
  const x=roadL+20+Math.random()*(roadR-roadL-40);
  coins.push({x,y:-20,r:11,spin:0});
}

// ---- Logique ----
function step(dt){
  if(!started||!alive)return;
  // pilotage : lissage vers la position du doigt
  const dxm=(moto.tx-moto.x);
  moto.x+=dxm*0.18*dt;
  moto.x=Math.max(roadL+16,Math.min(roadR-16,moto.x));
  moto.lean+=((dxm*0.010)-moto.lean)*0.15*dt;
  moto.lean=Math.max(-0.5,Math.min(0.5,moto.lean));

  // poussière
  if(Math.random()<0.6) dust.push({x:moto.x+(Math.random()-0.5)*10,y:moto.y+26,r:2.5,a:.5});
  dust.forEach(d=>{d.y+=speed*0.6*dt;d.r+=0.2*dt;d.a-=0.02*dt;});
  dust=dust.filter(d=>d.a>0);

  // défilement
  const dy=speed*dt;
  dist+=dy; lineOff=(lineOff+dy)%64;
  scoreEl.textContent=Math.floor(dist/10)+ (bonus?0:0);
  speed=N().v0+Math.min(N().vmax,dist/N().accel);

  // spawn
  obsTimer-=dy;
  if(obsTimer<=0){
    spawnObs();
    var ec=N().ecart;
    obsTimer=ec+Math.random()*ec*0.85-Math.min(ec-N().ecartMin,dist/120);
  }
  coinTimer-=dy;
  if(coinTimer<=0){spawnCoin();coinTimer=300+Math.random()*300;}

  // avancée des objets
  obs.forEach(o=>o.y+=(dy-o.vy*dt));
  coins.forEach(c=>{c.y+=dy;c.spin+=0.2*dt;});
  obs=obs.filter(o=>o.y<H+140);
  coins=coins.filter(c=>c.y<H+40);

  // collisions
  const mw=14, mh=26;
  for(const o of obs){
    const pad=o.type==='trou'?6:2;
    if(moto.x+mw>o.x+pad && moto.x-mw<o.x+o.w-pad &&
       moto.y+mh>o.y+pad && moto.y-mh<o.y+o.h-pad) return crash();
  }
  for(const c of coins){
    if(Math.abs(moto.x-c.x)<mw+c.r && Math.abs(moto.y-c.y)<mh+c.r){
      c.y=H+99; bonus+=5; dist+=50; // pièce = +5 m
      msg.textContent="🪙 +5 m !";
      SFX.piece();
    }
  }
}

function crash(){
  alive=false;
  const m=Math.floor(dist/10);
  if(m>best){best=m;bestEl.textContent=best;}
  finTitre.textContent=m+" m";
  var seuil=Math.round(500/N().coef);
  finTexte.textContent = (N().ic+' '+N().nom+' — ') + (m>=seuil ? "Roi du goudron ! Le classement hebdo t'attend."
                    : m>=Math.round(220/N().coef) ? "Belle course ! Encore un effort pour entrer au classement."
                    : "Aïe, la chute... Remonte en selle et bats ton record !");
  if(m>=500){SFX.victoire();confettiParts=confetti(cvs,ctx,W/2,H*0.35);}else SFX.defaite();
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Moto',score:Math.round(m*0.9*N().coef),victoire:m>=Math.round(500/N().coef)},'*');}catch(e){}}
  fin.style.display='flex';
}

document.getElementById('rejouer').addEventListener('click',()=>{
  fin.style.display='none';confettiParts=[];reset();
});

// ---- Rendu ----
function draw(){
  // bas-côtés (latérite + herbe)
  if(texOk('BASCOTE')){
    if(!patBas)patBas=ctx.createPattern(IMG.BASCOTE,'repeat');
    ctx.save();
    ctx.translate(0,lineOff%IMG.BASCOTE.naturalHeight);
    ctx.fillStyle=patBas;
    ctx.fillRect(0,-IMG.BASCOTE.naturalHeight,W,H+IMG.BASCOTE.naturalHeight*2);
    ctx.restore();
  }else{
    ctx.fillStyle='#0A5C2D';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#8a5a33';
    ctx.fillRect(roadL-14,0,14,H);ctx.fillRect(roadR,0,14,H);
  }
  // route
  if(texOk('BITUME')){
    if(!patBitume)patBitume=ctx.createPattern(IMG.BITUME,'repeat');
    ctx.save();
    ctx.beginPath();ctx.rect(roadL,0,roadR-roadL,H);ctx.clip();
    ctx.translate(0,lineOff%IMG.BITUME.naturalHeight);
    ctx.fillStyle=patBitume;
    ctx.fillRect(roadL,-IMG.BITUME.naturalHeight,roadR-roadL,H+IMG.BITUME.naturalHeight*2);
    ctx.restore();
    // ombre douce sur les bords de chaussée
    var og=ctx.createLinearGradient(roadL,0,roadL+22,0);
    og.addColorStop(0,'rgba(0,0,0,.35)');og.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=og;ctx.fillRect(roadL,0,22,H);
    var og2=ctx.createLinearGradient(roadR,0,roadR-22,0);
    og2.addColorStop(0,'rgba(0,0,0,.35)');og2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=og2;ctx.fillRect(roadR-22,0,22,H);
  }else{
    ctx.fillStyle='#3a3d36';
    ctx.fillRect(roadL,0,roadR-roadL,H);
  }
  // bords blancs
  ctx.fillStyle='#FAF7EF';
  ctx.fillRect(roadL,0,4,H);
  ctx.fillRect(roadR-4,0,4,H);
  // lignes centrales
  ctx.fillStyle='rgba(245,194,27,.9)';
  const cx1=roadL+(roadR-roadL)/3, cx2=roadL+2*(roadR-roadL)/3;
  for(let y=-64+lineOff;y<H;y+=64){
    ctx.fillRect(cx1-2,y,4,34);
    ctx.fillRect(cx2-2,y,4,34);
  }

  // pièces
  for(const c of coins){
    const w=Math.abs(Math.cos(c.spin))*c.r;
    if(texOk('PIECE')){
      ctx.save();
      ctx.translate(c.x,c.y);
      ctx.scale(Math.max(0.12,Math.abs(Math.cos(c.spin))),1);
      ctx.shadowBlur=8;ctx.shadowColor='rgba(245,194,27,.75)';
      ctx.drawImage(IMG.PIECE,-c.r,-c.r,c.r*2,c.r*2);
      ctx.restore();
    }else{
      ctx.fillStyle='#F5C21B';
      ctx.beginPath();ctx.ellipse(c.x,c.y,w,c.r,0,0,7);ctx.fill();
      ctx.strokeStyle='#c79a10';ctx.lineWidth=2;ctx.stroke();
    }
  }

  // obstacles
  for(const o of obs) drawObs(o);

  // poussière
  for(const d of dust){
    ctx.fillStyle='rgba(138,90,51,'+d.a*0.5+')';
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill();
  }

  drawMoto();
}

function drawObs(o){
  var cles={trou:'TROU',baril:'BARIL',taxi:'TAXI',camion:'CAMION'};
  var cle=cles[o.type];
  if(texOk(cle)){
    // ombre portée au sol (sauf pour le trou qui EST dans le sol)
    if(o.type!=='trou'){
      ctx.fillStyle='rgba(0,0,0,.32)';
      ctx.beginPath();ctx.ellipse(o.x+o.w/2+2,o.y+o.h/2+4,o.w*0.46,o.h*0.44,0,0,7);ctx.fill();
    }
    ctx.drawImage(IMG[cle],o.x,o.y,o.w,o.h);
    return;
  }
  // repli dessiné
  ctx.save();
  if(o.type==='trou'){
    ctx.fillStyle='#181a15';
    ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,7);ctx.fill();
    ctx.strokeStyle='#57594f';ctx.lineWidth=3;ctx.stroke();
  }else if(o.type==='baril'){
    ctx.fillStyle='#E32219';
    ctx.beginPath();ctx.arc(o.x+o.w/2,o.y+o.h/2,o.w/2,0,7);ctx.fill();
    ctx.strokeStyle='#FAF7EF';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(o.x+o.w/2,o.y+o.h/2,o.w/2-5,0,7);ctx.stroke();
  }else{
    const couleur=o.type==='taxi'?'#128a44':'#c9c4b6';
    ctx.fillStyle=couleur;
    ctx.beginPath();ctx.roundRect(o.x,o.y,o.w,o.h,6);ctx.fill();
    ctx.fillStyle='rgba(18,19,15,.5)';
    ctx.fillRect(o.x+4,o.y+o.h*0.18,o.w-8,o.h*0.18);
    ctx.fillRect(o.x+4,o.y+o.h*0.62,o.w-8,o.h*0.18);
  }
  ctx.restore();
}

function drawMoto(){
  if(texOk('MOTO')){
    // ombre au sol
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();ctx.ellipse(moto.x+2,moto.y+6,17,26,0,0,7);ctx.fill();
    ctx.save();
    ctx.translate(moto.x,moto.y);
    ctx.rotate(moto.lean);
    var mw=42, mh=mw*IMG.MOTO.naturalHeight/IMG.MOTO.naturalWidth;
    ctx.drawImage(IMG.MOTO,-mw/2,-mh/2,mw,mh);
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(moto.x,moto.y);
  ctx.rotate(moto.lean);
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.roundRect(-5,-30,10,14,5);ctx.fill();
  ctx.beginPath();ctx.roundRect(-5,16,10,14,5);ctx.fill();
  ctx.fillStyle='#E32219';
  ctx.beginPath();ctx.roundRect(-8,-18,16,36,7);ctx.fill();
  ctx.fillStyle='#F5C21B';
  ctx.beginPath();ctx.roundRect(-6,-12,12,12,5);ctx.fill();
  ctx.strokeStyle='#12130F';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-13,-14);ctx.lineTo(13,-14);ctx.stroke();
  ctx.fillStyle='#FAF7EF';
  ctx.beginPath();ctx.arc(0,2,8,0,7);ctx.fill();
  ctx.strokeStyle='#E32219';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}

// ---- Entrées ----
function steer(clientX){
  const r=cvs.getBoundingClientRect();
  moto.tx=clientX-r.left;
  if(!started&&alive){started=true;msg.textContent="Évite taxis, camions, trous et barils !";}
}
cvs.addEventListener('touchstart',e=>{steer(e.touches[0].clientX);e.preventDefault();},{passive:false});
cvs.addEventListener('touchmove',e=>{steer(e.touches[0].clientX);e.preventDefault();},{passive:false});
let mdown=false;
cvs.addEventListener('mousedown',e=>{mdown=true;steer(e.clientX);});
window.addEventListener('mousemove',e=>{if(mdown)steer(e.clientX);});
window.addEventListener('mouseup',()=>{mdown=false;});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){moto.tx=moto.x-70;if(!started){started=true;msg.textContent="Évite le trafic !";}}
  if(e.key==='ArrowRight'){moto.tx=moto.x+70;if(!started){started=true;msg.textContent="Évite le trafic !";}}
});

// ---- Boucle ----
let last=0;
function loop(now){
  const dt=Math.min(2.5,(now-last)/16.7); last=now;
  step(dt);
  draw();
  if(confettiParts.length)drawConfetti(ctx,confettiParts,dt);
  requestAnimationFrame(loop);
}
resize();reset();
document.querySelectorAll('.nivBtn').forEach(function(b){
  b.addEventListener('click',function(){changerNiveau(b.dataset.n);});
});
window.__moto={state:()=>({dist:Math.floor(dist/10),alive,confettiN:confettiParts.length,muet:SFX.estMuet(),
    niveau:niveau,speed:+speed.toFixed(2),coef:N().coef}),
  changerNiveau:(n)=>changerNiveau(n),
  forcerCrash:(m)=>{dist=m*10;crash();}};
requestAnimationFrame(loop);
})();
</script>
</body>
