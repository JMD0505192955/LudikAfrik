<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dozo</title>
<style>
  :root{--vert:#0E7A3C;--rouge:#E32219;--or:#F5C21B;--nuit:#12130F;--craie:#FAF7EF;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#0f1410;font-family:"Arial Black","Segoe UI",Arial,sans-serif;color:var(--craie);
    display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;}
  header{width:100%;max-width:430px;padding:8px 14px 4px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:17px;letter-spacing:2px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial;font-weight:400;font-size:8.5px;letter-spacing:2.5px;color:#8b8f84;margin-top:3px;}
  .hud{display:flex;align-items:center;gap:10px;font-size:13px;}
  .hud .val{color:var(--or);}
  #barreVie{width:100%;max-width:430px;padding:0 14px 5px;}
  #vieFond{height:12px;background:#1d2419;border:1.5px solid #2f3b28;border-radius:99px;overflow:hidden;position:relative;}
  #vieBarre{height:100%;background:linear-gradient(90deg,#2fa04a,#8fd04a);width:100%;transition:width .18s;}
  #vieTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.8);}
  #niv{display:flex;align-items:center;gap:9px;justify-content:center;padding:0 14px 4px;width:100%;max-width:430px;}
  #niv button{width:32px;height:32px;border-radius:50%;background:#1d2419;border:1.5px solid rgba(245,194,27,.25);
    color:var(--or);font-size:13px;flex-shrink:0;}
  #niv button:disabled{opacity:.25;}
  #nivInfo{flex:1;text-align:center;line-height:1.2;}
  #nivZone{font-family:Arial;font-size:9px;letter-spacing:2px;color:#8b8f84;text-transform:uppercase;}
  #nivNom{font-size:13px;color:var(--or);}
  #armeBox{display:flex;gap:6px;justify-content:center;min-height:26px;padding:0 14px 4px;width:100%;max-width:430px;}
  .armeTag{display:flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;
    font-size:11px;font-family:Arial;font-weight:bold;border:1.5px solid;}
  .armeTag.simple{border-color:#8b8f84;color:#c9ccc0;background:rgba(139,143,132,.12);}
  .armeTag.rafale{border-color:#F5C21B;color:#F5C21B;background:rgba(245,194,27,.13);}
  .armeTag.eventail{border-color:#6ec8e8;color:#6ec8e8;background:rgba(110,200,232,.13);}
  .armeTag.perforant{border-color:#e0603a;color:#e0603a;background:rgba(224,96,58,.13);}
  #msg{height:19px;font-size:12px;text-align:center;color:var(--or);font-family:Arial;}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;justify-content:center;align-items:center;padding:0 8px 6px;}
  canvas{display:block;border-radius:12px;}
  #cmd{position:absolute;bottom:12px;left:14px;right:14px;display:flex;justify-content:space-between;
    align-items:flex-end;pointer-events:none;}
  .dpad{display:flex;gap:8px;}
  .btnC{width:58px;height:58px;border-radius:50%;background:rgba(15,20,16,.55);
    border:2px solid rgba(250,247,239,.3);display:flex;align-items:center;justify-content:center;
    font-size:22px;pointer-events:auto;color:var(--craie);backdrop-filter:blur(2px);}
  .btnC:active{background:rgba(245,194,27,.35);}
  .droite{display:flex;gap:9px;align-items:flex-end;}
  #bTir{width:70px;height:70px;background:rgba(227,34,25,.5);border-color:rgba(255,120,100,.55);font-size:25px;}
  #bSaut{width:62px;height:62px;background:rgba(14,122,60,.5);border-color:rgba(143,191,110,.5);font-size:24px;}
  #bCoucher{width:54px;height:54px;background:rgba(90,110,140,.45);border-color:rgba(150,180,220,.5);font-size:21px;}
  #bCoucher.actif{background:rgba(150,180,220,.6);}
  #fin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(12,16,12,.95);text-align:center;padding:20px;border-radius:12px;}
  #fin h2{font-size:30px;color:var(--or);margin-bottom:4px;}
  #fin .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:310px;margin:8px 0 14px;}
  #fin .stat{background:rgba(245,194,27,.08);border-radius:10px;padding:9px 4px;}
  #fin .stat .v{font-size:18px;font-weight:bold;color:var(--or);}
  #fin .stat .l{font-size:8.5px;color:#8fa084;letter-spacing:1px;margin-top:2px;}
  #fin p{font-family:Arial;font-size:12.5px;color:#c2ccb8;margin-bottom:14px;line-height:1.5;max-width:310px;}
  #fin button{font-family:inherit;font-size:14px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:11px 30px;margin-top:4px;}
  #partageBtns{display:flex;flex-direction:column;gap:6px;width:100%;max-width:280px;margin-bottom:10px;}
  #partageBtns button{background:rgba(255,255,255,.05);border:1px solid #3d4735;color:var(--craie);
    border-radius:10px;padding:9px;font-size:12px;margin:0;}
  #partageBtns #btnPartager{border-color:#25D366;color:#25D366;}
  #partageBtns #btnDefier{border-color:var(--or);color:var(--or);}
  footer{width:100%;max-width:430px;padding:4px 14px 8px;text-align:center;
    font-family:Arial;font-size:10px;color:#5d6b55;}
</style>
</head>
<body>
<header>
  <div class="logo">DO<span>ZO</span><small>LE CHASSEUR DE LA BROUSSE</small></div>
  <div style="display:flex;align-items:center;gap:9px">
    <button id="btnSon" style="background:none;border:1px solid #4a5544;color:var(--craie);border-radius:999px;width:28px;height:28px;font-size:12px">🔊</button>
    <div class="hud">
      <div>🎯<span class="val" id="tues">0</span></div>
      <div>⭐<span class="val" id="score">0</span></div>
    </div>
  </div>
</header>
<div id="barreVie">
  <div id="vieFond"><div id="vieBarre"></div><div id="vieTxt">100%</div></div>
</div>
<div id="niv">
  <button id="nivPrec">◀</button>
  <div id="nivInfo"><div id="nivZone">LA BROUSSE</div><div id="nivNom">1. La piste</div></div>
  <button id="nivSuiv">▶</button>
</div>
<div id="armeBox"></div>
<div id="msg">Avance et tire sur les braconniers !</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="cmd">
    <div class="dpad">
      <div class="btnC" id="bGauche">◀</div>
      <div class="btnC" id="bDroite">▶</div>
    </div>
    <div class="droite">
      <div class="btnC" id="bCoucher">⬇</div>
      <div class="btnC" id="bSaut">⤴</div>
      <div class="btnC" id="bTir">🎯</div>
    </div>
  </div>
  <div id="fin">
    <h2 id="finTitre"></h2>
    <div class="stats">
      <div class="stat"><div class="v" id="fTues">0</div><div class="l">ÉLIMINÉS</div></div>
      <div class="stat"><div class="v" id="fDist">0</div><div class="l">DISTANCE</div></div>
      <div class="stat"><div class="v" id="fNiv">1/6</div><div class="l">NIVEAU</div></div>
    </div>
    <p id="finTexte"></p>
    <div id="partageBtns">
      <button id="btnPartager">📤 Partager mon score</button>
      <button id="btnDefier">⚔️ Défier un ami</button>
    </div>
    <button id="suivant" style="display:none">NIVEAU SUIVANT ▶</button>
    <button id="rejouer">REJOUER</button>
  </div>
</div>
<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>
<script>
(function(){
"use strict";
// ---------- Son ----------
var actx,muet=false;
try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function tone(f,d,t,v,gl){if(muet)return;try{var c=ac(),o=c.createOscillator(),g=c.createGain();
o.type=t||'sine';o.frequency.value=f;if(gl)o.frequency.linearRampToValueAtTime(gl,c.currentTime+d);
g.gain.value=v||0.10;g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
var SFX={
  tir:function(){tone(180,0.07,'square',0.09,70);},
  tirFort:function(){tone(140,0.10,'sawtooth',0.11,60);},
  saut:function(){tone(320,0.10,'square',0.06,600);},
  touche:function(){tone(520,0.06,'triangle',0.08,780);},
  mortEnn:function(){tone(220,0.10,'square',0.09,90);setTimeout(function(){tone(420,0.09,'triangle',0.07);},55);},
  degat:function(){[300,240,180].forEach(function(f,i){setTimeout(function(){tone(f,0.15,'sawtooth',0.10);},i*80);});},
  arme:function(){[523,659,880,1174].forEach(function(f,i){setTimeout(function(){tone(f,0.13,'triangle',0.12);},i*70);});},
  soin:function(){[660,880,1100].forEach(function(f,i){setTimeout(function(){tone(f,0.14,'sine',0.10);},i*90);});},
  victoire:function(){[523,659,784,1046,1319].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'sine',0.13);},i*95);});},
  gameover:function(){[392,311,247,196].forEach(function(f,i){setTimeout(function(){tone(f,0.27,'sine',0.12);},i*155);});},
  estMuet:function(){return muet;},
  toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}
};
(function(){var b=document.getElementById('btnSon');
function m(){b.textContent=SFX.estMuet()?'🔇':'🔊';}m();
b.addEventListener('click',function(){SFX.toggle();m();});})();

function domConfetti(){
  var cols=['#F5C21B','#E32219','#0E7A3C','#8fd04a','#FAF7EF'];
  for(var i=0;i<24;i++){
    var el=document.createElement('div'),s=4+Math.random()*4;
    el.style.cssText='position:fixed;z-index:60;pointer-events:none;border-radius:2px;';
    el.style.width=s+'px';el.style.height=s+'px';el.style.background=cols[i%cols.length];
    el.style.left=(window.innerWidth/2+(Math.random()-0.5)*70)+'px';el.style.top='40%';
    document.body.appendChild(el);
    var dx=(Math.random()-0.5)*250,dy=190+Math.random()*190,r=Math.random()*700-350,d=900+Math.random()*500;
    el.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:'translate('+dx+'px,'+dy+'px) rotate('+r+'deg)',opacity:0}],
      {duration:d,easing:'cubic-bezier(.25,.46,.45,.94)'});
    (function(e,t){setTimeout(function(){e.remove();},t+50);})(el,d);
  }
}

var $=function(i){return document.getElementById(i);};

      var nbE=1+(Math.random()<0.35*n.ennemis?1:0);
      for(var k=0;k<nbE;k++){
        var t=n.types[Math.floor(Math.random()*n.types.length)];
        var T=TYPES[t];
        ennemis.push({x:x+seg*(0.3+k*0.35), y:SOL, w:T.w, h:T.h,
          pv:T.pv, pvMax:T.pv, type:t, vivant:true, vx:-T.vitesse*(0.85+Math.random()*0.3),
          minX:x, maxX:x+seg, t:Math.random()*100, tTir:Math.random()*120,
          invuln:0, etat:'patrouille', alerte:false});
      }
    }
    // bonus au sol
    if(Math.random()<0.28){
      bonus.push({x:x+seg*0.6, y:SOL-24, type:Math.random()<0.45?'soin':'arme', pris:false, t:0});
    }
    // décor
    for(var d=0;d<3;d++){
      decor.push({x:x+Math.random()*seg, type:Math.random()<0.5?'arbre':'buisson', e:0.8+Math.random()*0.5});
    }
    x+=seg;
  }
  // zone finale
  plateformes.push({x:x,y:SOL,w:TUILE*(n.boss?18:8),h:90});
  if(n.boss){
    boss={x:x+TUILE*12, y:SOL, w:60, h:70, pv:14, pvMax:14, vx:-1.4,
      phase:'attente', t:0, invuln:0, mort:false,
      minX:x+TUILE*3, maxX:x+TUILE*16, tTir:0};
    window.__arrivee=x+TUILE*40;
    window.__arene=x;
  }else{
    window.__arrivee=x+TUILE*5;
    window.__arene=null;
  }
}
function reset(){
  resize();
  vieMax=100; vie=100;
  score=0; tues=0; dist=0; over=false; gagne=false; invincible=0; recharge=0;
  armeCourante='simple'; munitions=-1;
  genererNiveau();
  dozo={x:70, y:SOL-52, w:26, h:52, vx:0, vy:0, sol:true, regard:1, anim:0, tirAnim:0};
  cam=0;
  gauche=droite=tirEnCours=sautDemande=couche=false;
  $('bCoucher').classList.remove('actif');
  majVie(); majArme(); majNiv();
  $('tues').textContent='0'; $('score').textContent='0';
  $('fin').style.display='none';
  $('msg').textContent = N().boss ? '⚠️ Le chef braconnier t\'attend !' : 'Avance et tire sur les braconniers !';
}
function majVie(){
  var pct=Math.max(0,Math.round(vie/vieMax*100));
  $('vieBarre').style.width=pct+'%';
  $('vieTxt').textContent=pct+'%';
  $('vieBarre').style.background = pct>50
    ? 'linear-gradient(90deg,#2fa04a,#8fd04a)'
    : pct>25 ? 'linear-gradient(90deg,#c99a1a,#e8c74a)'
    : 'linear-gradient(90deg,#a01a10,#e34a3a)';
}
function majArme(){
  var A=ARMES[armeCourante];
  var m = A.munitions<0 ? '∞' : munitions;
  $('armeBox').innerHTML='<div class="armeTag '+A.cls+'"><span>'+A.ico+'</span>'+A.nom+' · '+m+'</div>';
}
function majNiv(){
  var n=N();
  $('nivZone').textContent=n.zone;
  $('nivNom').textContent=n.num+'. '+n.nom;
  $('nivPrec').disabled=(nivIdx<=0);
  $('nivSuiv').disabled=(nivIdx>=Math.min(NIVEAUX.length-1,maxDeb));
}
function allerNiveau(i){
  if(i<0||i>=NIVEAUX.length||i>maxDeb)return;
  nivIdx=i;
  try{localStorage.setItem('fasogames_dozo_niv',i);}catch(e){}
  reset();
}
$('nivPrec').addEventListener('click',function(){allerNiveau(nivIdx-1);});
$('nivSuiv').addEventListener('click',function(){allerNiveau(nivIdx+1);});
$('suivant').addEventListener('click',function(){if(nivIdx+1<NIVEAUX.length)allerNiveau(nivIdx+1);});
$('rejouer').addEventListener('click',reset);

// ================= PHYSIQUE =================
var G=0.58, VMAX=3.6, SAUT=-11.8;
function step(dt){
  tempsJeu+=dt*0.016;
  if(over)return;
  if(invincible>0)invincible-=dt;
  if(recharge>0)recharge-=dt;

  // si on décolle du sol en étant couché, on se relève automatiquement
  if(couche&&!dozo.sol&&dozo.vy<-1){
    couche=false;
    $('bCoucher').classList.remove('actif');
  }
  var facteur=couche?0.32:1;   // on rampe lentement
  // déplacement
  if(gauche){dozo.vx-=0.68*facteur*dt;dozo.regard=-1;}
  if(droite){dozo.vx+=0.68*facteur*dt;dozo.regard=1;}
  if(!gauche&&!droite)dozo.vx*=Math.pow(0.80,dt);
  var vmaxAct=couche?VMAX*0.42:VMAX;
  dozo.vx=Math.max(-vmaxAct,Math.min(vmaxAct,dozo.vx));
  dozo.x+=dozo.vx*dt;
  if(dozo.x<12)dozo.x=12;
  // l'animation avance avec la distance réelle parcourue : pas de tremblement
  dozo.anim+=Math.abs(dozo.vx)*dt*0.028;

  // saut
  if(sautDemande&&dozo.sol&&!couche){dozo.vy=SAUT;dozo.sol=false;SFX.saut();}
  sautDemande=false;

  // tir
  if(dozo.tirAnim>0)dozo.tirAnim-=dt;
  if(tirEnCours&&recharge<=0)tirer();

  // gravité
  dozo.vy+=G*dt;
  if(dozo.vy>16)dozo.vy=16;
  var ancY=dozo.y;
  dozo.y+=dozo.vy*dt;
  dozo.sol=false;
  for(var i=0;i<plateformes.length;i++){
    var p=plateformes[i];
    if(dozo.x+dozo.w*0.4<p.x||dozo.x-dozo.w*0.4>p.x+p.w)continue;
    if(dozo.vy>=0 && ancY+dozo.h*0.5<=p.y+5 && dozo.y+dozo.h*0.5>=p.y){
      dozo.y=p.y-dozo.h*0.5;dozo.vy=0;dozo.sol=true;
    }
  }
  if(dozo.y>H+70){subirDegats(35,true);dozo.x=Math.max(60,dozo.x-TUILE*3);dozo.y=SOL-52;dozo.vy=0;}

  majEnnemis(dt);
  majBoss(dt);
  majBalles(dt);
  majBonus(dt);
  majParticules(dt);

  // caméra
  var cible=dozo.x-W*0.32;
  cam+=(cible-cam)*0.12*dt;
  if(cam<0)cam=0;
  dist=Math.max(dist,Math.floor(dozo.x/TUILE));
  if(dozo.x>=window.__arrivee)terminer(true);
}
function tirer(){
  var A=ARMES[armeCourante];
  if(A.munitions>=0&&munitions<=0){
    armeCourante='simple';munitions=-1;majArme();
    $('msg').textContent='Plus de munitions — retour au fusil';
    return;
  }
  recharge=A.cadence;
  if(A.munitions>=0){munitions--;majArme();}
  dozo.tirAnim=10;
  var bx=dozo.x+dozo.regard*(couche?20:16);
  var by=dozo.y-(couche?dozo.h*0.02:dozo.h*0.22);
  for(var k=0;k<A.nb;k++){
    var ang=(A.nb>1)?((k-(A.nb-1)/2)*0.20):0;
    balles.push({x:bx,y:by,vx:Math.cos(ang)*A.vitesse*dozo.regard,vy:Math.sin(ang)*A.vitesse*0.6,
      vie:110,degats:A.degats,perce:!!A.perce,arme:armeCourante});
  }
  if(A.degats>1)SFX.tirFort();else SFX.tir();
  // recul + fumée
  dozo.vx-=dozo.regard*0.35;
  for(var f=0;f<3;f++){
    particules.push({x:bx,y:by,vx:dozo.regard*(1+Math.random()),vy:(Math.random()-0.5)*1.2,
      vie:1,col:'#c8c0a8',t:2+Math.random()*2,decl:0.06});
  }
}
function majBalles(dt){
  for(var i=balles.length-1;i>=0;i--){
    var b=balles[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.vie-=dt;
    if(b.vie<=0||b.x<cam-60||b.x>cam+W+60){balles.splice(i,1);continue;}
    var touche=false;
    for(var e=0;e<ennemis.length;e++){
      var en=ennemis[e];
      if(!en.vivant||en.invuln>0)continue;
      if(Math.abs(b.x-en.x)<en.w*0.7&&b.y>en.y-en.h-10&&b.y<en.y+12){
        blesserEnnemi(en,b.degats);
        touche=true;
        if(!b.perce)break;
      }
    }
    if(boss&&!boss.mort&&boss.phase!=='attente'&&boss.invuln<=0){
      if(Math.abs(b.x-boss.x)<boss.w*0.55&&b.y>boss.y-boss.h-10&&b.y<boss.y+10){
        toucherBoss(b.degats);
        touche=true;
      }
    }
    if(touche&&!b.perce)balles.splice(i,1);
  }
  // balles ennemies
  for(var j=ballesEnn.length-1;j>=0;j--){
    var be=ballesEnn[j];
    be.x+=be.vx*dt; be.vie-=dt;
    if(be.vie<=0||be.x<cam-60||be.x>cam+W+60){ballesEnn.splice(j,1);continue;}
    var hautDozo=couche?14:28;
    if(Math.abs(be.x-dozo.x)<18&&Math.abs(be.y-dozo.y)<hautDozo){
      ballesEnn.splice(j,1);
      subirDegats(12,false);
    }
  }
}
function blesserEnnemi(en,d){
  en.pv-=d; en.invuln=18;
  SFX.touche();
  exploser(en.x,en.y-en.h*0.5,'#c94f3d',5);
  if(en.pv<=0){
    en.vivant=false; tues++;
    var pts=TYPES[en.type].pts;
    score+=pts;
    SFX.mortEnn();
    exploser(en.x,en.y-en.h*0.5,TYPES[en.type].couleur,12);
    $('tues').textContent=tues; $('score').textContent=score;
    if(Math.random()<0.22)bonus.push({x:en.x,y:en.y-24,type:Math.random()<0.5?'soin':'arme',pris:false,t:0});
  }
}
function subirDegats(d,chute){
  if(invincible>0||over)return;
  vie-=d;
  invincible=70;
  SFX.degat();
  majVie();
  if(vie<=0){vie=0;majVie();terminer(false);return;}
  $('msg').textContent = chute?'💥 Aïe, la chute !':'💥 Touché ! '+Math.round(vie)+'%';
}
function majEnnemis(dt){
  for(var i=0;i<ennemis.length;i++){
    var en=ennemis[i];
    if(!en.vivant)continue;
    if(en.x<cam-200||en.x>cam+W+200)continue;
    en.t+=dt;
    if(en.invuln>0)en.invuln-=dt;
    var T=TYPES[en.type];
    var ec=dozo.x-en.x;
    // détection
    if(Math.abs(ec)<W*0.62)en.alerte=true;
    if(en.alerte){
      if(T.tire){
        // le braconnier garde ses distances et tire
        if(Math.abs(ec)>TUILE*4)en.x+=(ec>0?1:-1)*T.vitesse*0.6*dt;
        en.tTir+=dt;
        if(en.tTir>T.cadence&&Math.abs(ec)<W*0.55){
          en.tTir=0;
          ballesEnn.push({x:en.x+(ec>0?14:-14),y:en.y-en.h*0.55,vx:(ec>0?1:-1)*5.2,vie:130});
          SFX.tir();
        }
      }else{
        // les fauves chargent
        en.x+=(ec>0?1:-1)*T.vitesse*dt;
      }
    }else{
      en.x+=en.vx*dt;
      if(en.x<en.minX||en.x>en.maxX)en.vx*=-1;
    }
    // contact
    if(Math.abs(ec)<(dozo.w*0.5+en.w*0.5)&&Math.abs(dozo.y-(en.y-en.h*0.5))<(dozo.h*0.5+en.h*0.5)){
      subirDegats(T.charge?16:10,false);
    }
  }
}
function majBoss(dt){
  if(!boss||boss.mort)return;
  boss.t+=dt;
  if(boss.invuln>0)boss.invuln-=dt;
  var ec=dozo.x-boss.x;
  if(boss.phase==='attente'){
    if(dozo.x>window.__arene+TUILE*2){
      boss.phase='combat';boss.t=0;
      $('msg').textContent='⚠️ LE CHEF BRACONNIER !';
      SFX.degat();
    }
    return;
  }
  // se déplace et tire par salves
  boss.x+=boss.vx*dt;
  if(boss.x<boss.minX){boss.x=boss.minX;boss.vx=Math.abs(boss.vx);}
  if(boss.x>boss.maxX){boss.x=boss.maxX;boss.vx=-Math.abs(boss.vx);}
  boss.tTir+=dt;
  if(boss.tTir>75){
    boss.tTir=0;
    var s=(ec>0?1:-1);
    for(var k=-1;k<=1;k++){
      ballesEnn.push({x:boss.x+s*20,y:boss.y-boss.h*0.6+k*10,vx:s*5.6,vie:150});
    }
    SFX.tirFort();
  }
  // contact
  if(Math.abs(ec)<(dozo.w*0.5+boss.w*0.5)&&Math.abs(dozo.y-(boss.y-boss.h*0.5))<(dozo.h*0.5+boss.h*0.6)){
    subirDegats(18,false);
  }
}
function toucherBoss(d){
  if(!boss||boss.mort||boss.invuln>0)return;
  boss.pv-=d; boss.invuln=16;
  SFX.touche();
  exploser(boss.x,boss.y-boss.h*0.6,'#e8a04a',6);
  if(boss.pv<=0){
    boss.mort=true; tues++;
    score+=1200;
    $('tues').textContent=tues; $('score').textContent=score;
    SFX.victoire();
    exploser(boss.x,boss.y-boss.h*0.5,'#F5C21B',30);
    $('msg').textContent='🏆 Chef braconnier vaincu ! +1200';
    window.__arrivee=boss.x+TUILE*4;
    plateformes.push({x:boss.x,y:SOL,w:TUILE*8,h:90});
  }
}
function majBonus(dt){
  for(var i=0;i<bonus.length;i++){
    var bo=bonus[i];
    if(bo.pris)continue;
    bo.t+=dt*0.08;
    if(Math.abs(bo.x-dozo.x)<24&&Math.abs(bo.y-dozo.y)<30){
      bo.pris=true;
      if(bo.type==='soin'){
        vie=Math.min(vieMax,vie+28);majVie();
        SFX.soin();
        exploser(bo.x,bo.y,'#8fd04a',10);
        $('msg').textContent='💚 Soin +28%';
      }else{
        var choix=['rafale','eventail','perforant'];
        var a=choix[Math.floor(Math.random()*choix.length)];
        armeCourante=a; munitions=ARMES[a].munitions;
        majArme(); SFX.arme();
        exploser(bo.x,bo.y,'#F5C21B',12);
        $('msg').textContent=ARMES[a].ico+' '+ARMES[a].nom+' ramassé !';
      }
    }
  }
}
function exploser(x,y,col,n){
  for(var i=0;i<(n||8);i++){
    var a=Math.random()*Math.PI*2, v=1+Math.random()*2.6;
    particules.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,vie:1,col:col,
      t:2+Math.random()*3,decl:0.03});
  }
}
function majParticules(dt){
  for(var i=particules.length-1;i>=0;i--){
    var p=particules[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.2*dt;p.vie-=(p.decl||0.03)*dt;
    if(p.vie<=0)particules.splice(i,1);
  }
}
function terminer(win){
  over=true;gagne=win;
  var n=N();
  var dernier=(nivIdx===NIVEAUX.length-1);
  if(win){
    if(nivIdx>=maxDeb&&!dernier){
      maxDeb=nivIdx+1;
      try{localStorage.setItem('fasogames_dozo_max',maxDeb);}catch(e){}
    }
    scoreCumul+=score;
    try{localStorage.setItem('fasogames_dozo_cumul',scoreCumul);}catch(e){}
  }
  $('finTitre').textContent = win
    ? (dernier?'🏆 RÉSERVE SAUVÉE !':'✅ Niveau '+n.num+' réussi !')
    : '💀 Le Dozo est tombé';
  $('fTues').textContent=tues;
  $('fDist').textContent=dist+' m';
  $('fNiv').textContent=n.num+'/'+NIVEAUX.length;
  $('finTexte').textContent = win
    ? (dernier
      ? 'Les braconniers ont fui la réserve ! Les animaux sont saufs. Total : '+scoreCumul+' pts.'
      : 'Zone sécurisée ! Le niveau '+(n.num+1)+' est ouvert. Total : '+scoreCumul+' pts.')
    : 'Ramasse les soins et change d\'arme : l\'éventail balaie les groupes, le perforant traverse.';
  $('suivant').style.display=(win&&!dernier)?'block':'none';
  $('rejouer').textContent=win?'REJOUER CE NIVEAU':'REJOUER';
  if(win){SFX.victoire();domConfetti();}else{SFX.gameover();}
  var envoi=Math.round(Math.min(700,score*0.30)*n.coef);
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Dozo',
    score:envoi,victoire:win},'*');}catch(e){}}
  $('fin').style.display='flex';
}

// ================= RENDU =================
function draw(){
  // ciel de forêt
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2d5a48');g.addColorStop(0.45,'#3f7a5a');g.addColorStop(0.8,'#5a8a60');g.addColorStop(1,'#7a9058');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // rayons de lumière
  for(var r=0;r<4;r++){
    var rx=(r*180-(cam*0.05)%(180*4)+180*4)%(180*4)-40;
    ctx.save();
    ctx.globalAlpha=0.07+Math.sin(tempsJeu*0.7+r)*0.02;
    ctx.fillStyle='#e8f0c0';
    ctx.beginPath();
    ctx.moveTo(rx,0);ctx.lineTo(rx+34,0);ctx.lineTo(rx+80,SOL);ctx.lineTo(rx+16,SOL);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  // canopée lointaine
  ctx.fillStyle='rgba(30,60,44,.55)';
  ctx.beginPath();ctx.moveTo(0,0);
  for(var cx=0;cx<=W;cx+=14){
    var q=(cx+cam*0.10)*0.013;
    ctx.lineTo(cx,66+Math.sin(q)*24+Math.sin(q*2.4)*12);
  }
  ctx.lineTo(W,0);ctx.closePath();ctx.fill();
  // troncs de fond
  for(var t2=0;t2<9;t2++){
    var tx=(t2*230-(cam*0.22)%(230*9)+230*9)%(230*9)-50;
    if(tx<-60||tx>W+60)continue;
    ctx.fillStyle='rgba(52,72,52,.45)';
    ctx.fillRect(tx-13,60,26,SOL-60);
  }
  // sous-bois
  ctx.fillStyle='rgba(38,72,50,.5)';
  ctx.beginPath();ctx.moveTo(0,SOL);
  for(var sx=0;sx<=W;sx+=14){
    var q2=(sx+cam*0.20)*0.012;
    ctx.lineTo(sx,SOL-52+Math.sin(q2)*20+Math.sin(q2*2.6)*9);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  ctx.save();
  ctx.translate(-cam,0);

  // décor (arbres et buissons)
  decor.forEach(function(d){
    if(d.x<cam-90||d.x>cam+W+90)return;
    if(d.type==='arbre')arbreForet(d.x,SOL,d.e);
    else buisson(d.x,SOL,d.e);
  });
  // plateformes
  plateformes.forEach(function(p){
    if(p.x+p.w<cam-40||p.x>cam+W+40)return;
    if(p.plateforme){
      var gb=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      gb.addColorStop(0,'#7a6440');gb.addColorStop(1,'#4a3c24');
      ctx.fillStyle=gb;
      ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,4);ctx.fill();
      ctx.fillStyle='#3f7a48';ctx.fillRect(p.x,p.y,p.w,4);
    }else{
      var gs=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      gs.addColorStop(0,'#6e5a34');gs.addColorStop(0.2,'#57462a');gs.addColorStop(1,'#33281a');
      ctx.fillStyle=gs;ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle='#3f7a48';ctx.fillRect(p.x,p.y,p.w,7);
      ctx.strokeStyle='rgba(30,60,36,.6)';ctx.lineWidth=2;
      for(var hx=p.x+6;hx<p.x+p.w;hx+=19){
        ctx.beginPath();ctx.moveTo(hx,p.y);ctx.lineTo(hx+((hx/19|0)%2?3:-3),p.y-9);ctx.stroke();
      }
    }
  });
  // bonus
  bonus.forEach(function(bo){
    if(bo.pris)return;
    if(bo.x<cam-40||bo.x>cam+W+40)return;
    var fl=Math.sin(bo.t)*3;
    ctx.save();ctx.translate(bo.x,bo.y+fl);
    var col=bo.type==='soin'?'#8fd04a':'#F5C21B';
    ctx.shadowBlur=11;ctx.shadowColor=col;
    ctx.fillStyle='rgba(18,22,16,.85)';
    ctx.beginPath();ctx.roundRect(-13,-13,26,26,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle=col;ctx.lineWidth=2.2;
    ctx.beginPath();ctx.roundRect(-13,-13,26,26,7);ctx.stroke();
    ctx.fillStyle=col;
    if(bo.type==='soin'){
      ctx.fillRect(-3,-8,6,16);ctx.fillRect(-8,-3,16,6);
    }else{
      ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('★',0,1);
      ctx.textBaseline='alphabetic';
    }
    ctx.restore();
  });
  // ennemis
  ennemis.forEach(function(en){
    if(!en.vivant)return;
    if(en.x<cam-90||en.x>cam+W+90)return;
    if(en.invuln>0&&Math.floor(en.invuln/4)%2===0)return;
    var d=(dozo.x>en.x)?1:-1;
    if(en.type==='braconnier')braconnier(en.x,en.y,d,en.t);
    else if(en.type==='hyene')fauve(en.x,en.y,d,'#8a7a52','#5c4e2e',en.t,'hyene');
    else if(en.type==='panthere')fauve(en.x,en.y,d,'#2a2620','#15120e',en.t,'panthere');
    else buffle(en.x,en.y,d,en.t);
    if(en.pvMax>1&&en.pv<en.pvMax){
      var jw=en.w*0.9,jx=en.x-jw/2,jy=en.y-en.h-12;
      ctx.fillStyle='rgba(12,16,12,.65)';
      ctx.beginPath();ctx.roundRect(jx-1,jy-1,jw+2,6,3);ctx.fill();
      ctx.fillStyle='#E32219';
      ctx.beginPath();ctx.roundRect(jx,jy,jw*(en.pv/en.pvMax),4,2);ctx.fill();
    }
  });
  // boss
  if(boss&&!boss.mort)dessinerBoss();
  // balles
  balles.forEach(function(b){
    ctx.save();ctx.translate(b.x,b.y);
    var col=b.perce?'#e0603a':(b.arme==='eventail'?'#6ec8e8':'#F5C21B');
    ctx.shadowBlur=8;ctx.shadowColor=col;
    ctx.fillStyle=col;
    ctx.beginPath();ctx.ellipse(0,0,b.perce?7:5,b.perce?3:2.6,0,0,7);ctx.fill();
    ctx.globalAlpha=.4;
    ctx.beginPath();ctx.ellipse(-b.vx*1.4,0,7,2,0,0,7);ctx.fill();
    ctx.restore();
  });
  ballesEnn.forEach(function(b){
    ctx.save();ctx.translate(b.x,b.y);
    ctx.shadowBlur=8;ctx.shadowColor='#e34a3a';
    ctx.fillStyle='#e34a3a';
    ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();
    ctx.restore();
  });
  // particules
  particules.forEach(function(p){
    ctx.globalAlpha=Math.max(0,p.vie);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.t*p.vie,0,7);ctx.fill();
    ctx.globalAlpha=1;
  });
  // Dozo
  dessinerDozo();
  // sortie
  if(!boss||boss.mort)sortie(window.__arrivee,SOL);
  ctx.restore();

  // feuillage au premier plan
  ctx.save();
  for(var fp=0;fp<14;fp++){
    var fx=(fp*98-(cam*1.15)%(98*14)+98*14)%(98*14)-30;
    if(fx<-40||fx>W+40)continue;
    var osc=Math.sin(tempsJeu*1.2+fp)*4;
    ctx.fillStyle='rgba(26,58,36,.85)';
    ctx.beginPath();
    ctx.moveTo(fx,H);
    ctx.quadraticCurveTo(fx-22+osc,H-40,fx-6+osc,H-64);
    ctx.quadraticCurveTo(fx+14+osc,H-40,fx+26,H);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
  // progression
  var pct2=Math.min(1,dozo.x/window.__arrivee);
  ctx.fillStyle='rgba(12,16,12,.5)';
  ctx.beginPath();ctx.roundRect(W*0.14,9,W*0.72,7,4);ctx.fill();
  ctx.fillStyle='#F5C21B';
  ctx.beginPath();ctx.roundRect(W*0.14,9,W*0.72*pct2,7,4);ctx.fill();
}

function braconnier(x,y,dir,t){
  ctx.save();ctx.translate(x,y);ctx.scale(dir,1);
  var bal=Math.sin(t*0.14)*3;

  ctx.beginPath();ctx.moveTo(3,-18);ctx.lineTo(4+bal*0.5,-1);ctx.stroke();
  // bottes
  ctx.strokeStyle='#241c10';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-4-bal*0.5,-4);ctx.lineTo(-4-bal*0.5,-1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4+bal*0.5,-4);ctx.lineTo(4+bal*0.5,-1);ctx.stroke();
  // torse
  var g=ctx.createLinearGradient(-8,-40,8,-18);
  g.addColorStop(0,'#9a7a44');g.addColorStop(1,'#6a5228');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(-8,-40,16,22,4);ctx.fill();
  ctx.strokeStyle='rgba(25,18,8,.75)';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.roundRect(-8,-40,16,22,4);ctx.stroke();
  // gilet sombre pour le contraste
  ctx.fillStyle='#3a2e18';
  ctx.fillRect(-8,-34,5,16);ctx.fillRect(3,-34,5,16);
  // bras + arme
  ctx.strokeStyle='#5a4a30';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(5,-34);ctx.lineTo(17,-30);ctx.stroke();
  ctx.fillStyle='#2a2620';
  ctx.fillRect(14,-33,20,5);
  ctx.fillRect(28,-31,7,3);
  // tête
  ctx.fillStyle='#8d6533';
  ctx.beginPath();ctx.arc(0,-47,7.5,0,7);ctx.fill();
  ctx.strokeStyle='rgba(25,18,8,.7)';ctx.lineWidth=1.6;ctx.stroke();
  // bandana
  ctx.fillStyle='#a02818';
  ctx.beginPath();ctx.arc(0,-50,7.5,Math.PI,0);ctx.fill();
  ctx.fillRect(-8,-51,16,3.5);
  ctx.fillStyle='#12130F';

}
function fauve(x,y,dir,c1,c2,t,type){
  ctx.save();ctx.translate(x,y);ctx.scale(dir,1);
  var bond=Math.sin(t*0.2)*2;
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();ctx.ellipse(0,2,18,4,0,0,7);ctx.fill();
  var g=ctx.createRadialGradient(-5,-16,3,0,-12,24);
  g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(0,-13+bond,19,10,0,0,7);ctx.fill();
  // tête
  ctx.beginPath();ctx.arc(-17,-17+bond,8,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(-25,-15+bond,6,4.5,-0.15,0,7);ctx.fill();
  // oreilles
  ctx.fillStyle=c2;
  ctx.beginPath();ctx.ellipse(-17,-25+bond,3.5,5,-0.2,0,7);ctx.fill();
  // œil
  ctx.fillStyle=type==='panthere'?'#e8d040':'#ffe14a';
  ctx.beginPath();ctx.arc(-21,-18+bond,2.4,0,7);ctx.fill();
  // queue
  ctx.strokeStyle=c1;ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(17,-14+bond);ctx.quadraticCurveTo(28,-20,26,-30+bond);ctx.stroke();
  // pattes
  ctx.strokeStyle=c2;ctx.lineWidth=5;
  [[-9,-4],[6,-4],[14,-4]].forEach(function(p){
    ctx.beginPath();ctx.moveTo(p[0],p[1]+bond);ctx.lineTo(p[0]-2,0);ctx.stroke();
  });
  // taches de la hyène
  if(type==='hyene'){
    ctx.fillStyle='rgba(60,48,24,.55)';
    [[-4,-18],[4,-12],[10,-17]].forEach(function(s){
      ctx.beginPath();ctx.arc(s[0],s[1]+bond,2.6,0,7);ctx.fill();
    });
  }
  ctx.restore();
}
function buffle(x,y,dir,t){

  // tête

  ctx.beginPath();ctx.moveTo(-20,-31+sf);ctx.quadraticCurveTo(-26,-40,-16,-40+sf);ctx.stroke();
  // œil

  [[-13,-6],[8,-6],[18,-6]].forEach(function(p){
    ctx.beginPath();ctx.moveTo(p[0],p[1]+sf);ctx.lineTo(p[0]-2,0);ctx.stroke();

}
function dessinerBoss(){
  var bx=boss.x, by=boss.y;
  if(boss.invuln>0&&Math.floor(boss.invuln/4)%2===0)return;
  var dir=(dozo.x>bx)?1:-1;

  // cartouchières croisées

  ctx.fillStyle='#c8a850';
  for(var cb=0;cb<5;cb++){

  }
  // bras + gros fusil
  ctx.strokeStyle='#6a5230';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(9,-48*s);ctx.lineTo(26,-42*s);ctx.stroke();
  ctx.fillStyle='#22201a';
  ctx.fillRect(20,-46*s,34,7);
  ctx.fillRect(48,-44*s,10,4);
  // tête
  ctx.fillStyle='#7d5527';
  ctx.beginPath();ctx.arc(0,-64*s,10,0,7);ctx.fill();
  // chapeau
  ctx.fillStyle='#3a2c18';
  ctx.beginPath();ctx.ellipse(0,-70*s,18,5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.roundRect(-8,-80*s,16,12,3);ctx.fill();
  ctx.fillStyle='#a02818';
  ctx.fillRect(-8,-72*s,16,3.5);
  ctx.fillStyle='#12130F';

  var lw=76, lx=bx-lw/2, ly=by-boss.h-46;

  ctx.beginPath();ctx.roundRect(lx-2,ly-2,lw+4,11,5);ctx.fill();

  ctx.fillStyle='rgba(255,255,255,.9)';

}
function dessinerDozo(){
  var d=dozo;
  if(invincible>0&&Math.floor(invincible/6)%2===0)return;
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();ctx.ellipse(d.x,d.y+d.h*0.5+3,15,4,0,0,7);ctx.fill();
  // choisir la pose selon l'état
  var pose='REPOS';
  if(over){
    pose=gagne?'VICTOIRE':'TOMBE';
    if(!spriteOk(pose))pose='REPOS';
  } else
  if(invincible>60)pose='TOUCHE';           // vient d'être touché
  else if(!d.sol)pose='SAUT';               // en l'air
  else if(d.tirAnim>0)pose='TIR';           // vient de tirer
  else if(Math.abs(d.vx)>0.5)               // court : cycle à deux appuis
    pose=(Math.floor(d.anim)%2===0)?'COURSE1':'COURSE2';
  if(!spriteOk(pose))pose='REPOS';

  if(couche&&spriteOk('COUCHE'))pose='COUCHE';
  else if(couche)pose=spriteOk('TIR')?'TIR':'REPOS';
  if(spriteOk(pose)){
    ctx.save();
    ctx.translate(d.x,d.y);
    ctx.scale(d.regard,1);
    if(pose==='TOMBE'){
      // affalé : sprite légèrement basculé
      ctx.rotate(-0.12);
    }
    if(pose==='COUCHE'){
      // sprite dédié, déjà à l'horizontale
      var cw=d.h*1.62;
      var ch=cw*IMG.COUCHE.naturalHeight/IMG.COUCHE.naturalWidth;
      ctx.drawImage(IMG.COUCHE,-cw*0.42,d.h*0.5-ch*0.92,cw,ch);
    }else{
      var hh=d.h*1.42;
      var ww=hh*IMG[pose].naturalWidth/IMG[pose].naturalHeight;
      ctx.drawImage(IMG[pose],-ww*0.44,-hh*0.52,ww,hh);
    }
    ctx.restore();
    // éclair de tir
    if(d.tirAnim>0){
      ctx.save();
      ctx.translate(d.x+d.regard*20,d.y-6);
      ctx.globalAlpha=d.tirAnim/10;
      var gf=ctx.createRadialGradient(0,0,1,0,0,13);
      gf.addColorStop(0,'#fff4b0');gf.addColorStop(0.5,'#ffa02a');gf.addColorStop(1,'rgba(255,120,20,0)');
      ctx.fillStyle=gf;
      ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();
      ctx.restore();
    }
    return;
  }
  // repli vectoriel simple
  ctx.save();ctx.translate(d.x,d.y);ctx.scale(d.regard,1);
  ctx.fillStyle='#8a6a3a';
  ctx.beginPath();ctx.roundRect(-9,-22,18,30,5);ctx.fill();
  ctx.fillStyle='#7d5527';
  ctx.beginPath();ctx.arc(0,-30,8,0,7);ctx.fill();
  ctx.fillStyle='#5a4a28';
  ctx.beginPath();ctx.ellipse(0,-36,15,4,0,0,7);ctx.fill();
  ctx.fillStyle='#2a2620';
  ctx.fillRect(6,-18,24,5);
  ctx.restore();
}

function presser(el,set){
  el.addEventListener('touchstart',function(e){set(true);e.preventDefault();},{passive:false});
  el.addEventListener('touchend',function(e){set(false);e.preventDefault();},{passive:false});
  el.addEventListener('mousedown',function(){set(true);});
  window.addEventListener('mouseup',function(){set(false);});
}

presser($('bDroite'),function(v){droite=v;});
presser($('bTir'),function(v){tirEnCours=v;});
$('bSaut').addEventListener('touchstart',function(e){sautDemande=true;e.preventDefault();},{passive:false});
$('bSaut').addEventListener('mousedown',function(){sautDemande=true;});
function basculerCouche(){
  // on peut TOUJOURS se relever ; on ne peut se coucher qu'au sol
  if(!couche && !dozo.sol)return;
  couche=!couche;
  $('bCoucher').classList.toggle('actif',couche);
  $('msg').textContent=couche?'🛡️ Couché — tir rasant, tu esquives les balles hautes':'Debout !';
}
$('bCoucher').addEventListener('touchstart',function(e){basculerCouche();e.preventDefault();},{passive:false});
$('bCoucher').addEventListener('mousedown',function(){basculerCouche();});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')gauche=true;
  if(e.key==='ArrowRight')droite=true;
  if(e.key==='ArrowUp'){sautDemande=true;e.preventDefault();}
  if(e.key===' '){tirEnCours=true;e.preventDefault();}
  if(e.key==='ArrowDown'){basculerCouche();e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')gauche=false;
  if(e.key==='ArrowRight')droite=false;
  if(e.key===' ')tirEnCours=false;
});

    var e=ennemis.filter(function(x){return x.vivant;})[0];
    if(!e)return null;
    dozo.x=e.x-110; dozo.y=SOL-52; dozo.vy=0;
    cam=dozo.x-60;
    return {dozoX:Math.round(dozo.x), ennX:Math.round(e.x), ennY:Math.round(e.y),
            SOL:Math.round(SOL), type:e.type, cam:Math.round(cam)};
  },
  diag:function(){
    var e=ennemis.filter(function(x){return x.vivant;})[0];
    return {SOL:Math.round(SOL),
      dozoY:Math.round(dozo.y), dozoH:dozo.h, dozoBas:Math.round(dozo.y+dozo.h*0.5),
      ennY:e?Math.round(e.y):null, ennH:e?e.h:null, ennType:e?e.type:null,
      anim:+dozo.anim.toFixed(2), vx:+dozo.vx.toFixed(2)};
  },

  blesser:function(d){subirDegats(d,false);},
  progression:function(){return {niveau:nivIdx+1,total:NIVEAUX.length,zone:N().zone,nom:N().nom,
    maxDebloque:maxDeb+1,cumul:scoreCumul};}
};

var last=0;
function loop(now){
  var dt=Math.min(2.5,(now-last)/16.7);last=now;
  step(dt);draw();
  requestAnimationFrame(loop);
}
chargerSprites();
resize();reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
