<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Penalty Faso</title>
<style>
  :root{
    --vert:#0E7A3C; --vert-fonce:#0A5C2D; --rouge:#E32219; --or:#F5C21B;
    --nuit:#12130F; --craie:#FAF7EF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--nuit);
    font-family:"Arial Black","Segoe UI",Arial,sans-serif;
    color:var(--craie);
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  header{
    width:100%;max-width:430px;padding:12px 16px 8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{font-size:20px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:9px;letter-spacing:3px;color:#8b8f84;margin-top:3px;}
  .dots{display:flex;gap:6px;}
  .dot{width:14px;height:14px;border-radius:50%;background:#33362e;border:2px solid #4a4e42;transition:all .25s;}
  .dot.but{background:var(--or);border-color:var(--or);box-shadow:0 0 8px rgba(245,194,27,.6);}
  .dot.rate{background:var(--rouge);border-color:var(--rouge);}
  #msg{
    height:26px;font-size:15px;letter-spacing:.5px;text-align:center;
    color:var(--or);
  }
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;justify-content:center;}
  canvas{display:block;width:100%;height:100%;}
  #fin{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,19,15,.88);text-align:center;padding:24px;
  }
  #fin h2{font-size:30px;color:var(--or);margin-bottom:6px;}
  #fin p{font-family:Arial,sans-serif;font-size:14px;color:#c9ccc0;margin-bottom:20px;line-height:1.5;}
  #fin button{
    font-family:inherit;font-size:16px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:14px 34px;
  }
  #fin button:active{transform:scale(.96);}
  footer{
    width:100%;max-width:430px;padding:8px 16px 14px;text-align:center;
    font-family:Arial,sans-serif;font-size:11px;color:#6c7064;letter-spacing:.5px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">PENALTY <span>FASO</span><small>SÉANCE DE 5 TIRS</small></div>
  <div style="display:flex;align-items:center;gap:8px">
    <button id="btnSon" style="background:none;border:1px solid #57594f;color:var(--craie);border-radius:999px;width:32px;height:32px;font-size:14px">🔊</button>
    <div class="dots" id="dots"></div>
  </div>
</header>
<div id="msg">Glisse le ballon vers le but !</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="fin">
    <h2 id="finTitre"></h2>
    <p id="finTexte"></p>
    <button id="rejouer">REJOUER</button>
  </div>
</div>
<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>

<script>
(function(){
"use strict";
// ===== Kit sonore Faso Games (synthétisé, 0 Ko d'assets, silencieux par défaut respecté) =====
var SFX=(function(){
  var ctx,muet=false;
  try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
  function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
  function tone(freq,dur,type,vol,glide){
    if(muet)return;
    try{
      var c=ac();var o=c.createOscillator();var g=c.createGain();
      o.type=type||'sine';o.frequency.value=freq;
      if(glide)o.frequency.linearRampToValueAtTime(glide,c.currentTime+dur);
      g.gain.value=vol||0.15;
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+dur);
    }catch(e){}
  }
  return{
    tap:function(){tone(440,0.05,'square',0.08);},
    bon:function(){tone(523,0.09,'sine',0.14);setTimeout(function(){tone(784,0.12,'sine',0.14);},70);},
    mauvais:function(){tone(160,0.22,'sawtooth',0.12,90);},
    victoire:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'sine',0.15);},i*90);});},
    defaite:function(){[392,330,262].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'sine',0.12);},i*120);});},
    piece:function(){tone(988,0.08,'triangle',0.12,1400);},
    tick:function(){tone(300,0.03,'square',0.05);},
    estMuet:function(){return muet;},
    toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}
  };
})();
// Bouton mute (à placer dans le header de chaque jeu)
function initBoutonSon(id){
  var b=document.getElementById(id);
  if(!b)return;
  function maj(){b.textContent=SFX.estMuet()?'🔇':'🔊';}
  maj();
  b.addEventListener('click',function(){SFX.toggle();maj();});
}
// Confetti simple (petites particules colorées, pour les écrans de victoire)
function confetti(canvas,ctx,cx,cy){
  var parts=[];
  var couleurs=['#F5C21B','#E32219','#0E7A3C','#3d5a80','#FAF7EF'];
  for(var i=0;i<24;i++){
    var a=Math.random()*Math.PI*2,v=2+Math.random()*3;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:0.12,vie:1,col:couleurs[i%couleurs.length],taille:3+Math.random()*3});
  }
  return parts;
}
function drawConfetti(ctx,parts,dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=0.018*dt;
    if(p.vie<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.vie);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.taille/2,p.y-p.taille/2,p.taille,p.taille);
    ctx.globalAlpha=1;
  }
}
initBoutonSon("btnSon");

  cles.forEach(function(k){
    var im=new Image();
    im.onload=function(){if(++n===cles.length)texPretes=true;};
    im.onerror=function(){if(++n===cles.length)texPretes=true;};
    im.src=TEX[k];IMG[k]=im;
  });
})();
function texOk(k){return texPretes&&IMG[k]&&IMG[k].complete&&IMG[k].naturalWidth;}

// ===== Kit visuel Faso Games : profondeur, particules, impact =====
var VFX=(function(){
  var shake={t:0,force:0}, particules=[], flashes=[];
  function secousse(force,duree){shake.force=force;shake.t=duree||12;}
  function appliquerSecousse(ctx,dt){
    if(shake.t<=0)return false;
    shake.t-=dt;
    var f=shake.force*(shake.t/12);
    ctx.save();
    ctx.translate((Math.random()-0.5)*f,(Math.random()-0.5)*f);
    return true;
  }
  function particule(x,y,opts){
    opts=opts||{};
    var n=opts.n||12;
    for(var i=0;i<n;i++){
      var a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;
      var v=(opts.vitesse||3)*(0.5+Math.random());
      particules.push({
        x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
        g:opts.gravite!==undefined?opts.gravite:0.12,
        vie:1,decl:opts.decl||0.025,
        taille:(opts.taille||4)*(0.6+Math.random()*0.8),
        col:opts.col||'#F5C21B',
        forme:opts.forme||'rond'
      });
    }
  }
  function flash(col,duree){flashes.push({col:col||'#FFFFFF',vie:1,decl:1/(duree||10)});}
  function maj(ctx,dt,W,H){
    for(var i=particules.length-1;i>=0;i--){
      var p=particules[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=p.decl*dt;
      if(p.vie<=0){particules.splice(i,1);continue;}
      ctx.globalAlpha=Math.max(0,p.vie);
      ctx.fillStyle=p.col;
      if(p.forme==='carre'){ctx.fillRect(p.x-p.taille/2,p.y-p.taille/2,p.taille,p.taille);}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.taille*p.vie,0,7);ctx.fill();}
      ctx.globalAlpha=1;
    }
    for(var j=flashes.length-1;j>=0;j--){
      var f=flashes[j];
      f.vie-=f.decl*dt;
      if(f.vie<=0){flashes.splice(j,1);continue;}
      ctx.globalAlpha=f.vie*0.5;
      ctx.fillStyle=f.col;ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=1;
    }
  }
  function reset(){particules=[];flashes=[];shake.t=0;}
  return {secousse:secousse,appliquerSecousse:appliquerSecousse,particule:particule,flash:flash,maj:maj,reset:reset,
    nbParticules:function(){return particules.length;}};
})();
// Helpers de rendu enrichi
function ombrePortee(ctx,blur,coul,dx,dy){
  ctx.shadowBlur=blur;ctx.shadowColor=coul||'rgba(0,0,0,.5)';
  ctx.shadowOffsetX=dx||0;ctx.shadowOffsetY=dy||3;
}
function sansOmbre(ctx){ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}
function degradeVertical(ctx,x,y,w,h,c1,c2){
  var g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,c1);g.addColorStop(1,c2);return g;
}
function degradeRadial(ctx,x,y,r,c1,c2){
  var g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c1);g.addColorStop(1,c2);return g;
}

const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
const msg=document.getElementById('msg'), dotsEl=document.getElementById('dots');
const fin=document.getElementById('fin'), finTitre=document.getElementById('finTitre'),
      finTexte=document.getElementById('finTexte');
let W=0,H=0,DPR=1;
let confettiParts=[];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cvs.parentElement.getBoundingClientRect();
  W=r.width; H=r.height;
  cvs.width=W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize',resize);

// ---- Géométrie ----
let goal={}, ball={}, keeper={};
function layout(){
  const gw=Math.min(W*0.78,330), gh=gw*0.42;
  goal={x:(W-gw)/2, y:H*0.16, w:gw, h:gh};
  ball.home={x:W/2, y:H*0.82};
  resetShot();
}

// ---- État ----
let shots=[], shotIndex=0, phase='aim'; // aim | fly | done | over
let aim=null;      // {x,y} pendant le drag
let anim=null;

function buildDots(){
  dotsEl.innerHTML='';
  for(let i=0;i<5;i++){
    const d=document.createElement('div'); d.className='dot';
    if(shots[i]==='but') d.classList.add('but');
    if(shots[i]==='rate') d.classList.add('rate');
    dotsEl.appendChild(d);
  }
}

function resetShot(){
  ball.x=ball.home.x; ball.y=ball.home.y; ball.r=Math.max(14,W*0.045);
  keeper={x:goal.x+goal.w/2, y:goal.y+goal.h, dive:0, dir:0, up:0, pose:'ready'};
  aim=null; anim=null; phase='aim';
}

// ---- Rendu ----
let tempsGlobal=0;
function draw(){
  tempsGlobal+=0.016;
  ctx.clearRect(0,0,W,H);
  const secoue=VFX.appliquerSecousse(ctx,1);

  // --- Stade (illustration) ---
  if(texOk('STADE')){
    ctx.drawImage(IMG.STADE,0,0,W,goal.y+goal.h*0.92);
  }else{
    const sky=ctx.createLinearGradient(0,0,0,goal.y+goal.h);
    sky.addColorStop(0,'#0a1020'); sky.addColorStop(0.55,'#1b2a4a'); sky.addColorStop(1,'#3d5a80');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,goal.y+goal.h*0.9);
    for(let i=0;i<2;i++){
      const px=i===0?W*0.16:W*0.84, py=goal.y*0.22;
      const halo=degradeRadial(ctx,px,py,W*0.42,'rgba(255,246,214,.20)','rgba(255,246,214,0)');
      ctx.fillStyle=halo;
      ctx.beginPath();ctx.arc(px,py,W*0.42,0,7);ctx.fill();
      ombrePortee(ctx,14,'rgba(255,240,180,.85)',0,0);
      ctx.fillStyle='#FFF6D6';
      ctx.beginPath();ctx.roundRect(px-13,py-7,26,13,3);ctx.fill();
      sansOmbre(ctx);
      ctx.fillStyle='#2a2c24';
      ctx.fillRect(px-2,py+6,4,goal.y*0.18);
    }
    ctx.save();
    const zoneY=goal.y-14;
    for(let i=0;i<180;i++){
      const fx=(i*89)%W;
      const base=10+((i*61)%zoneY);
      const onde=Math.sin(tempsGlobal*2.2+i*0.35)*2.2;
      ctx.fillStyle=['#e3b23c','#c94f3d','#6aa06a','#d9d2c5','#8f6fb5'][i%5];
      ctx.globalAlpha=.30+Math.sin(tempsGlobal*1.6+i)*0.10;
      ctx.fillRect(fx,base+onde,3.5,3.5);
    }
    ctx.restore();
    ctx.fillStyle='rgba(10,14,22,.55)';
    ctx.fillRect(0,goal.y-16,W,7);
  }

  // --- Pelouse ---
  const gy=goal.y+goal.h*0.9;
  if(texOk('PELOUSE')){
    if(!patPelouse)patPelouse=ctx.createPattern(IMG.PELOUSE,'repeat');
    ctx.save();
    ctx.translate(0,gy);
    ctx.fillStyle=patPelouse;
    ctx.fillRect(0,0,W,H-gy);
    // assombrissement vers l'avant pour la profondeur
    const prof=ctx.createLinearGradient(0,0,0,H-gy);
    prof.addColorStop(0,'rgba(255,255,220,.14)');
    prof.addColorStop(1,'rgba(10,40,15,.32)');
    ctx.fillStyle=prof;ctx.fillRect(0,0,W,H-gy);
    ctx.restore();
  }else{
    const grass=ctx.createLinearGradient(0,gy,0,H);
    grass.addColorStop(0,'#0d6e37'); grass.addColorStop(0.45,'#128a44'); grass.addColorStop(1,'#0a5c2d');
    ctx.fillStyle=grass; ctx.fillRect(0,gy,W,H-gy);
    for(let i=0;i<7;i++){
      const t0=i/7, t1=(i+1)/7;
      const y0=gy+(H-gy)*t0*t0, y1=gy+(H-gy)*t1*t1;
      if(i%2===0){ctx.fillStyle='rgba(255,255,255,0.045)';ctx.fillRect(0,y0,W,y1-y0);}
    }
  }
  // halo lumineux central au sol
  const lum=degradeRadial(ctx,W/2,gy+20,W*0.5,'rgba(255,250,220,.12)','rgba(255,250,220,0)');
  ctx.fillStyle=lum;ctx.fillRect(0,gy-10,W,H-gy+10);

  // surface / point de penalty
  ctx.strokeStyle='rgba(250,247,239,.7)'; ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.ellipse(W/2, ball.home.y+ball.r+6, W*0.30, 12, 0, 0, Math.PI*2);
  ctx.stroke();
  ctx.fillStyle='rgba(250,247,239,.9)';
  ctx.beginPath();ctx.arc(W/2,ball.home.y+ball.r+6,3,0,7);ctx.fill();

  drawGoal();
  drawKeeper();
  if(aim && phase==='aim') drawAim();
  drawBall();

  VFX.maj(ctx,1,W,H);
  if(secoue)ctx.restore();
}

function drawGoal(){
  const g=goal;
  if(texOk('BUT')){
    // marge pour inclure poteaux et filet du sprite
    const mx=g.w*0.045, my=g.h*0.06;
    ctx.drawImage(IMG.BUT,g.x-mx,g.y-my,g.w+mx*2,g.h+my*2);
    return;
  }
  // repli dessiné
  ctx.fillStyle='rgba(6,10,18,.55)';
  ctx.fillRect(g.x,g.y,g.w,g.h);
  ctx.save();
  const step=g.w/16;
  for(let x=g.x;x<=g.x+g.w;x+=step){
    const d=1-Math.abs((x-(g.x+g.w/2))/(g.w/2));
    ctx.strokeStyle='rgba(250,247,239,'+(0.16+d*0.16)+')'; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,g.y);ctx.lineTo(x,g.y+g.h);ctx.stroke();
  }
  for(let y=g.y;y<=g.y+g.h;y+=g.h/7){
    const d=(y-g.y)/g.h;
    ctx.strokeStyle='rgba(250,247,239,'+(0.14+d*0.16)+')'; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(g.x,y);ctx.lineTo(g.x+g.w,y);ctx.stroke();
  }
  ctx.restore();
  ombrePortee(ctx,10,'rgba(0,0,0,.55)',2,4);
  ctx.strokeStyle='#FAF7EF'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(g.x,g.y+g.h); ctx.lineTo(g.x,g.y);
  ctx.lineTo(g.x+g.w,g.y); ctx.lineTo(g.x+g.w,g.y+g.h);
  ctx.stroke();
  sansOmbre(ctx);
}

function drawKeeper(){
  const k=keeper;
  const reachX=k.dir*(goal.w*0.34)*k.dive;
  const reachY=-k.up*(goal.h*0.45)*k.dive;
  const s=goal.h/42;
  // ombre au sol (s'étire pendant le plongeon)
  ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath();
  ctx.ellipse(k.x+reachX,k.y+4,16*s*(1+k.dive*0.5),5*s,0,0,7);
  ctx.fill();

  const enPlongeon = k.dive>0.25 && k.dir!==0;
  if(texOk('GARDIEN')&&texOk('PLONGEON')){
    ctx.save();
    ctx.translate(k.x+reachX, k.y+reachY);
    if(enPlongeon){
      // sprite de plongeon (le personnage plonge vers la droite dans l'image source)
      const gw=goal.w*0.50, gh=gw*IMG.PLONGEON.naturalHeight/IMG.PLONGEON.naturalWidth;
      if(k.dir<0){
        ctx.scale(-1,1);
        ctx.drawImage(IMG.PLONGEON,-gw*0.52,-gh*0.62,gw,gh);
      }else{
        ctx.drawImage(IMG.PLONGEON,-gw*0.48,-gh*0.62,gw,gh);
      }
    }else{
      const gw=goal.w*0.26, gh=gw*IMG.GARDIEN.naturalHeight/IMG.GARDIEN.naturalWidth;
      ctx.drawImage(IMG.GARDIEN,-gw/2,-gh*0.94,gw,gh);
    }
    ctx.restore();
    return;
  }

  // repli dessiné
  ctx.save();
  ctx.translate(k.x+reachX, k.y+reachY);
  ctx.rotate(k.dir*0.9*k.dive);
  ctx.strokeStyle='#0d0e0b'; ctx.lineWidth=4.2*s; ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-4*s,0);ctx.lineTo(-6*s,-14*s);ctx.moveTo(4*s,0);ctx.lineTo(6*s,-14*s);ctx.stroke();
  const maillot=ctx.createLinearGradient(-8*s,-32*s,8*s,-13*s);
  maillot.addColorStop(0,'#ff4436'); maillot.addColorStop(1,'#b81a12');
  ombrePortee(ctx,8,'rgba(0,0,0,.45)',0,3);
  ctx.fillStyle=maillot;
  ctx.beginPath();ctx.roundRect(-8*s,-32*s,16*s,19*s,4*s);ctx.fill();
  sansOmbre(ctx);
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.font='bold '+(8*s)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('1',0,-23*s);
  ctx.strokeStyle='#d92318'; ctx.lineWidth=4.5*s;
  ctx.beginPath();
  ctx.moveTo(-7*s,-29*s); ctx.lineTo(-16*s,-38*s);
  ctx.moveTo(7*s,-29*s);  ctx.lineTo(16*s,-38*s);
  ctx.stroke();
  ombrePortee(ctx,10,'rgba(245,194,27,.8)',0,0);
  const gant=degradeRadial(ctx,0,0,3.5*s,'#FFE27A','#F5C21B');
  ctx.fillStyle=gant;
  ctx.beginPath();ctx.arc(-16*s,-38*s,3.4*s,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(16*s,-38*s,3.4*s,0,7);ctx.fill();
  sansOmbre(ctx);
  const tete=degradeRadial(ctx,-1.5*s,-40*s,6*s,'#a8703f','#6e4525');
  ctx.fillStyle=tete;
  ctx.beginPath();ctx.arc(0,-38*s,5.5*s,0,7);ctx.fill();
  ctx.restore();
}

function drawAim(){
  ctx.save();
  ctx.setLineDash([6,7]);
  ctx.strokeStyle='rgba(245,194,27,.8)'; ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(aim.x,aim.y);ctx.stroke();
  ctx.setLineDash([]);
  // viseur
  ctx.strokeStyle='#F5C21B'; ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(aim.x,aim.y,14,0,7);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(aim.x-20,aim.y);ctx.lineTo(aim.x-8,aim.y);
  ctx.moveTo(aim.x+8,aim.y);ctx.lineTo(aim.x+20,aim.y);
  ctx.moveTo(aim.x,aim.y-20);ctx.lineTo(aim.x,aim.y-8);
  ctx.moveTo(aim.x,aim.y+8);ctx.lineTo(aim.x,aim.y+20);
  ctx.stroke();
  ctx.restore();
}

function drawBall(){
  ctx.save();
  ctx.translate(ball.x,ball.y);
  // ombre
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath();ctx.ellipse(0,ball.r*0.85,ball.r*0.9,ball.r*0.3,0,0,7);ctx.fill();
  // ballon
  ctx.fillStyle='#FAF7EF';
  ctx.beginPath();ctx.arc(0,0,ball.r,0,7);ctx.fill();
  ctx.strokeStyle='#c9c4b6';ctx.lineWidth=1.5;ctx.stroke();
  // motifs
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.arc(0,0,ball.r*0.34,0,7);ctx.fill();
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5 + (ball.spin||0);
    ctx.beginPath();
    ctx.arc(Math.cos(a)*ball.r*0.72, Math.sin(a)*ball.r*0.72, ball.r*0.17,0,7);
    ctx.fill();
  }
  ctx.restore();
}

// ---- Tir ----
function shoot(tx,ty){
  phase='fly';
  // cible clampée autour du but (on peut tirer à côté !)
  tx=Math.max(goal.x-40,Math.min(goal.x+goal.w+40,tx));
  ty=Math.max(goal.y-36,Math.min(goal.y+goal.h-6,ty));
  // décision du gardien : plonge vers une des 3 colonnes, bas ou haut
  const dirs=[-1,0,1];
  keeper.dir=dirs[Math.floor(Math.random()*3)];
  keeper.up=Math.random()<0.45?1:0.35;
  const start={x:ball.x,y:ball.y,r:ball.r};
  const dur=520, t0=performance.now();
  anim=function(now){
    const t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,3);
    ball.x=start.x+(tx-start.x)*e;
    ball.y=start.y+(ty-start.y)*e - Math.sin(t*Math.PI)*H*0.06;
    ball.r=start.r*(1-0.55*e);
    ball.spin=(ball.spin||0)+0.25;
    keeper.dive=Math.min(1,t*1.5);
    if(t>=1){anim=null;resolve(tx,ty);}
  };
}

function resolve(tx,ty){
  const inGoal = tx>goal.x+8 && tx<goal.x+goal.w-8 && ty>goal.y+8;
  let saved=false;
  if(inGoal){
    const kx=keeper.x+keeper.dir*(goal.w*0.34);
    const ky=keeper.y-28-keeper.up*(goal.h*0.45);
    const reach=goal.w*0.17 + (keeper.dir===0?goal.w*0.05:0);
    saved = Math.abs(tx-kx)<reach && Math.abs(ty-ky)<goal.h*0.42;
  }
  const but=inGoal&&!saved;
  shots[shotIndex]=but?'but':'rate';
  shotIndex++;
  buildDots();
  msg.textContent = but ? "⚽ BUUUT !" : (inGoal ? "🧤 Arrêt du gardien !" : "😬 À côté !");
  if(but){
    SFX.bon();
    VFX.secousse(9,14);
    VFX.flash('#F5C21B',14);
    // explosion de particules dorées dans le filet
    VFX.particule(ball.x,ball.y,{n:26,vitesse:5.5,taille:5,col:'#F5C21B',gravite:0.16,decl:0.020});
    VFX.particule(ball.x,ball.y,{n:14,vitesse:4,taille:4,col:'#FAF7EF',gravite:0.13,decl:0.024});
  }else if(inGoal){
    SFX.mauvais();
    VFX.secousse(6,10);
    // éclat au niveau des gants du gardien
    var gx=keeper.x+keeper.dir*(goal.w*0.34), gy=keeper.y-28-keeper.up*(goal.h*0.45);
    VFX.particule(gx,gy,{n:16,vitesse:4,taille:4,col:'#E32219',gravite:0.15,decl:0.026});
  }else{
    SFX.mauvais();
    VFX.secousse(3,8);
    VFX.particule(ball.x,ball.y,{n:10,vitesse:3,taille:3.5,col:'#8b8f84',gravite:0.2,decl:0.03});
  }
  phase='done';
  setTimeout(()=>{
    if(shotIndex>=5) finish();
    else{resetShot();msg.textContent="Tir "+(shotIndex+1)+" sur 5 — vise bien !";}
  },1000);
}

function finish(){
  phase='over';
  const n=shots.filter(s=>s==='but').length;
  finTitre.textContent = n+" / 5";
  finTexte.textContent = n>=4 ? "Digne des Étalons ! Reviens demain défendre ton rang au classement."
                    : n>=2 ? "Pas mal ! Encore un peu d'entraînement et le podium est à toi."
                    : "Le gardien était en feu... Rejoue et prends ta revanche !";
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Penalty',score:n*95,victoire:n>=4},'*');}catch(e){}}
  if(n>=4){
    SFX.victoire();confettiParts=confetti(cvs,ctx,W/2,H*0.35);
    setTimeout(()=>{fin.style.display='flex';},650);
  }else{
    if(n<=1)SFX.defaite();else SFX.tap();
    fin.style.display='flex';
  }
}

document.getElementById('rejouer').addEventListener('click',()=>{
  shots=[];shotIndex=0;buildDots();fin.style.display='none';confettiParts=[];VFX.reset();
  resetShot();msg.textContent="Glisse le ballon vers le but !";
});

// ---- Entrées tactiles & souris ----
let dragging=false;
function pos(e){
  const r=cvs.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return {x:p.clientX-r.left,y:p.clientY-r.top};
}
function down(e){
  if(phase!=='aim')return;
  dragging=true;aim=pos(e);e.preventDefault();
}
function move(e){
  if(!dragging||phase!=='aim')return;
  aim=pos(e);e.preventDefault();
}
function up(e){
  if(!dragging||phase!=='aim'){dragging=false;return;}
  dragging=false;
  if(aim && (ball.y-aim.y)>40){shoot(aim.x,aim.y);}
  aim=null;e.preventDefault();
}
// hook de test
window.__penalty={state:()=>({phase,shotIndex,shots:shots.slice(),confettiN:confettiParts.length,muet:SFX.estMuet(),kdir:keeper.dir,kdive:keeper.dive}),
  tirerCoin:()=>{if(phase==='aim')shoot(goal.x+18,goal.y+goal.h-16);}};

cvs.addEventListener('touchstart',down,{passive:false});
cvs.addEventListener('touchmove',move,{passive:false});
cvs.addEventListener('touchend',up,{passive:false});
cvs.addEventListener('mousedown',down);
cvs.addEventListener('mousemove',move);
cvs.addEventListener('mouseup',up);

// ---- Boucle ----
let lastT=0;
function loop(now){
  if(anim)anim(now);
  draw();
  const dt=lastT?Math.min(2.5,(now-lastT)/16.7):1;lastT=now;
  if(confettiParts.length){drawConfetti(ctx,confettiParts,dt);}
  requestAnimationFrame(loop);
}
shots=[];buildDots();resize();
requestAnimationFrame(loop);
})();
