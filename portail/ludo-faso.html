<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ludo Faso</title>
<style>
  :root{
    --vert:#0E7A3C; --vert-fonce:#0A5C2D; --rouge:#E32219; --or:#F5C21B;
    --nuit:#12130F; --craie:#FAF7EF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--nuit);
    font-family:"Arial Black","Segoe UI",Arial,sans-serif;
    color:var(--craie);
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  header{
    width:100%;max-width:430px;padding:12px 16px 8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{font-size:20px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:9px;letter-spacing:3px;color:#8b8f84;margin-top:3px;}
  .marque{display:flex;align-items:center;gap:8px;font-size:22px;}
  .marque .toi{color:var(--or);}
  .marque .sep{color:#57594f;font-size:16px;}
  .marque .ia{color:#c9ccc0;}
  #msg{height:26px;font-size:14px;letter-spacing:.5px;text-align:center;color:var(--or);}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;justify-content:center;padding:0 12px 4px;}
  canvas{display:block;border-radius:14px;}
  #fin{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,19,15,.88);text-align:center;padding:24px;border-radius:14px;
  }
  #fin h2{font-size:30px;color:var(--or);margin-bottom:6px;}
  #fin p{font-family:Arial,sans-serif;font-size:14px;color:#c9ccc0;margin-bottom:20px;line-height:1.5;}
  #fin button{
    font-family:inherit;font-size:16px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:14px 34px;
  }
  #fin button:active{transform:scale(.96);}
  footer{
    width:100%;max-width:430px;padding:8px 16px 14px;text-align:center;
    font-family:Arial,sans-serif;font-size:11px;color:#6c7064;letter-spacing:.5px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">LUDO <span>FASO</span><small>4 PIONS À LA MAISON</small></div>
  <div style="display:flex;align-items:center;gap:0"><button id="btnSon" style="background:none;border:1px solid #57594f;color:var(--craie);border-radius:999px;width:32px;height:32px;font-size:14px;margin-right:8px">🔊</button>
<div class="marque"><span class="toi" id="sToi">0</span><span class="sep">—</span><span class="ia" id="sIa">0</span></div>
</div>
</header>
<div id="msg">Touche le dé pour lancer 🎲</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="fin">
    <h2 id="finTitre"></h2>
    <p id="finTexte"></p>
    <button id="rejouer">REJOUER</button>
  </div>
</div>
<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>

<script>
(function(){
"use strict";
// ===== Kit sonore Faso Games (synthétisé, 0 Ko d'assets, silencieux par défaut respecté) =====
var SFX=(function(){
  var ctx,muet=false;
  try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
  function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
  function tone(freq,dur,type,vol,glide){
    if(muet)return;
    try{
      var c=ac();var o=c.createOscillator();var g=c.createGain();
      o.type=type||'sine';o.frequency.value=freq;
      if(glide)o.frequency.linearRampToValueAtTime(glide,c.currentTime+dur);
      g.gain.value=vol||0.15;
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+dur);
    }catch(e){}
  }
  return{
    tap:function(){tone(440,0.05,'square',0.08);},
    bon:function(){tone(523,0.09,'sine',0.14);setTimeout(function(){tone(784,0.12,'sine',0.14);},70);},
    mauvais:function(){tone(160,0.22,'sawtooth',0.12,90);},
    victoire:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'sine',0.15);},i*90);});},
    defaite:function(){[392,330,262].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'sine',0.12);},i*120);});},
    piece:function(){tone(988,0.08,'triangle',0.12,1400);},
    tick:function(){tone(300,0.03,'square',0.05);},
    estMuet:function(){return muet;},
    toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}
  };
})();
// Bouton mute (à placer dans le header de chaque jeu)
function initBoutonSon(id){
  var b=document.getElementById(id);
  if(!b)return;
  function maj(){b.textContent=SFX.estMuet()?'🔇':'🔊';}
  maj();
  b.addEventListener('click',function(){SFX.toggle();maj();});
}
// Confetti simple (petites particules colorées, pour les écrans de victoire)
function confetti(canvas,ctx,cx,cy){
  var parts=[];
  var couleurs=['#F5C21B','#E32219','#0E7A3C','#3d5a80','#FAF7EF'];
  for(var i=0;i<24;i++){
    var a=Math.random()*Math.PI*2,v=2+Math.random()*3;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:0.12,vie:1,col:couleurs[i%couleurs.length],taille:3+Math.random()*3});
  }
  return parts;
}
function drawConfetti(ctx,parts,dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=0.018*dt;
    if(p.vie<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.vie);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.taille/2,p.y-p.taille/2,p.taille,p.taille);
    ctx.globalAlpha=1;
  }
}
initBoutonSon("btnSon");

  [[7,1],[7,2],[7,3],[7,4],[7,5]],      // vert
];
const FINISH=56; // 0..50 piste, 51..55 colonne, 56 centre

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cvs.parentElement.getBoundingClientRect();
  W=r.width-24; H=r.height-8;
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  cvs.width=W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(W-4, H-92); cell=S/15;
  ox=(W-S)/2; oy=6;
  dieBox={w:64,h:64}; dieBox.x=W/2-32; dieBox.y=oy+S+12;
}
window.addEventListener('resize',resize);

// ---- État ----
// pions[seat][i] : -1 = base ; 0..50 piste (relatif) ; 51..55 colonne ; 56 arrivé
let pions, turn, phase, dice, movable, anim=null, rolling=0, flash=[], flashT=0;

function reset(){
  pions=SEATS.map(()=>[-1,-1,-1,-1]);
  turn=0; phase='roll'; dice=0; movable=[]; anim=null; flash=[];
  updateScores();
  msg.textContent="Touche le dé pour lancer 🎲";
}

function updateScores(){
  const home=pions.map(ps=>ps.filter(p=>p===FINISH).length);
  sToi.textContent=home[0];
  sIa.textContent=Math.max(home[1],home[2],home[3]);
  return home;
}

// ---- Géométrie ----
function absCell(seat, pos){
  if(pos>=0&&pos<=50) return TRACK[(SEATS[seat].start+pos)%52];
  if(pos>=51&&pos<=55) return COLS[seat][pos-51];
  return [7,7];
}
function basePos(seat,i){
  const [bc,br]=SEATS[seat].base;
  const off=[[1.5,1.5],[3.5,1.5],[1.5,3.5],[3.5,3.5]][i];
  return {x:ox+(bc+off[0]+0.5)*cell, y:oy+(br+off[1]+0.5)*cell};
}
function pionXY(seat,i){
  const p=pions[seat][i];
  if(anim&&anim.seat===seat&&anim.i===i) return anim.xy;
  if(p===-1) return basePos(seat,i);
  const [c,r]=absCell(seat,p);
  // décaler les pions qui partagent une case
  let idx=0,tot=0;
  for(let s2=0;s2<4;s2++)for(let j=0;j<4;j++){
    if(pions[s2][j]===undefined)continue;
    const q=pions[s2][j];
    if(q<0||q===FINISH)continue;
    const [c2,r2]=absCell(s2,q);
    if(c2===c&&r2===r){
      if(s2===seat&&j===i)idx=tot;
      tot++;
    }
  }
  const a=tot>1? (idx/tot)*Math.PI*2 : 0;
  const rr=tot>1? cell*0.18 : 0;
  return {x:ox+(c+0.5)*cell+Math.cos(a)*rr, y:oy+(r+0.5)*cell+Math.sin(a)*rr};
}

// ---- Règles ----
function legalFor(seat, d){
  const out=[];
  for(let i=0;i<4;i++){
    const p=pions[seat][i];
    if(p===FINISH)continue;
    if(p===-1){
      if(d===6)out.push({i, to:0});
      continue;
    }
    const to=p+d;
    if(to>FINISH)continue; // dé exact requis
    out.push({i, to});
  }
  return out;
}

function occupants(absC,absR,exceptSeat){
  const found=[];
  for(let s=0;s<4;s++)for(let j=0;j<4;j++){
    const q=pions[s][j];
    if(q<0||q>50)continue;
    const [c,r]=absCell(s,q);
    if(c===absC&&r===absR)found.push({seat:s,i:j});
  }
  return found;
}

function resolveLanding(seat, to){
  if(to>50)return null; // colonne = privée
  const abs=(SEATS[seat].start+to)%52;
  if(SAFE.has(abs))return null;
  const [c,r]=absCell(seat,to);
  const occ=occupants(c,r).filter(o=>o.seat!==seat);
  if(occ.length===1)return occ[0]; // capture d'un pion isolé
  return null; // vide, ou groupe imprenable
}

// ---- Déroulé ----
function rollDie(){
  if(phase!=='roll'||anim)return;
  rolling=14;
  phase='rolling';
  const tick=()=>{
    dice=1+Math.floor(Math.random()*6);
    rolling--;
    if(rolling>0)setTimeout(tick,45);
    else afterRoll();
  };
  tick();
}

function afterRoll(){
  movable=legalFor(turn,dice);
  if(movable.length===0){
    msg.textContent=(turn===0?"Pas de coup possible...":SEATS[turn].nom+" passe...");
    setTimeout(()=>nextTurn(false),800);
    return;
  }
  if(turn===0){
    if(movable.length===1){ // un seul coup : on le joue direct
      playMove(0,movable[0]);
    }else{
      phase='select';
      msg.textContent="Choisis le pion à avancer ("+dice+")";
    }
  }else{
    phase='ai';
    setTimeout(()=>playMove(turn, aiChoose(turn)),500);
  }
}

function aiChoose(seat){
  let best=-Infinity, choice=movable[0];
  for(const m of movable){
    let sc=Math.random();
    if(m.to===FINISH)sc+=100;
    const cap=resolveLanding(seat,m.to);
    if(cap)sc+=50 + (pions[cap.seat][cap.i])*0.3;
    if(pions[seat][m.i]===-1)sc+=18;
    if(m.to<=50){
      const abs=(SEATS[seat].start+m.to)%52;
      if(SAFE.has(abs))sc+=8;
      // danger : un ennemi à 1-6 cases derrière la destination ?
      for(let s2=0;s2<4;s2++){
        if(s2===seat)continue;
        for(let j=0;j<4;j++){
          const q=pions[s2][j];
          if(q<0||q>50)continue;
          const abs2=(SEATS[s2].start+q)%52;
          const d=(abs-abs2+52)%52;
          if(d>=1&&d<=6&&!SAFE.has(abs))sc-=7;
        }
      }
      sc+=m.to*0.15; // faire avancer les pions déjà engagés
    }else{
      sc+=12+m.to*0.2; // sécuriser dans la colonne
    }
    if(sc>best){best=sc;choice=m;}
  }
  return choice;
}

function playMove(seat, m){
  phase='anim';
  const from=pions[seat][m.i];
  const steps=[];
  if(from===-1){
    steps.push(0);
  }else{
    for(let p=from+1;p<=m.to;p++)steps.push(p);
  }
  let k=0, timer=0;
  const startXY=pionXY(seat,m.i);
  anim={seat, i:m.i, xy:{...startXY},
    step(dt){
      timer-=dt;
      if(timer<=0){
        if(k<steps.length){
          pions[seat][m.i]=steps[k];
          const [c,r]= steps[k]===FINISH ? [7,7] : absCell(seat,steps[k]);
          this.xy={x:ox+(c+0.5)*cell, y:oy+(r+0.5)*cell};
          k++;
          timer=6.5; // ~110 ms par case
        }else{
          anim=null;
          landed(seat,m);
        }
      }
    }};
}

function landed(seat,m){
  let extra=(dice===6);
  const cap=resolveLanding(seat,m.to);
  if(cap){
    pions[cap.seat][cap.i]=-1;
    const [c,r]=absCell(seat,m.to);
    flash=[[c,r]];flashT=24;
    msg.textContent= seat===0 ? "💥 Tu renvoies un pion "+SEATS[cap.seat].nom+" à sa base !"
      : cap.seat===0 ? "😤 "+SEATS[seat].nom+" renvoie ton pion à la base !"
      : SEATS[seat].nom+" capture "+SEATS[cap.seat].nom+" !";
    if(seat===0)SFX.bon();else if(cap.seat===0)SFX.mauvais();
  }else if(m.to===FINISH){
    msg.textContent= seat===0 ? "🏠 Pion à la maison !" : SEATS[seat].nom+" rentre un pion...";
    if(seat===0)SFX.tap();
  }
  const home=updateScores();
  if(home[seat]===4)return endGame(seat);
  setTimeout(()=>nextTurn(extra),cap||m.to===FINISH?700:250);
}

function nextTurn(extra){
  if(!extra)turn=(turn+1)%4;
  dice=0;movable=[];
  if(turn===0){
    phase='roll';
    msg.textContent=extra?"🎲 Un 6 : tu rejoues !":"À toi ! Touche le dé";
  }else{
    phase='rolling';
    if(!extra)msg.textContent="Tour de "+SEATS[turn].nom+"...";
    setTimeout(rollAI,500);
  }
}
function rollAI(){
  rolling=8;
  const tick=()=>{
    dice=1+Math.floor(Math.random()*6);
    rolling--;
    if(rolling>0)setTimeout(tick,45);
    else afterRoll();
  };
  tick();
}

function endGame(seat){
  phase='over';
  const home=updateScores();
  finTitre.textContent= seat===0 ? "🏆 VICTOIRE" : SEATS[seat].nom+" GAGNE";
  finTexte.textContent = seat===0
    ? "Tes 4 pions sont à la maison ! Le classement hebdo t'attend."
    : "Tu avais "+home[0]+" pion"+(home[0]>1?"s":"")+" rentré"+(home[0]>1?"s":"")+". La revanche se joue tout de suite !";
  if(seat===0){SFX.victoire();confettiParts=confetti(cvs,ctx,W/2,H*0.4);}else{SFX.defaite();}
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Ludo',score:(seat===0?500:120),victoire:seat===0},'*');}catch(e){}}
  fin.style.display='flex';
}

document.getElementById('rejouer').addEventListener('click',()=>{
  fin.style.display='none';confettiParts=[];reset();
});

// ---- Rendu ----
function draw(dt){
  if(anim)anim.step(dt);
  if(flashT>0)flashT-=dt;

  // --- Fond : table à motifs africains ---
  // fond bois sombre (la table fournie contient déjà un plateau, on n'utilise que sa bordure)
  var fg=ctx.createLinearGradient(0,0,W,H);
  fg.addColorStop(0,'#3b2412');fg.addColorStop(0.5,'#2a1a0c');fg.addColorStop(1,'#1a1008');
  ctx.fillStyle=fg;ctx.fillRect(0,0,W,H);
  if(texOk('TABLE')){
    // bandeau décoratif prélevé sur les bords de la table (motifs africains)
    ctx.save();
    ctx.globalAlpha=0.55;
    var sw=IMG.TABLE.naturalWidth, sh=IMG.TABLE.naturalHeight;
    ctx.drawImage(IMG.TABLE,0,0,sw,sh*0.11,0,0,W,H*0.055);
    ctx.drawImage(IMG.TABLE,0,sh*0.89,sw,sh*0.11,0,H*0.945,W,H*0.055);
    ctx.restore();
  }

  // --- Plateau illustré ---
  if(false){ // illustration du plateau désactivée : grille non alignée sur la logique de jeu
    ctx.fillStyle='rgba(20,10,2,.45)';
    ctx.beginPath();ctx.roundRect(ox-5,oy-3,S+12,S+14,10);ctx.fill();
    ctx.drawImage(IMG.PLATEAU,ox,oy,S,S);
  }else{
    ctx.fillStyle='#FAF7EF';
    ctx.beginPath();ctx.roundRect(ox-3,oy-3,S+6,S+6,10);ctx.fill();
    for(let s=0;s<4;s++){
      const [bc,br]=SEATS[s].base;
      ctx.fillStyle=SEATS[s].col;
      ctx.fillRect(ox+bc*cell,oy+br*cell,6*cell,6*cell);
      ctx.fillStyle='#FAF7EF';
      ctx.beginPath();ctx.roundRect(ox+(bc+1)*cell,oy+(br+1)*cell,4*cell,4*cell,8);ctx.fill();
      for(let i=0;i<4;i++){
        const bp=basePos(s,i);
        ctx.fillStyle='rgba(0,0,0,.08)';
        ctx.beginPath();ctx.arc(bp.x,bp.y,cell*0.42,0,7);ctx.fill();
      }
    }
    for(let k=0;k<52;k++){
      const [c2,r2]=TRACK[k];
      ctx.strokeStyle='rgba(18,19,15,.25)';ctx.lineWidth=1;
      ctx.strokeRect(ox+c2*cell,oy+r2*cell,cell,cell);
      for(let s=0;s<4;s++){
        if(SEATS[s].start===k){
          ctx.fillStyle=SEATS[s].col;
          ctx.fillRect(ox+c2*cell,oy+r2*cell,cell,cell);
        }
      }
      if(SAFE.has(k)&&![0,13,26,39].includes(k)){
        ctx.fillStyle='rgba(18,19,15,.6)';
        ctx.font=Math.round(cell*0.6)+'px Arial';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('★',ox+(c2+0.5)*cell,oy+(r2+0.53)*cell);
      }
    }
    for(let s=0;s<4;s++){
      for(const [c2,r2] of COLS[s]){
        ctx.fillStyle=SEATS[s].col;
        ctx.fillRect(ox+c2*cell,oy+r2*cell,cell,cell);
        ctx.strokeStyle='rgba(255,255,255,.35)';
        ctx.strokeRect(ox+c2*cell,oy+r2*cell,cell,cell);
      }
    }
    const cx=ox+7.5*cell, cy=oy+7.5*cell, h=1.5*cell;
    const tris=[
      {pts:[[cx+h,cy-h],[cx+h,cy+h]],col:SEATS[0].col},
      {pts:[[cx-h,cy+h],[cx+h,cy+h]],col:SEATS[1].col},
      {pts:[[cx-h,cy-h],[cx-h,cy+h]],col:SEATS[2].col},
      {pts:[[cx-h,cy-h],[cx+h,cy-h]],col:SEATS[3].col},
    ];
    for(const t of tris){
      ctx.fillStyle=t.col;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(t.pts[0][0],t.pts[0][1]);
      ctx.lineTo(t.pts[1][0],t.pts[1][1]);
      ctx.closePath();ctx.fill();
    }
  }

  // flash de capture
  if(flashT>0&&Math.floor(flashT/4)%2===0){
    for(const [c,r] of flash){
      ctx.fillStyle='rgba(227,34,25,.55)';
      ctx.fillRect(ox+c*cell,oy+r*cell,cell,cell);
    }
  }

  // pions (les jouables du joueur en dernier pour rester dessus)
  const selectables = (phase==='select'&&turn===0) ? movable.map(m=>m.i) : [];
  for(let s=3;s>=0;s--)for(let i=0;i<4;i++){
    if(pions[s][i]===FINISH&&!(anim&&anim.seat===s&&anim.i===i))continue;
    drawPion(s,i, s===0&&selectables.includes(i));
  }

  drawDie();
}

function drawPion(s,i,hl){
  const {x,y}=pionXY(s,i);
  const R=cell*0.40;
  const cles=['PION_B','PION_R','PION_V','PION_J'];
  const cle=cles[s]||'PION_R';
  // ombre portée
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath();ctx.ellipse(x+1.5,y+R*0.55,R*0.95,R*0.5,0,0,7);ctx.fill();
  if(texOk(cle)){
    const d=R*2.35;
    ctx.drawImage(IMG[cle],x-d/2,y-d/2,d,d);
  }else{
    ctx.fillStyle=SEATS[s].col;
    ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();
    ctx.strokeStyle=SEATS[s].dark;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath();ctx.arc(x-R*0.28,y-R*0.28,R*0.30,0,7);ctx.fill();
  }
  // halo de sélection
  if(hl){
    ctx.strokeStyle='#F5C21B';ctx.lineWidth=3;
    ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.arc(x,y,R*1.35,0,7);ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawDie(){
  const {x,y,w,h}=dieBox;
  // indicateur de tour
  ctx.fillStyle=SEATS[turn].col;
  ctx.beginPath();ctx.arc(x-26,y+h/2,9,0,7);ctx.fill();
  ctx.fillStyle='#8b8f84';
  ctx.font='bold 11px Arial';ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.fillText(turn===0?'À TOI':SEATS[turn].nom, x-42, y+h/2);

  const actif=(phase==='roll'&&turn===0);
  const d=dice||6;
  if(texOk('DE')){
    if(actif){
      ctx.save();
      ctx.shadowBlur=12;ctx.shadowColor='rgba(245,194,27,.9)';
      ctx.drawImage(IMG.DE,x,y,w,h);
      ctx.restore();
    }else{
      ctx.globalAlpha=0.75;
      ctx.drawImage(IMG.DE,x,y,w,h);
      ctx.globalAlpha=1;
    }
    // masquer les 6 points du sprite et redessiner la vraie valeur
    if(d!==6){
      ctx.fillStyle='rgba(252,252,250,.97)';
      ctx.beginPath();ctx.roundRect(x+w*0.10,y+h*0.10,w*0.80,h*0.80,w*0.10);ctx.fill();
      const pip2=(fx,fy)=>{
        ctx.fillStyle='#1a1a18';
        ctx.beginPath();ctx.arc(x+w*fx,y+h*fy,w*0.085,0,7);ctx.fill();
      };
      if(d===1||d===3||d===5)pip2(0.5,0.5);
      if(d>=2){pip2(0.29,0.29);pip2(0.71,0.71);}
      if(d>=4){pip2(0.71,0.29);pip2(0.29,0.71);}
    }
  }else{
    ctx.fillStyle=actif?'#F5C21B':'#2a2c24';
    ctx.beginPath();ctx.roundRect(x,y,w,h,14);ctx.fill();
    if(actif){ctx.strokeStyle='rgba(250,247,239,.7)';ctx.lineWidth=2;ctx.stroke();}
    const pip=actif?'#12130F':'#FAF7EF';
    const px=(fx,fy)=>{
      ctx.fillStyle=pip;
      ctx.beginPath();ctx.arc(x+w*fx,y+h*fy,4.6,0,7);ctx.fill();
    };
    if(d===1||d===3||d===5)px(0.5,0.5);
    if(d>=2){px(0.27,0.27);px(0.73,0.73);}
    if(d>=4){px(0.73,0.27);px(0.27,0.73);}
    if(d===6){px(0.27,0.5);px(0.73,0.5);}
  }
  if(actif&&!dice){
    ctx.fillStyle='rgba(245,194,27,.8)';
    ctx.font='10px Arial';ctx.textAlign='center';
    ctx.fillText('TOUCHE-MOI',x+w/2,y+h+12);
  }
}

// ---- Entrées ----
function tap(clientX,clientY){
  const rct=cvs.getBoundingClientRect();
  const x=clientX-rct.left, y=clientY-rct.top;
  if(phase==='roll'&&turn===0&&
     x>dieBox.x-14&&x<dieBox.x+dieBox.w+14&&y>dieBox.y-14&&y<dieBox.y+dieBox.h+14){
    rollDie();return;
  }
  if(phase==='select'&&turn===0){
    for(const m of movable){
      const P=pionXY(0,m.i);
      if(Math.hypot(x-P.x,y-P.y)<cell*0.55){
        playMove(0,m);return;
      }
    }
  }
}
cvs.addEventListener('touchstart',e=>{tap(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();},{passive:false});
cvs.addEventListener('mousedown',e=>{tap(e.clientX,e.clientY);});

// hook de test/debug (sans effet en usage normal)
window.__ludo={
  state:()=>({turn,phase,dice,pions:JSON.parse(JSON.stringify(pions)),confettiN:confettiParts.length,muet:SFX.estMuet()}),
  roll:rollDie,
  pick:(k)=>{if(phase==='select'&&movable[k])playMove(0,movable[k]);},
  forcerVictoire:()=>endGame(0)
};

// ---- Boucle ----
let last=0;
function loop(now){
  const dt=Math.min(2.5,(now-last)/16.7); last=now;
  draw(dt);
  if(confettiParts.length)drawConfetti(ctx,confettiParts,dt);
  requestAnimationFrame(loop);
}
resize();reset();
requestAnimationFrame(loop);
})();
</script>
