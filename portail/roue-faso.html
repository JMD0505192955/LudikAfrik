<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Roue Faso</title>
<style>
  :root{--vert:#0E7A3C;--rouge:#E32219;--or:#F5C21B;--nuit:#12130F;--craie:#FAF7EF;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--nuit);font-family:"Arial Black","Segoe UI",Arial,sans-serif;color:var(--craie);
    display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
  header{width:100%;max-width:430px;padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:20px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:9px;letter-spacing:3px;color:#8b8f84;margin-top:3px;}
  .scores{text-align:right;line-height:1.25;}
  .scores .val{font-size:18px;color:var(--or);}
  .scores .lbl{font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;color:#8b8f84;}
  #msg{height:26px;font-size:14px;letter-spacing:.5px;text-align:center;color:var(--or);}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 12px 4px;gap:12px;}
  canvas{display:block;}
  #spin{background:var(--or);color:var(--nuit);border:none;border-radius:999px;
    padding:16px 44px;font-family:inherit;font-size:17px;letter-spacing:1px;}
  #spin:disabled{opacity:.4;}
  #spin:active{transform:scale(.96);}
  #gains{width:100%;max-width:340px;background:#1d1f19;border-radius:12px;padding:12px 14px;font-family:Arial;}
  #gains h4{font-family:"Arial Black";font-size:12px;letter-spacing:1px;color:#8b8f84;margin-bottom:8px;}
  .gl{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:#c9ccc0;}
  .gl b{color:var(--or);font-family:"Arial Black";}
  #popup{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,19,15,.92);text-align:center;padding:24px;border-radius:14px;z-index:5;}
  #popup h2{font-size:26px;color:var(--or);margin-bottom:6px;}
  #popup .lot{font-size:34px;margin:6px 0;}
  #popup p{font-family:Arial;font-size:14px;color:#c9ccc0;margin-bottom:20px;line-height:1.5;}
  #popup button{font-family:inherit;font-size:15px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:13px 32px;}
  footer{width:100%;max-width:430px;padding:8px 16px 12px;text-align:center;
    font-family:Arial,sans-serif;font-size:11px;color:#6c7064;letter-spacing:.5px;}
</style>
</head>
<body>
<header>
  <div class="logo">ROUE <span>FASO</span><small>UN SPIN GRATUIT PAR JOUR</small></div>
  <div style="display:flex;align-items:center;gap:0"><button id="btnSon" style="background:none;border:1px solid #57594f;color:var(--craie);border-radius:999px;width:32px;height:32px;font-size:14px;margin-right:8px">🔊</button>
<div class="scores"><div class="val" id="cagnotte">0</div>
  <div class="lbl">MES POINTS</div></div>
</div>
</header>
<div id="msg">Ton spin quotidien t'attend ! 🎡</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="spin">TOURNER</button>
  <div id="gains">
    <h4>🎁 MES GAINS DE LA SEMAINE</h4>
    <div id="listeGains"><div class="gl" style="color:#57594f">Aucun gain pour l'instant — tente ta chance !</div></div>
  </div>
  <div id="popup">
    <h2 id="popTitre"></h2>
    <div class="lot" id="popLot"></div>
    <p id="popTexte"></p>
    <button id="popOk">SUPER !</button>
  </div>
</div>
<footer>Réservé aux abonnés · Lots crédités sous 24 h · Démo VAS</footer>
<script>
(function(){
"use strict";
// ===== Kit sonore Faso Games (synthétisé, 0 Ko d'assets, silencieux par défaut respecté) =====
var SFX=(function(){
  var ctx,muet=false;
  try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
  function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
  function tone(freq,dur,type,vol,glide){
    if(muet)return;
    try{
      var c=ac();var o=c.createOscillator();var g=c.createGain();
      o.type=type||'sine';o.frequency.value=freq;
      if(glide)o.frequency.linearRampToValueAtTime(glide,c.currentTime+dur);
      g.gain.value=vol||0.15;
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+dur);
    }catch(e){}
  }
  return{
    tap:function(){tone(440,0.05,'square',0.08);},
    bon:function(){tone(523,0.09,'sine',0.14);setTimeout(function(){tone(784,0.12,'sine',0.14);},70);},
    mauvais:function(){tone(160,0.22,'sawtooth',0.12,90);},
    victoire:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'sine',0.15);},i*90);});},
    defaite:function(){[392,330,262].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'sine',0.12);},i*120);});},
    piece:function(){tone(988,0.08,'triangle',0.12,1400);},
    tick:function(){tone(300,0.03,'square',0.05);},
    estMuet:function(){return muet;},
    toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}
  };
})();
// Bouton mute (à placer dans le header de chaque jeu)
function initBoutonSon(id){
  var b=document.getElementById(id);
  if(!b)return;
  function maj(){b.textContent=SFX.estMuet()?'🔇':'🔊';}
  maj();
  b.addEventListener('click',function(){SFX.toggle();maj();});
}
// Confetti simple (petites particules colorées, pour les écrans de victoire)
function confetti(canvas,ctx,cx,cy){
  var parts=[];
  var couleurs=['#F5C21B','#E32219','#0E7A3C','#3d5a80','#FAF7EF'];
  for(var i=0;i<24;i++){
    var a=Math.random()*Math.PI*2,v=2+Math.random()*3;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:0.12,vie:1,col:couleurs[i%couleurs.length],taille:3+Math.random()*3});
  }
  return parts;
}
function drawConfetti(ctx,parts,dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=0.018*dt;
    if(p.vie<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.vie);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.taille/2,p.y-p.taille/2,p.taille,p.taille);
    ctx.globalAlpha=1;
  }
}
initBoutonSon("btnSon");

const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const spinBtn=document.getElementById('spin'),msg=document.getElementById('msg');
const cagnotteEl=document.getElementById('cagnotte'),listeGains=document.getElementById('listeGains');
const popup=document.getElementById('popup'),popTitre=document.getElementById('popTitre'),
      popLot=document.getElementById('popLot'),popTexte=document.getElementById('popTexte');
let DPR=1,R=0,cx=0,cy=0;

// secteurs : proba pondérée (les gros lots sont rares)
const SECTEURS=[
  {lbl:'10 pts', ico:'⭐', col:'#3d5a80', poids:22, type:'pts', val:10},
  {lbl:'25 Mo', ico:'📶', col:'#128a44', poids:16, type:'data', val:25},
  {lbl:'Rejoue', ico:'🔄', col:'#8a5a33', poids:14, type:'rejoue', val:0},
  {lbl:'50 pts', ico:'⭐', col:'#0E7A3C', poids:14, type:'pts', val:50},
  {lbl:'25 F', ico:'💰', col:'#E32219', poids:12, type:'airtime', val:25},
  {lbl:'100 Mo', ico:'📶', col:'#1b2a4a', poids:9, type:'data', val:100},
  {lbl:'Rien', ico:'😅', col:'#57594f', poids:7, type:'rien', val:0},
  {lbl:'100 F', ico:'💰', col:'#F28C1B', poids:4, type:'airtime', val:100},
  {lbl:'JACKPOT', ico:'🎰', col:'#F5C21B', poids:2, type:'jackpot', val:500},
];
const N=SECTEURS.length;
let angle=0, spinning=false, vitesse=0, cible=0, points=0, gains=[], peutSpin=true, totalEnvoiHub=0;
let confettiParts=[], dernierSecteurTick=null;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const dispo=Math.min(340, window.innerHeight*0.42);
  R=dispo/2;
  cvs.style.width=dispo+'px';cvs.style.height=dispo+'px';
  cvs.width=dispo*DPR;cvs.height=dispo*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=dispo/2;cy=dispo/2;
}
window.addEventListener('resize',resize);

function draw(){
  ctx.clearRect(0,0,R*2,R*2);
  const pas=Math.PI*2/N;
  for(let i=0;i<N;i++){
    const a0=angle+i*pas, a1=a0+pas;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R-8,a0,a1);ctx.closePath();
    ctx.fillStyle=SECTEURS[i].col;ctx.fill();
    ctx.strokeStyle='rgba(18,19,15,.4)';ctx.lineWidth=2;ctx.stroke();
    // texte
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(a0+pas/2);
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillStyle=SECTEURS[i].col==='#F5C21B'||SECTEURS[i].col==='#F28C1B'?'#12130F':'#FAF7EF';
    ctx.font='bold 13px Arial';
    ctx.fillText(SECTEURS[i].lbl,R-20,-4);
    ctx.font='15px Arial';
    ctx.fillText(SECTEURS[i].ico,R-20,12);
    ctx.restore();
  }
  // moyeu
  ctx.beginPath();ctx.arc(cx,cy,20,0,7);ctx.fillStyle='#12130F';ctx.fill();
  ctx.strokeStyle='#F5C21B';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#F5C21B';ctx.font='16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🎡',cx,cy+1);
  // flèche (pointe en haut)
  ctx.beginPath();
  ctx.moveTo(cx-12,6);ctx.lineTo(cx+12,6);ctx.lineTo(cx,26);ctx.closePath();
  ctx.fillStyle='#E32219';ctx.fill();
  ctx.strokeStyle='#FAF7EF';ctx.lineWidth=2;ctx.stroke();
}
function step(){
  if(spinning){
    angle+=vitesse;
    vitesse*=0.991;
    const pas=Math.PI*2/N;
    const secteurCourant=Math.floor(((-angle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)/pas);
    if(secteurCourant!==dernierSecteurTick){dernierSecteurTick=secteurCourant;SFX.tick();}
    if(vitesse<0.002){
      spinning=false;
      resoudre();
    }
  }
  draw();
  if(confettiParts.length)drawConfetti(ctx,confettiParts,1);
  requestAnimationFrame(step);
}
function tirageSecteur(){
  const total=SECTEURS.reduce((s,x)=>s+x.poids,0);
  let r=Math.random()*total;
  for(let i=0;i<N;i++){r-=SECTEURS[i].poids;if(r<=0)return i;}
  return 0;
}
function spin(){
  if(spinning||!peutSpin)return;
  const idx=tirageSecteur();
  const pas=Math.PI*2/N;
  // pour que le secteur idx s'arrête sous la flèche (en haut = -PI/2)
  const centreSecteur=idx*pas+pas/2;
  const viser=-Math.PI/2-centreSecteur;
  const tours=5+Math.floor(Math.random()*3);
  cible=viser-tours*Math.PI*2;
  // vitesse initiale pour atteindre approximativement la cible via la friction
  const delta=((cible-angle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)+tours*Math.PI*2;
  vitesse=delta*(1-0.991);
  gagnant=idx;
  spinning=true;peutSpin=false;
  spinBtn.disabled=true;spinBtn.textContent='...';
  msg.textContent="La roue tourne... 🍀";
}
let gagnant=0;
function resoudre(){
  const s=SECTEURS[gagnant];
  popTitre.textContent=s.type==='rien'?'Pas de chance !':s.type==='rejoue'?'Encore un tour !':'🎉 Gagné !';
  popLot.textContent=s.ico+' '+s.lbl;
  if(s.type==='pts'){
    points+=s.val;cagnotteEl.textContent=points;
    popTexte.textContent='+'+s.val+' points ajoutés à ton classement de la semaine.';
    ajouterGain(s.ico+' '+s.lbl);
    SFX.bon();
  }else if(s.type==='data'){
    popTexte.textContent=s.val+' Mo seront crédités sur ta ligne sous 24 h.';
    ajouterGain('📶 '+s.val+' Mo de data');
    SFX.piece();
  }else if(s.type==='airtime'){
    popTexte.textContent=s.val+' F de crédit seront ajoutés sous 24 h.';
    ajouterGain('💰 '+s.val+' F airtime');
    SFX.piece();
  }else if(s.type==='jackpot'){
    popTexte.textContent='500 F airtime + 500 Mo ! Crédités sous 24 h. Reviens demain !';
    ajouterGain('🎰 JACKPOT (500 F + 500 Mo)');
    SFX.victoire();
    confettiParts=confetti(cvs,ctx,cx,cy);
  }else if(s.type==='rejoue'){
    popTexte.textContent='La chance te sourit : tu peux retourner la roue !';
    peutSpin=true;
    SFX.tap();
  }else{
    popTexte.textContent='Ce sera pour la prochaine fois. Reviens demain pour un nouveau spin gratuit !';
    SFX.mauvais();
  }
  if(s.type!=='rejoue'){
    msg.textContent="Reviens demain pour un nouveau spin gratuit !";
  }else{
    msg.textContent="Tu rejoues gratuitement ! 🍀";
  }
  var ptsSpin = s.type==='jackpot'?300 : s.type==='pts'?s.val : s.type==='airtime'?s.val : s.type==='data'?Math.round(s.val/2) : s.type==='rejoue'?10:5;
  totalEnvoiHub+=ptsSpin;
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Roue du jour',score:totalEnvoiHub,victoire:s.type==='jackpot'},'*');}catch(e){}}
  popup.style.display='flex';
}
function ajouterGain(txt){
  gains.unshift(txt);
  listeGains.innerHTML=gains.slice(0,5).map(g=>'<div class="gl"><span>'+g+'</span><b>✓</b></div>').join('');
}
document.getElementById('popOk').addEventListener('click',()=>{
  popup.style.display='none';
  spinBtn.disabled=!peutSpin;
  spinBtn.textContent=peutSpin?'TOURNER ENCORE':'REVIENS DEMAIN';
});
spinBtn.addEventListener('click',spin);

window.__roue={state:()=>({points,gains:gains.length,peutSpin,spinning,confettiN:confettiParts.length,muet:SFX.estMuet()}),
  spin:spin,force:(idx)=>{gagnant=idx;spinning=false;resoudre();}};

resize();
requestAnimationFrame(step);
})();
</script>
</body>
</html>
