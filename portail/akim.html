<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Akim</title>
<style>
  :root{--vert:#0E7A3C;--rouge:#E32219;--or:#F5C21B;--nuit:#12130F;--craie:#FAF7EF;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#12130F;font-family:"Arial Black","Segoe UI",Arial,sans-serif;color:var(--craie);
    display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;}
  header{width:100%;max-width:430px;padding:8px 14px 4px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:17px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial;font-weight:400;font-size:8.5px;letter-spacing:2.5px;color:#8b8f84;margin-top:3px;}
  .hud{display:flex;align-items:center;gap:11px;font-size:13px;}
  .hud .item{display:flex;align-items:center;gap:3px;}
  .hud .val{color:var(--or);}
  #barreNiv{display:flex;align-items:center;gap:10px;justify-content:center;
    padding:0 14px 4px;width:100%;max-width:430px;}
  #barreNiv button{width:36px;height:36px;border-radius:50%;background:#2a2016;
    border:1.5px solid rgba(245,194,27,.25);color:var(--or);font-size:14px;flex-shrink:0;}
  #barreNiv button:disabled{opacity:.25;}
  #barreNiv button:active{transform:scale(.92);}
  #nivInfo{flex:1;text-align:center;line-height:1.25;}
  #nivMonde{font-family:Arial;font-size:9.5px;letter-spacing:2px;color:#8b8f84;text-transform:uppercase;}
  #nivNom{font-size:13.5px;color:var(--or);}
  #pastilles{display:flex;gap:5px;justify-content:center;padding:0 14px 6px;width:100%;max-width:430px;}
  .past{width:9px;height:9px;border-radius:50%;background:#2a2c24;border:1px solid #3d3527;}
  .past.fait{background:var(--or);border-color:var(--or);}
  .past.actif{transform:scale(1.5);background:var(--craie);border-color:var(--craie);}
  .past.verrou{opacity:.3;}
  #msg{height:19px;font-size:12px;text-align:center;color:var(--or);font-family:Arial;}
  #pouvoirs{display:flex;gap:7px;justify-content:center;min-height:30px;padding:0 14px 4px;
    width:100%;max-width:430px;}
  .pw{display:flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;
    font-size:11.5px;font-family:Arial;font-weight:bold;border:1.5px solid;
    animation:apparait .3s ease;}
  @keyframes apparait{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}
  .pw.fin{animation:clignote .5s infinite;}
  @keyframes clignote{0%,100%{opacity:1;}50%{opacity:.35;}}
  .pw .pwIco{font-size:14px;}
  .pw.grigri{border-color:#F5C21B;color:#F5C21B;background:rgba(245,194,27,.13);}
  .pw.ailes{border-color:#6ec8e8;color:#6ec8e8;background:rgba(110,200,232,.13);}
  .pw.griot{border-color:#b47ae0;color:#b47ae0;background:rgba(180,122,224,.13);}
  .pw.lance{border-color:#8fbf6e;color:#8fbf6e;background:rgba(143,191,110,.13);}
  #btnTirer{position:absolute;bottom:12px;right:96px;width:56px;height:56px;border-radius:50%;
    background:rgba(143,191,110,.5);border:2px solid rgba(143,191,110,.7);display:none;
    align-items:center;justify-content:center;font-size:21px;pointer-events:auto;color:var(--craie);}
  #btnTirer:active{background:rgba(143,191,110,.8);}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;justify-content:center;align-items:center;padding:0 8px 6px;}
  canvas{display:block;border-radius:12px;}
  #cmd{position:absolute;bottom:12px;left:14px;right:14px;display:flex;justify-content:space-between;
    align-items:flex-end;pointer-events:none;}
  .dpad{display:flex;gap:9px;}
  .btnC{width:62px;height:62px;border-radius:50%;background:rgba(18,19,15,.5);
    border:2px solid rgba(250,247,239,.3);display:flex;align-items:center;justify-content:center;
    font-size:24px;pointer-events:auto;backdrop-filter:blur(2px);color:var(--craie);}
  .btnC:active{background:rgba(245,194,27,.35);}
  #bSaut{width:74px;height:74px;background:rgba(14,122,60,.55);border-color:rgba(143,191,110,.5);font-size:28px;}
  #fin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,13,8,.94);text-align:center;padding:20px;border-radius:12px;}
  #fin h2{font-size:34px;color:var(--or);margin-bottom:4px;}
  #fin .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:310px;margin:8px 0 14px;}
  #fin .stat{background:rgba(245,194,27,.08);border-radius:10px;padding:9px 4px;}
  #fin .stat .v{font-size:18px;font-weight:bold;color:var(--or);}
  #fin .stat .l{font-size:8.5px;color:#a89878;letter-spacing:1px;margin-top:2px;}
  #fin p{font-family:Arial;font-size:12.5px;color:#c9b98f;margin-bottom:14px;line-height:1.5;max-width:310px;}
  #fin button{font-family:inherit;font-size:14px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:11px 30px;}
  #partageBtns{display:flex;flex-direction:column;gap:6px;width:100%;max-width:280px;margin-bottom:11px;}
  #partageBtns button{background:rgba(255,255,255,.05);border:1px solid #3d3527;color:var(--craie);
    border-radius:10px;padding:9px;font-size:12px;}
  #partageBtns #btnPartager{border-color:#25D366;color:#25D366;}
  #partageBtns #btnDefier{border-color:var(--or);color:var(--or);}
  footer{width:100%;max-width:430px;padding:4px 14px 8px;text-align:center;
    font-family:Arial;font-size:10px;color:#6c7064;}
</style>
</head>
<body>
<header>
  <div class="logo"><span>AKIM</span><small>COURS, SAUTE, RAMASSE</small></div>
  <div style="display:flex;align-items:center;gap:9px">
    <button id="btnSon" style="background:none;border:1px solid #57594f;color:var(--craie);border-radius:999px;width:28px;height:28px;font-size:12px">🔊</button>
    <div class="hud">
      <div class="item">❤️<span class="val" id="vies">3</span></div>
      <div class="item">🐚<span class="val" id="cauris">0</span></div>
      <div class="item">⭐<span class="val" id="score">0</span></div>
    </div>
  </div>
</header>
<div id="barreNiv">
  <button id="nivPrec">◀</button>
  <div id="nivInfo">
    <div id="nivMonde">La Savane</div>
    <div id="nivNom">1. Premiers pas</div>
  </div>
  <button id="nivSuiv">▶</button>
</div>
<div id="pastilles"></div>
<div id="msg">Avance vers le baobab !</div>
<div id="pouvoirs"></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="cmd">
    <div class="dpad">
      <div class="btnC" id="bGauche">◀</div>
      <div class="btnC" id="bDroite">▶</div>
    </div>
    <div class="btnC" id="bSaut">⤴</div>
  </div>
  <div id="btnTirer">🪃</div>
  <div id="fin">
    <h2 id="finTitre"></h2>
    <div class="stats">
      <div class="stat"><div class="v" id="fCauris">0</div><div class="l">CAURIS</div></div>
      <div class="stat"><div class="v" id="fDist">0</div><div class="l">DISTANCE</div></div>
      <div class="stat"><div class="v" id="fNiveau">—</div><div class="l">NIVEAU</div></div>
    </div>
    <p id="finTexte"></p>
    <div id="partageBtns">
      <button id="btnPartager">📤 Partager mon score</button>
      <button id="btnDefier">⚔️ Défier un ami</button>
    </div>
    <button id="suivant" style="display:none">NIVEAU SUIVANT ▶</button>
    <button id="rejouer">REJOUER</button>
  </div>
</div>
<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>
<script>
(function(){
"use strict";
// ---------- Son ----------
var actx,muet=false;
try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function tone(f,d,t,v,gl){if(muet)return;try{var c=ac(),o=c.createOscillator(),g=c.createGain();
o.type=t||'sine';o.frequency.value=f;if(gl)o.frequency.linearRampToValueAtTime(gl,c.currentTime+d);
g.gain.value=v||0.10;g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
var SFX={
  saut:function(){tone(330,0.11,'square',0.07,620);},
  cauri:function(){tone(880,0.07,'triangle',0.10,1320);},
  ecrase:function(){tone(200,0.09,'square',0.09,90);setTimeout(function(){tone(520,0.08,'triangle',0.08);},60);},
  calebasse:function(){tone(420,0.08,'square',0.08);setTimeout(function(){tone(700,0.10,'triangle',0.09);},55);},
  degat:function(){[330,262,196].forEach(function(f,i){setTimeout(function(){tone(f,0.16,'sawtooth',0.10);},i*90);});},
  chute:function(){tone(400,0.4,'sine',0.10,80);},
  victoire:function(){[523,659,784,1046,1319].forEach(function(f,i){setTimeout(function(){tone(f,0.19,'sine',0.14);},i*100);});},
  gameover:function(){[392,311,247,196].forEach(function(f,i){setTimeout(function(){tone(f,0.28,'sine',0.12);},i*160);});},
  pouvoir:function(){[523,659,880,1174].forEach(function(f,i){setTimeout(function(){tone(f,0.14,'triangle',0.12);},i*70);});},
  finPouvoir:function(){[660,520,400].forEach(function(f,i){setTimeout(function(){tone(f,0.13,'sine',0.08);},i*80);});},
  tir:function(){tone(700,0.07,'square',0.07,300);},
  doubleSaut:function(){tone(520,0.13,'triangle',0.09,980);},
  bouclier:function(){tone(880,0.10,'sine',0.13);setTimeout(function(){tone(1320,0.16,'sine',0.11);},70);},
  estMuet:function(){return muet;},
  toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}
};
(function(){var b=document.getElementById('btnSon');
function m(){b.textContent=SFX.estMuet()?'🔇':'🔊';}m();
b.addEventListener('click',function(){SFX.toggle();m();});})();

function domConfetti(){
  var cols=['#F5C21B','#E32219','#0E7A3C','#3d5a80','#FAF7EF'];
  for(var i=0;i<26;i++){
    var el=document.createElement('div'),s=4+Math.random()*4;
    el.style.cssText='position:fixed;z-index:60;pointer-events:none;border-radius:2px;';
    el.style.width=s+'px';el.style.height=s+'px';el.style.background=cols[i%cols.length];
    el.style.left=(window.innerWidth/2+(Math.random()-0.5)*70)+'px';el.style.top='40%';
    document.body.appendChild(el);
    var dx=(Math.random()-0.5)*260,dy=200+Math.random()*200,r=Math.random()*720-360,d=900+Math.random()*500;
    el.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:'translate('+dx+'px,'+dy+'px) rotate('+r+'deg)',opacity:0}],
      {duration:d,easing:'cubic-bezier(.25,.46,.45,.94)'});
    (function(e,t){setTimeout(function(){e.remove();},t+50);})(el,d);
  }
}

function genererMonde(){
  var n=N();
  plateformes=[];ennemis=[];cauris=[];calebasses=[];trous=[];particules=[];terriers=[];
  var x=0, longueur=n.longueur*TUILE;
  // sol de départ sûr
  plateformes.push({x:0,y:SOL,w:TUILE*6,h:80,type:'sol'});
  x=TUILE*6;
  while(x<longueur){
    var r=Math.random();
    // trou — jamais collé au précédent : il faut de la place pour reprendre l'élan
    var dernierTrou=trous.length?trous[trous.length-1]:null;
    var placeDepuisTrou=dernierTrou?(x-(dernierTrou.x+dernierTrou.w)):9999;
    if(r<0.16*n.trous && x>TUILE*10 && placeDepuisTrou>=TUILE*3.5){
      var larg=TUILE*(1.3+Math.random()*0.75);
      // sol d'appui garanti juste avant le trou
      plateformes.push({x:x-TUILE*2,y:SOL,w:TUILE*2,h:80,type:'sol'});
      trous.push({x:x,w:larg});
      x+=larg;
      // sol de réception garanti juste après
      plateformes.push({x:x,y:SOL,w:TUILE*2.5,h:80,type:'sol'});
      x+=TUILE*2.5;
      continue;
    }
    // segment de sol
    var seg=TUILE*(3+Math.floor(Math.random()*5));
    plateformes.push({x:x,y:SOL,w:seg,h:80,type:'sol'});
    // plateforme suspendue
    if(Math.random()<0.42){
      var py=SOL-TUILE*(1.9+Math.random()*0.9);
      var pw=TUILE*(2+Math.floor(Math.random()*2));
      var px=x+Math.random()*(seg-pw);
      if(pw<seg){
        plateformes.push({x:px,y:py,w:pw,h:16,type:'plateforme'});
        // cauris dessus
        for(var k=0;k<2;k++)cauris.push({x:px+18+k*26,y:py-24,pris:false,t:Math.random()*6});
      }
    }
    // calebasse suspendue
    if(Math.random()<0.30){
      var tirage=Math.random();
      var contenu = tirage<0.20 ? 'lance'
                  : tirage<0.34 ? 'grigri'
                  : tirage<0.46 ? 'ailes'
                  : tirage<0.55 ? 'griot'
                  : tirage<0.70 ? 'vie'
                  : 'cauris';
      calebasses.push({x:x+seg*0.5,y:SOL-TUILE*2.5,cassee:false,bonus:contenu});
    }
    // terriers (monde 2 et 3) : un scorpion jaillit quand Akim passe
    var mondeAct=Math.ceil(PARCOURS[niveauIdx].num/3);
    if(mondeAct>=2 && Math.random()<0.30*n.ennemis && x>TUILE*14){
      terriers.push({x:x+seg*0.6, y:SOL, etat:'ferme', t:0, utilise:false,
        sortie:0, ennemi:null});
    }
    // ennemis
    if(Math.random()<0.42*n.ennemis && x>TUILE*12){
      var dispo=typesDisponibles();
      var type=dispo[Math.floor(Math.random()*dispo.length)];
      var T=TYPES_ENNEMI[type];
      ennemis.push({x:x+seg*0.4, y:SOL-T.h,
        w:T.w, h:T.h, pv:T.pv, pvMax:T.pv,
        vx:-T.vitesse*(0.85+Math.random()*0.4),
        type:type, vivant:true, minX:x, maxX:x+seg, t:0,
        invuln:0, etat:'normal', tAttaque:0});
    }
    // cauris au sol
    if(Math.random()<0.5){
      var nb=2+Math.floor(Math.random()*3);
      for(var j=0;j<nb;j++)cauris.push({x:x+seg*0.3+j*26,y:SOL-26,pris:false,t:Math.random()*6});
    }
    x+=seg;
  }
  // arrivée — ou arène de boss
  var pNiv=PARCOURS[niveauIdx];
  if(pNiv.boss){
    plateformes.push({x:x,y:SOL,w:TUILE*18,h:80,type:'sol'});
    var B=BOSS[pNiv.boss];
    boss={x:x+TUILE*12, y:SOL, w:B.w, h:B.h, pv:B.pv, pvMax:B.pv,
      type:pNiv.boss, vx:-B.vitesse, phase:'attente', t:0, invuln:0,
      minX:x+TUILE*4, maxX:x+TUILE*16, mort:false, yOff:0};
    window.__arene=x;
    window.__arrivee=x+TUILE*60; // inaccessible tant que le boss vit
  }else{
    plateformes.push({x:x,y:SOL,w:TUILE*7,h:80,type:'sol'});
    boss=null;
    window.__arene=null;
    window.__arrivee=x+TUILE*4;
  }
}

function pouvoirActif(k){return (actifs[k]||0)>0;}
function tirerCaillou(){

}
function step(dt){
  tempsJeu+=dt*0.016;
  if(over)return;
  if(invincible>0)invincible-=dt;
  // déplacement horizontal
  if(gauche){akim.vx-=0.72*dt;akim.regard=-1;}
  if(droite){akim.vx+=0.72*dt;akim.regard=1;}
  if(!gauche&&!droite)akim.vx*=Math.pow(0.82,dt);
  akim.vx=Math.max(-VMAX,Math.min(VMAX,akim.vx));
  akim.x+=akim.vx*dt;
  if(akim.x<10)akim.x=10;
  if(Math.abs(akim.vx)>0.4)akim.anim+=dt*0.28;

  // décompte des pouvoirs
  var expire=false;
  Object.keys(actifs).forEach(function(k){
    actifs[k]-=dt;
    if(actifs[k]<=0){
      delete actifs[k];
      $('msg').textContent=POUVOIRS[k].ico+' '+POUVOIRS[k].nom+' terminé';
      SFX.finPouvoir();
      expire=true;
    }
  });
  // rafraîchir immédiatement à l'expiration, sinon 4 fois par seconde pour le décompte
  if(expire){
    majPouvoirs();
  }else{
    var tick=Math.floor(tempsJeu*4);
    if(tick!==dernierTickHUD){dernierTickHUD=tick;majPouvoirs();}
  }

  // saut (avec double saut si ailes actives)
  if(sautDemande){
    if(akim.sol){
      akim.vy=SAUT;akim.sol=false;SFX.saut();
      doubleSautDispo=pouvoirActif('ailes');
    }else if(doubleSautDispo&&pouvoirActif('ailes')){
      akim.vy=SAUT*0.88;doubleSautDispo=false;
      SFX.doubleSaut();
      for(var pl=0;pl<7;pl++){
        var ang=Math.PI*0.25+Math.random()*Math.PI*0.5;
        particules.push({x:akim.x,y:akim.y+akim.h*0.4,vx:Math.cos(ang)*2,vy:Math.sin(ang)*2,
          vie:1,col:'#6ec8e8',t:2+Math.random()*2});
      }
    }
  }
  sautDemande=false;

  // ---------- BOSS ----------
  if(boss&&!boss.mort){
    boss.t+=dt;
    if(boss.invuln>0)boss.invuln-=dt;
    var distAkim=akim.x-boss.x;
    if(boss.phase==='attente'){
      if(akim.x>window.__arene+TUILE*2){
        boss.phase='marche';
        $('msg').textContent='⚠️ Le Chef des scorpions !';
        SFX.degat();
      }
    }else if(boss.phase==='marche'){
      boss.x+=boss.vx*dt;
      if(boss.x<boss.minX){boss.x=boss.minX;boss.vx=Math.abs(boss.vx);}
      if(boss.x>boss.maxX){boss.x=boss.maxX;boss.vx=-Math.abs(boss.vx);}
      var seuilAttaque = boss.type==='buffle'?85:(boss.type==='brigand'?90:120);
      if(boss.t>seuilAttaque){
        if(boss.type==='brigand'&&Math.abs(distAkim)<TUILE*9){
          // le brigand lance des projectiles
          boss.phase='lancer';boss.t=0;
          cailloux.push({x:boss.x-(distAkim>0?-20:20),y:boss.y-boss.h*0.7,
            vx:(distAkim>0?1:-1)*4.4,vie:200,ennemi:true});
          SFX.tir();
        }else if(Math.abs(distAkim)<TUILE*(boss.type==='buffle'?7:5)){
          boss.phase='charge';boss.t=0;
          boss.vx=(distAkim>0?1:-1)*BOSS[boss.type].vitesse*(boss.type==='buffle'?3.0:2.6);
          SFX.tir();
        }
      }
    }else if(boss.phase==='charge'){
      boss.x+=boss.vx*dt;
      if(boss.type==='buffle'){
        // la charge fait trembler le sol
        if(Math.random()<0.4){
          particules.push({x:boss.x-(boss.vx>0?30:-30),y:boss.y-4,
            vx:-(boss.vx>0?1:-1)*(0.8+Math.random()*1.2),vy:-0.4-Math.random(),
            vie:1,col:'#a08050',t:2.5+Math.random()*2.5});
        }
      }
      if(boss.x<boss.minX||boss.x>boss.maxX||boss.t>(boss.type==='buffle'?85:70)){
        boss.phase='repos';boss.t=0;boss.yOffB=0;boss.vyB=0;
        boss.vx=(boss.vx>0?1:-1)*BOSS[boss.type].vitesse;
      }
    }else if(boss.phase==='lancer'){
      if(boss.t>55){boss.phase='repos';boss.t=0;}
    }else if(boss.phase==='repos'){
      var duree = boss.type==='brigand'?70:(boss.type==='buffle'?55:90);
      if(boss.t>duree){boss.phase='marche';boss.t=0;}
    }
    boss.yOff=Math.sin(boss.t*0.09)*(boss.phase==='repos'?1:3)+(boss.yOffB||0);

    var bx=Math.abs(akim.x-boss.x), by=Math.abs(akim.y-(boss.y-boss.h*0.5));
    if(bx<(akim.w*0.5+boss.w*0.45)&&by<(akim.h*0.5+boss.h*0.55)){
      if(akim.vy>1.2&&akim.y<boss.y-boss.h*0.7&&boss.invuln<=0){
        toucherBoss(1);akim.vy=SAUT*0.7;
      }else if(pouvoirActif('griot')&&boss.invuln<=0){
        toucherBoss(1);
      }else if(pouvoirActif('grigri')){
        delete actifs.grigri;invincible=90;
        SFX.bouclier();exploser(akim.x,akim.y,'#F5C21B');
        $('msg').textContent='🧿 Le gri-gri t\'a protégé !';
        majPouvoirs();
      }else if(invincible<=0){
        perdreVie(false);return;
      }
    }
  }

  // ---------- TERRIERS ----------
  for(var te=0;te<terriers.length;te++){
    var tr=terriers[te];
    if(tr.x<cam-120||tr.x>cam+W+120)continue;
    if(tr.etat==='ferme'){
      // frémit quand Akim approche
      if(Math.abs(akim.x-tr.x)<TUILE*4.5){
        tr.etat='fremit';tr.t=0;
      }
    }else if(tr.etat==='fremit'){
      tr.t+=dt;
      if(tr.t>26){
        // jaillissement !
        tr.etat='ouvert';tr.t=0;tr.sortie=0;
        var sens=(akim.x>tr.x)?1:-1;
        var scorp={x:tr.x, y:SOL-15, w:26, h:15, pv:1, pvMax:1,
          vx:sens*1.05, type:'scorpion', vivant:true,
          minX:tr.x-TUILE*4, maxX:tr.x+TUILE*4, t:0, invuln:0,
          etat:'normal', tAttaque:0, jaillit:22};
        ennemis.push(scorp);
        tr.ennemi=scorp;
        SFX.degat();
        for(var pj=0;pj<9;pj++){
          var aj=Math.PI+Math.random()*Math.PI;
          particules.push({x:tr.x,y:SOL-4,vx:Math.cos(aj)*2.2,vy:Math.sin(aj)*2.6,
            vie:1,col:'#a86f30',t:2+Math.random()*2.5});
        }
      }
    }else if(tr.etat==='ouvert'){
      tr.t+=dt;
      if(tr.t>240)tr.etat='vide';
    }
  }

  // flammes des dragons
  for(var fl2=flammes.length-1;fl2>=0;fl2--){
    var fm=flammes[fl2];
    fm.x+=fm.vx*dt; fm.vie-=dt; fm.t+=dt;
    if(fm.vie<=0||fm.x<cam-60||fm.x>cam+W+60){flammes.splice(fl2,1);continue;}
    if(Math.abs(fm.x-akim.x)<20&&Math.abs(fm.y-akim.y)<26){
      flammes.splice(fl2,1);
      if(pouvoirActif('grigri')){
        delete actifs.grigri;invincible=90;
        SFX.bouclier();exploser(akim.x,akim.y,'#F5C21B');
        $('msg').textContent='🧿 Le gri-gri a bloqué le feu !';
        majPouvoirs();
      }else if(!pouvoirActif('griot')&&invincible<=0){
        perdreVie(false);return;
      }
    }
  }

  // cailloux du lance-pierre
  for(var ci=cailloux.length-1;ci>=0;ci--){
    var ca2=cailloux[ci];
    ca2.x+=ca2.vx*dt;ca2.vie-=dt;
    if(ca2.vie<=0||ca2.x<cam-40||ca2.x>cam+W+40){cailloux.splice(ci,1);continue;}
    // projectile ennemi : touche Akim
    if(ca2.ennemi){
      if(Math.abs(ca2.x-akim.x)<20&&Math.abs(ca2.y-akim.y)<26){
        cailloux.splice(ci,1);
        if(pouvoirActif('grigri')){
          delete actifs.grigri;invincible=90;
          SFX.bouclier();exploser(akim.x,akim.y,'#F5C21B');
          $('msg').textContent='🧿 Le gri-gri t\'a protégé !';
          majPouvoirs();
        }else if(!pouvoirActif('griot')&&invincible<=0){
          perdreVie(false);return;
        }
        continue;
      }
      continue; // ne touche pas le boss
    }
    // toucher le boss
    if(boss&&!boss.mort&&boss.phase!=='attente'&&boss.invuln<=0){
      if(Math.abs(ca2.x-boss.x)<boss.w*0.5&&Math.abs(ca2.y-(boss.y-boss.h*0.5))<boss.h*0.7){
        toucherBoss(1);
        cailloux.splice(ci,1);
        continue;
      }
    }
    // toucher un ennemi
    for(var ei=0;ei<ennemis.length;ei++){
      var en2=ennemis[ei];
      if(!en2.vivant)continue;
      if(Math.abs(ca2.x-en2.x)<en2.w*0.6&&Math.abs(ca2.y-(en2.y-en2.h*0.5))<en2.h*0.9){
        blesserEnnemi(en2,1);
        cailloux.splice(ci,1);
        break;
      }
    }
  }

  // gravité
  akim.vy+=G*dt;
  if(akim.vy>16)akim.vy=16;
  var ancienY=akim.y;
  akim.y+=akim.vy*dt;

  // collisions plateformes
  akim.sol=false;
  for(var i=0;i<plateformes.length;i++){
    var p=plateformes[i];
    if(akim.x+akim.w*0.5<p.x||akim.x-akim.w*0.5>p.x+p.w)continue;
    // atterrissage par le dessus
    if(akim.vy>=0 && ancienY+akim.h*0.5<=p.y+4 && akim.y+akim.h*0.5>=p.y){
      akim.y=p.y-akim.h*0.5;akim.vy=0;akim.sol=true;
    }
  }
  // chute dans un trou
  if(akim.y>H+60){perdreVie(true);return;}

  // ennemis
  for(var e=0;e<ennemis.length;e++){
    var en=ennemis[e];
    if(!en.vivant)continue;
    en.t+=dt;
    if(en.invuln>0)en.invuln-=dt;
    var T=TYPES_ENNEMI[en.type];
    var ecart=akim.x-en.x;
    // animation de sortie du terrier
    if(en.jaillit>0){en.jaillit-=dt;if(en.jaillit<0)en.jaillit=0;}

    if(en.type==='dragon'){
      // immobile, crache du feu par intervalles
      en.tAttaque+=dt;
      if(en.tAttaque>150&&Math.abs(ecart)<TUILE*8){
        en.tAttaque=0;
        en.etat='crache';
        var sens=ecart>0?1:-1;
        flammes.push({x:en.x+sens*26,y:en.y-en.h*0.55,vx:sens*3.6,vie:150,t:0});
        SFX.degat();
      }
      if(en.etat==='crache'&&en.tAttaque>28)en.etat='normal';
    }else if(en.type==='belier'){
      if(en.etat==='gratte'){
        en.tAttaque+=dt;
        if(en.tAttaque>34){
          en.etat='charge';en.tAttaque=0;
          en.chargeSens=(akim.x>en.x)?1:-1;
          SFX.degat();
        }
      }else if(en.etat==='charge'){
        en.tAttaque+=dt;
        en.x+=(en.chargeSens||1)*3.4*dt;
        if(en.tAttaque>55){en.etat='souffle';en.tAttaque=0;}
      }else if(en.etat==='souffle'){
        en.tAttaque+=dt;
        if(en.tAttaque>40){en.etat='normal';en.tAttaque=0;}
      }else{
        en.x+=en.vx*dt;
        if(en.x<en.minX||en.x>en.maxX)en.vx*=-1;
        // repère Akim et se prépare à charger
        if(Math.abs(ecart)<TUILE*5.5&&Math.abs(akim.y-en.y)<TUILE*2){
          en.etat='gratte';en.tAttaque=0;
          en.chargeSens=(ecart>0?1:-1);            // se tourne vers Akim
          en.vx=-en.chargeSens*Math.abs(en.vx)*0.4; // recule pour prendre son élan
        }
      }
    }else if(en.type==='serpent'){
      if(en.etat==='mord'){
        en.tAttaque+=dt;
        // frappe vers l'avant
        en.x+=(en.morsureSens||1)*3.2*dt;
        if(en.tAttaque>18){en.etat='recul';en.tAttaque=0;}
      }else if(en.etat==='recul'){
        en.tAttaque+=dt;
        en.x-=(en.morsureSens||1)*1.6*dt;
        if(en.tAttaque>22){en.etat='normal';en.tAttaque=0;}
      }else{
        en.x+=en.vx*dt;
        if(en.x<en.minX||en.x>en.maxX)en.vx*=-1;
        // se dresse et mord quand Akim approche
        if(Math.abs(ecart)<TUILE*2.4&&Math.abs(akim.y-en.y)<TUILE*1.6){
          en.etat='mord';en.tAttaque=0;
          en.morsureSens=ecart>0?1:-1;
          SFX.tir();
        }
      }
    }else{
      en.x+=en.vx*dt;
      if(en.x<en.minX||en.x>en.maxX)en.vx*=-1;
    }
    // collision
    var dx=Math.abs(akim.x-en.x), dy=Math.abs(akim.y-(en.y-en.h*0.5));
    if(dx<(akim.w*0.5+en.w*0.5)&&dy<(akim.h*0.5+en.h*0.5)){
      // écrasement si Kader tombe dessus
      if(akim.vy>1.2 && akim.y<en.y-en.h*0.6){
        akim.vy=SAUT*0.62;
        blesserEnnemi(en,1);
      }else if(pouvoirActif('griot')){
        en.vivant=false;score+=150;
        SFX.ecrase();
        exploser(en.x,en.y-en.h*0.5,'#b47ae0');
        $('msg').textContent='🥁 Le griot balaie tout ! +150';
      }else if(pouvoirActif('grigri')){
        // le gri-gri absorbe le coup
        delete actifs.grigri;
        invincible=90;
        SFX.bouclier();
        exploser(akim.x,akim.y,'#F5C21B');
        $('msg').textContent='🧿 Le gri-gri t\'a protégé !';
        majPouvoirs();
      }else if(invincible<=0){
        perdreVie(false);
        return;
      }
    }
  }
  // cauris
  for(var c=0;c<cauris.length;c++){
    var cu=cauris[c];
    if(cu.pris)continue;
    cu.t+=dt*0.1;
    if(Math.abs(akim.x-cu.x)<24&&Math.abs(akim.y-cu.y)<28){
      cu.pris=true;nbCauris++;score+=25;
      SFX.cauri();
      exploser(cu.x,cu.y,'#F5C21B');
      $('cauris').textContent=nbCauris;
    }
  }
  // calebasses (frappées par le dessous)
  for(var k=0;k<calebasses.length;k++){
    var ca=calebasses[k];
    if(ca.cassee)continue;
    if(Math.abs(akim.x-ca.x)<26 && akim.vy<0 &&
       Math.abs((akim.y-akim.h*0.5)-(ca.y+16))<16){
      ca.cassee=true;akim.vy=1.5;
      SFX.calebasse();
      exploser(ca.x,ca.y,'#c9a066');
      if(ca.bonus==='vie'){vies++;$('vies').textContent=vies;$('msg').textContent='❤️ Une vie en plus !';}
      else if(ca.bonus==='lance'){donnerPouvoir('lance');}
      else if(ca.bonus==='grigri'){donnerPouvoir('grigri');}
      else if(ca.bonus==='ailes'){donnerPouvoir('ailes');}
      else if(ca.bonus==='griot'){donnerPouvoir('griot');}
      else{nbCauris+=5;score+=125;$('cauris').textContent=nbCauris;$('msg').textContent='🐚 5 cauris !';}
    }
  }
  // particules
  for(var pa=particules.length-1;pa>=0;pa--){
    var pp=particules[pa];
    pp.x+=pp.vx*dt;pp.y+=pp.vy*dt;pp.vy+=0.22*dt;pp.vie-=0.03*dt;
    if(pp.vie<=0)particules.splice(pa,1);
  }
  // caméra
  var cible=akim.x-W*0.34;
  cam+=(cible-cam)*0.13*dt;
  if(cam<0)cam=0;
  dist=Math.max(dist,Math.floor(akim.x/TUILE));
  score=Math.max(score,dist*4+nbCauris*25);
  $('score').textContent=score;
  // arrivée
  if(akim.x>=window.__arrivee){terminer(true);}
}
var NOMS_ENNEMI={scorpion:'Scorpion',belier:'Bélier',serpent:'Serpent',dragon:'Dragon'};
function blesserEnnemi(en,n){
  if(en.invuln>0||!en.vivant)return;
  en.pv-=n;
  en.invuln=30;
  SFX.ecrase();
  if(en.pv<=0){
    en.vivant=false;
    var T=TYPES_ENNEMI[en.type];
    score+=T.pts;
    exploser(en.x,en.y-en.h*0.5,en.type==='dragon'?'#e05a1a':'#8a5a33');
    $('msg').textContent='💥 '+NOMS_ENNEMI[en.type]+' vaincu ! +'+T.pts;
  }else{
    exploser(en.x,en.y-en.h*0.5,'#c9a066');
    $('msg').textContent='⚡ '+NOMS_ENNEMI[en.type]+' touché — '+en.pv+' pv';
  }
}
function toucherBoss(n){
  if(!boss||boss.mort||boss.invuln>0)return;
  boss.pv-=n;
  boss.invuln=45;
  SFX.ecrase();
  exploser(boss.x,boss.y-boss.h*0.6,'#e8a04a');
  if(boss.pv<=0){
    boss.mort=true;
    score+=800;
    SFX.victoire();
    for(var i=0;i<26;i++){
      var a=Math.random()*Math.PI*2,v=1.5+Math.random()*3.5;
      particules.push({x:boss.x,y:boss.y-boss.h*0.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,
        vie:1,col:i%2?'#F5C21B':'#e8a04a',t:3+Math.random()*3});
    }
    $('msg').textContent='🏆 Chef des scorpions vaincu ! +800';
    // ouvrir la sortie
    window.__arrivee=boss.x+TUILE*4;
    plateformes.push({x:boss.x,y:SOL,w:TUILE*8,h:80,type:'sol'});
  }else{
    $('msg').textContent='💥 Touché ! Encore '+boss.pv+' coup'+(boss.pv>1?'s':'');
  }
}
function perdreVie(parChute){
  vies--;
  $('vies').textContent=Math.max(0,vies);
  if(parChute)SFX.chute();else SFX.degat();
  if(vies<=0){terminer(false);return;}
  invincible=90;
  $('msg').textContent='💔 Plus que '+vies+' vie'+(vies>1?'s':'')+' !';
  // replacer sur du sol sûr
  var x=Math.max(60,akim.x-TUILE*3);
  var essais=0;
  while(surTrou(x)&&essais<40){x-=TUILE;essais++;}
  akim.x=Math.max(60,x);akim.y=SOL-56;akim.vx=0;akim.vy=0;
}
function exploser(x,y,col){
  for(var i=0;i<8;i++){
    var a=Math.random()*Math.PI*2,v=1+Math.random()*2.4;
    particules.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,vie:1,col:col,t:2+Math.random()*3});
  }
}
function terminer(win){
  over=true;gagne=win;
  var p=PARCOURS[niveauIdx];
  var dernier=(niveauIdx===PARCOURS.length-1);
  if(win){
    // débloquer le niveau suivant
    if(niveauIdx>=maxDebloque && !dernier){
      maxDebloque=niveauIdx+1;
      try{localStorage.setItem('fasogames_akim_max',maxDebloque);}catch(e){}
    }
    scoreCumule+=score;
    try{localStorage.setItem('fasogames_akim_cumul',scoreCumule);}catch(e){}
  }
  $('finTitre').textContent = win
    ? (dernier?'🎭 MASQUE RÉCUPÉRÉ !':(p.boss?'⚔️ '+BOSS[p.boss].nom+' vaincu !':'🏆 Niveau '+p.num+' réussi !'))
    : 'Fin de partie';
  $('fCauris').textContent=nbCauris;
  $('fDist').textContent=dist+' m';
  $('fNiveau').textContent=p.num+'/'+PARCOURS.length;
  var seuil=Math.round(700*p.coef);
  var finMonde = p.boss && !dernier;
  $('finTexte').textContent = win
    ? (dernier
       ? 'Akim a vaincu le Grand Brigand et rapporté le masque sacré au village ! '+
         'Toute la savane danse ce soir. Score total du parcours : '+scoreCumule+' pts.'
       : finMonde
       ? 'Le chef est à terre, mais le masque n\'est pas là... La piste continue vers '+
         PARCOURS[niveauIdx+1].monde+'. Total : '+scoreCumule+' pts.'
       : 'Bravo ! Le niveau '+(p.num+1)+' est débloqué. Total du parcours : '+scoreCumule+' pts.')
    : score>=seuil ? 'Presque ! Vise les calebasses pour récupérer des pouvoirs.'
    : 'Saute sur les ennemis ou utilise le lance-pierre, ça rapporte gros !';
  // bouton niveau suivant
  $('suivant').style.display=(win&&!dernier)?'block':'none';
  $('rejouer').textContent=win?'REJOUER CE NIVEAU':'REJOUER';
  if(win){SFX.victoire();domConfetti();}else if(score>=seuil){SFX.victoire();}else{SFX.gameover();}
  var envoi=Math.round(Math.min(700,score*0.55)*p.coef);
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Akim',
    score:envoi,victoire:win},'*');}catch(e){}}
  $('fin').style.display='flex';
}

// ================= RENDU =================
function draw(){
  var P=N();
  // ciel dégradé selon l'ambiance du niveau
  var ciel=ctx.createLinearGradient(0,0,0,H);
  ciel.addColorStop(0,P.ciel[0]);ciel.addColorStop(0.42,P.ciel[1]);
  ciel.addColorStop(0.75,P.ciel[2]);ciel.addColorStop(1,P.ciel[3]);
  ctx.fillStyle=ciel;ctx.fillRect(0,0,W,H);
  if(P.decor==='grotte'){
    decorGrotte(P);
  }else{
  // soleil avec halo
  var sx=W*0.80, sy=H*0.15;
  var s=ctx.createRadialGradient(sx,sy,4,sx,sy,P.poussiere>0.6?74:58);
  s.addColorStop(0,P.soleil[0]);s.addColorStop(0.35,P.soleil[1]);s.addColorStop(1,P.soleil[2]);
  ctx.fillStyle=s;ctx.beginPath();ctx.arc(sx,sy,P.poussiere>0.6?74:58,0,7);ctx.fill();
  ctx.fillStyle=P.poussiere>0.6?'rgba(255,235,190,.85)':'#fffbe0';
  ctx.beginPath();ctx.arc(sx,sy,17,0,7);ctx.fill();

  // nuages (parallaxe très lente)
  var nbNuages=P.poussiere>0.6?2:5;
  for(var nu=0;nu<nbNuages;nu++){
    var nx=(nu*260-(cam*0.06)%(260*5)+260*5)%(260*5)-70;
    var ny=H*0.10+((nu*37)%40);
    nuage(nx,ny,0.7+((nu*5)%3)*0.22,P.poussiere>0.6?0.35:1);
  }
  // oiseaux
  for(var oi=0;oi<3;oi++){
    var ox=(oi*310-(cam*0.10)%(310*3)+310*3)%(310*3)-40;
    var oy=H*0.20+Math.sin(tempsJeu*0.6+oi*2)*7+oi*22;
    oiseau(ox,oy,0.8+oi*0.14);
  }

  // collines lointaines (couche 1, la plus pâle)
  ctx.fillStyle=P.collines[0];
  ctx.beginPath();ctx.moveTo(0,SOL);
  for(var mx=0;mx<=W;mx+=14){
    var wx=(mx+cam*0.07)*0.009;
    ctx.lineTo(mx,SOL-96+Math.sin(wx)*32+Math.sin(wx*2.1)*14);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  // collines (couche 2)
  ctx.fillStyle=P.collines[1];
  ctx.beginPath();ctx.moveTo(0,SOL);
  for(var mx2=0;mx2<=W;mx2+=14){
    var wx2=(mx2+cam*0.14)*0.012;
    ctx.lineTo(mx2,SOL-56+Math.sin(wx2)*24+Math.sin(wx2*2.6)*10);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  // --- éléments propres à chaque décor ---
  if(P.decor==='fleuve'){
    // le fleuve occupe la bande derrière le sol
    var fy=SOL-46;
    var ge=ctx.createLinearGradient(0,fy,0,SOL+6);
    ge.addColorStop(0,'#4a9ec4');ge.addColorStop(0.5,'#2e7fa8');ge.addColorStop(1,'#1d5c7e');
    ctx.fillStyle=ge;ctx.fillRect(0,fy,W,SOL-fy+6);
    // reflets ondulants
    for(var rf=0;rf<26;rf++){
      var rx=(rf*38-(cam*0.30)%(38*26)+38*26)%(38*26)-20;
      var ry=fy+8+((rf*13)%32);
      var lg2=12+Math.sin(tempsJeu*2+rf)*6;
      ctx.strokeStyle='rgba(190,232,245,'+(0.15+((rf%3)*0.08))+')';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx+lg2,ry);ctx.stroke();
    }
    // pirogues au loin
    for(var pg=0;pg<4;pg++){
      var px3=(pg*290-(cam*0.22)%(290*4)+290*4)%(290*4)-50;
      if(px3<-60||px3>W+60)continue;
      var py3=fy+16+((pg*11)%16)+Math.sin(tempsJeu*1.5+pg)*2;
      ctx.fillStyle='rgba(105,72,38,.85)';
      ctx.beginPath();
      ctx.moveTo(px3-20,py3);ctx.quadraticCurveTo(px3,py3+7,px3+20,py3);
      ctx.lineTo(px3+15,py3-4);ctx.lineTo(px3-15,py3-4);
      ctx.closePath();ctx.fill();
      // pagayeur
      ctx.strokeStyle='rgba(60,42,22,.8)';ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(px3,py3-4);ctx.lineTo(px3+1,py3-14);ctx.stroke();
      ctx.beginPath();ctx.moveTo(px3+1,py3-11);ctx.lineTo(px3+9,py3-3);ctx.stroke();
    }
    // roseaux au bord
    for(var ro2=0;ro2<30;ro2++){
      var rox=(ro2*46-(cam*0.62)%(46*30)+46*30)%(46*30)-20;
      if(rox<-20||rox>W+20)continue;
      var osc2=Math.sin(tempsJeu*1.8+ro2)*3;
      ctx.strokeStyle='rgba(48,120,62,.75)';ctx.lineWidth=2.4;ctx.lineCap='round';
      for(var tg=0;tg<3;tg++){
        ctx.beginPath();
        ctx.moveTo(rox+tg*5,SOL);
        ctx.quadraticCurveTo(rox+tg*5+osc2*0.5,SOL-16,rox+tg*5+osc2+(tg-1)*4,SOL-30);
        ctx.stroke();
      }
      // épi
      ctx.fillStyle='rgba(150,120,60,.8)';
      ctx.beginPath();ctx.ellipse(rox+5+osc2,SOL-32,2.6,6,0,0,7);ctx.fill();
    }
  }else if(P.decor==='domes'){
    // dômes de granit façon Fabédougou
    for(var dm=0;dm<9;dm++){
      var dx2=(dm*245-(cam*0.26)%(245*9)+245*9)%(245*9)-70;
      if(dx2<-90||dx2>W+90)continue;
      var dh=52+((dm*31)%50), dw2=44+((dm*19)%30);
      var gd=ctx.createLinearGradient(dx2-dw2,SOL-dh,dx2+dw2,SOL);
      gd.addColorStop(0,'#b89468');gd.addColorStop(0.4,'#9a7448');gd.addColorStop(1,'#6e5230');
      ctx.fillStyle=gd;
      ctx.beginPath();
      ctx.moveTo(dx2-dw2,SOL-6);
      ctx.quadraticCurveTo(dx2-dw2*0.85,SOL-dh,dx2,SOL-dh);
      ctx.quadraticCurveTo(dx2+dw2*0.85,SOL-dh,dx2+dw2,SOL-6);
      ctx.closePath();ctx.fill();
      // strates horizontales
      ctx.strokeStyle='rgba(80,58,30,.4)';ctx.lineWidth=1.8;
      for(var sr=1;sr<=3;sr++){
        var sy2=SOL-6-(dh-6)*sr/4;
        ctx.beginPath();
        ctx.moveTo(dx2-dw2*(1-sr*0.16),sy2);ctx.lineTo(dx2+dw2*(1-sr*0.16),sy2);
        ctx.stroke();
      }
      // bloc posé au sommet
      if(dm%3===0){
        ctx.fillStyle='#a88558';
        ctx.beginPath();ctx.ellipse(dx2+6,SOL-dh-9,15,10,0.15,0,7);ctx.fill();
        ctx.strokeStyle='rgba(70,50,26,.5)';ctx.lineWidth=1.6;ctx.stroke();
      }
    }
  }else if(P.decor==='village'){
    // cases en banco avec toits de paille
    for(var vg=0;vg<11;vg++){
      var vx2=(vg*196-(cam*0.32)%(196*11)+196*11)%(196*11)-60;
      if(vx2<-80||vx2>W+80)continue;
      var vh=44+((vg*17)%26), vw2=30+((vg*11)%14);
      // mur
      var gv=ctx.createLinearGradient(vx2-vw2,0,vx2+vw2,0);
      gv.addColorStop(0,'#c49a5e');gv.addColorStop(0.45,'#a87c42');gv.addColorStop(1,'#7d5a2c');
      ctx.fillStyle=gv;
      ctx.fillRect(vx2-vw2,SOL-vh,vw2*2,vh);
      ctx.strokeStyle='rgba(70,48,20,.5)';ctx.lineWidth=1.6;
      ctx.strokeRect(vx2-vw2,SOL-vh,vw2*2,vh);
      // toit de paille conique
      ctx.fillStyle='#b8934a';
      ctx.beginPath();
      ctx.moveTo(vx2-vw2-8,SOL-vh);
      ctx.lineTo(vx2,SOL-vh-30);
      ctx.lineTo(vx2+vw2+8,SOL-vh);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(120,88,32,.55)';ctx.lineWidth=1.4;
      for(var pl=-2;pl<=2;pl++){
        ctx.beginPath();
        ctx.moveTo(vx2+pl*(vw2*0.42),SOL-vh);
        ctx.lineTo(vx2+pl*2,SOL-vh-28);
        ctx.stroke();
      }
      // porte
      ctx.fillStyle='rgba(60,38,14,.75)';
      ctx.beginPath();ctx.roundRect(vx2-6,SOL-vh*0.55,12,vh*0.55,2);ctx.fill();
      // grenier à mil à côté
      if(vg%3===1){
        var gx2=vx2+vw2+26;
        ctx.fillStyle='#b08046';
        ctx.beginPath();ctx.ellipse(gx2,SOL-16,13,17,0,0,7);ctx.fill();
        ctx.fillStyle='#b8934a';
        ctx.beginPath();
        ctx.moveTo(gx2-15,SOL-30);ctx.lineTo(gx2,SOL-46);ctx.lineTo(gx2+15,SOL-30);
        ctx.closePath();ctx.fill();
      }
    }
  }else if(P.decor==='dunes'){
    // vagues de sable superposées

var tempsJeu=0;
function decorGrotte(P){
  // voûte rocheuse en arrière-plan
  ctx.fillStyle='rgba(28,20,36,.85)';
  ctx.beginPath();ctx.moveTo(0,0);
  for(var vx=0;vx<=W;vx+=12){
    var w1=(vx+cam*0.10)*0.014;
    ctx.lineTo(vx,58+Math.sin(w1)*26+Math.sin(w1*2.7)*13);
  }
  ctx.lineTo(W,0);ctx.closePath();ctx.fill();

  // stalactites du plafond (parallaxe lente)
  for(var st=0;st<22;st++){
    var sx2=(st*72-(cam*0.30)%(72*22)+72*22)%(72*22)-30;
    if(sx2<-40||sx2>W+40)continue;
    var hs=26+((st*29)%46);
    var lg=7+((st*13)%7);
    ctx.fillStyle='rgba(52,38,66,.9)';
    ctx.beginPath();
    ctx.moveTo(sx2-lg,44);ctx.lineTo(sx2,44+hs);ctx.lineTo(sx2+lg,44);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(80,60,100,.5)';ctx.lineWidth=1.2;ctx.stroke();
    // goutte qui perle
    if(st%4===0){
      var gt=(tempsJeu*40+st*30)%160;
      if(gt<90){
        ctx.fillStyle='rgba(140,190,220,.55)';
        ctx.beginPath();ctx.arc(sx2,44+hs+gt*0.9,2.2,0,7);ctx.fill();
      }
    }
  }

  // torches accrochées à la paroi (parallaxe moyenne)
  for(var to=0;to<10;to++){
    var tx2=(to*180-(cam*0.55)%(180*10)+180*10)%(180*10)-40;
    if(tx2<-40||tx2>W+40)continue;
    var ty2=SOL-118;
    // support
    ctx.strokeStyle='#4a3a2a';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(tx2,ty2);ctx.lineTo(tx2,ty2+26);ctx.stroke();
    // halo
    var vac=0.75+Math.sin(tempsJeu*7+to*2)*0.25;
    var hal=ctx.createRadialGradient(tx2,ty2-4,3,tx2,ty2-4,78*vac);
    hal.addColorStop(0,'rgba(255,170,60,.30)');
    hal.addColorStop(0.5,'rgba(255,140,40,.10)');
    hal.addColorStop(1,'rgba(255,120,30,0)');
    ctx.fillStyle=hal;
    ctx.beginPath();ctx.arc(tx2,ty2-4,78*vac,0,7);ctx.fill();
    // flamme
    var fh=16+Math.sin(tempsJeu*9+to)*4;
    var gf=ctx.createLinearGradient(tx2,ty2-fh,tx2,ty2+4);
    gf.addColorStop(0,'#fff0a0');gf.addColorStop(0.45,'#ff9a2a');gf.addColorStop(1,'#d43a08');
    ctx.fillStyle=gf;
    ctx.beginPath();
    ctx.moveTo(tx2,ty2-fh);
    ctx.quadraticCurveTo(tx2+7,ty2-fh*0.35,tx2+4,ty2+3);
    ctx.lineTo(tx2-4,ty2+3);
    ctx.quadraticCurveTo(tx2-7,ty2-fh*0.35,tx2,ty2-fh);
    ctx.closePath();ctx.fill();
  }

  // parois rocheuses de fond (2 couches)
  ctx.fillStyle=P.collines[0];
  ctx.beginPath();ctx.moveTo(0,SOL);
  for(var r1=0;r1<=W;r1+=16){
    var q1=(r1+cam*0.08)*0.010;
    ctx.lineTo(r1,SOL-88+Math.sin(q1)*20+Math.sin(q1*3.1)*11);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.fillStyle=P.collines[1];
  ctx.beginPath();ctx.moveTo(0,SOL);
  for(var r2=0;r2<=W;r2+=16){
    var q2=(r2+cam*0.16)*0.013;
    ctx.lineTo(r2,SOL-48+Math.sin(q2)*16+Math.sin(q2*2.3)*8);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  // cristaux luminescents au sol
  for(var cr=0;cr<14;cr++){
    var cx2=(cr*128-(cam*0.62)%(128*14)+128*14)%(128*14)-30;
    if(cx2<-30||cx2>W+30)continue;
    var ch=14+((cr*17)%18);
    var pul=0.6+Math.sin(tempsJeu*3+cr)*0.35;
    ctx.save();
    ctx.globalAlpha=pul;
    var gcr=ctx.createLinearGradient(cx2,SOL-ch,cx2,SOL);
    gcr.addColorStop(0,'#8ee0e8');gcr.addColorStop(1,'#2a6a80');
    ctx.fillStyle=gcr;
    ctx.beginPath();
    ctx.moveTo(cx2,SOL-ch);ctx.lineTo(cx2+5,SOL-4);ctx.lineTo(cx2-5,SOL-4);
    ctx.closePath();ctx.fill();
    ctx.globalAlpha=pul*0.28;
    ctx.fillStyle='#8ee0e8';
    ctx.beginPath();ctx.arc(cx2,SOL-ch*0.5,16,0,7);ctx.fill();
    ctx.restore();
  }
}
function nuage(x,y,e,op){

    ctx.beginPath();ctx.arc(b[0],b[1],b[2],0,7);ctx.fill();
  });
  ctx.fillStyle='rgba(215,235,245,.55)';
  ctx.beginPath();ctx.ellipse(2,11,32,7,0,0,7);ctx.fill();
  ctx.restore();
}
function oiseau(x,y,e){

  ctx.beginPath();

  ctx.quadraticCurveTo(4,-5-bat,9,0);

  ctx.lineTo(9,-62);ctx.quadraticCurveTo(13,-40,20,0);
  ctx.closePath();ctx.fill();
  [[-30,-80,15],[30,-80,15],[-11,-92,16],[13,-92,16],[0,-100,17]].forEach(function(b){
    ctx.beginPath();ctx.arc(b[0],b[1],b[2],0,7);ctx.fill();
  });

function dessinerBoss(){
  var B=BOSS[boss.type];
  var bx=boss.x, by=boss.y+boss.yOff;
  var dir=boss.vx>0?1:-1;
  if(boss.invuln>0&&Math.floor(boss.invuln/5)%2===0)return;
  ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath();ctx.ellipse(bx,boss.y+3,boss.w*0.48,7,0,0,7);ctx.fill();
  if(boss.type==='buffle'){dessinerBuffleRoi(bx,by,dir,B);barreVieBoss(bx,by,B);return;}
  if(boss.type==='brigand'){dessinerBrigand(bx,by,dir,B);barreVieBoss(bx,by,B);return;}
  ctx.save();
  ctx.translate(bx,by);
  ctx.scale(dir,1);
  var s=boss.w/76;
  // corps
  var g=ctx.createRadialGradient(-8*s,-30*s,4*s,0,-24*s,40*s);
  g.addColorStop(0,'#b8551e');g.addColorStop(0.55,B.couleur);g.addColorStop(1,B.couleur2);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(0,-22*s,34*s,19*s,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(40,12,2,.6)';ctx.lineWidth=2.4;ctx.stroke();
  // segments de carapace
  ctx.strokeStyle='rgba(50,16,4,.45)';ctx.lineWidth=2;
  for(var sg=-2;sg<=2;sg++){
    ctx.beginPath();
    ctx.moveTo(sg*11*s,-38*s);ctx.quadraticCurveTo(sg*12*s,-22*s,sg*10*s,-6*s);
    ctx.stroke();
  }
  // queue segmentée, dressée
  var haut=(boss.phase==='repos')?0.45:1;
  ctx.strokeStyle=B.couleur;ctx.lineWidth=9*s;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(28*s,-26*s);
  ctx.quadraticCurveTo(56*s*haut,-44*s*haut,48*s*haut,-72*s*haut);
  ctx.stroke();
  ctx.strokeStyle='rgba(50,16,4,.4)';ctx.lineWidth=2;
  for(var q=0;q<3;q++){
    var t2=(q+1)/4;
    var qx=28*s+(48*s*haut-28*s)*t2, qy=-26*s+(-72*s*haut+26*s)*t2;
    ctx.beginPath();ctx.arc(qx,qy,5*s,0,7);ctx.stroke();
  }
  // dard
  ctx.fillStyle='#d4772a';
  ctx.beginPath();ctx.arc(48*s*haut,-74*s*haut,8*s,0,7);ctx.fill();
  ctx.strokeStyle='rgba(40,12,2,.6)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#f0d090';
  ctx.beginPath();
  ctx.moveTo(48*s*haut,-82*s*haut);ctx.lineTo(53*s*haut,-92*s*haut);ctx.lineTo(43*s*haut,-90*s*haut);
  ctx.closePath();ctx.fill();
  // pinces
  ctx.strokeStyle=B.couleur;ctx.lineWidth=7*s;
  [[-30,-26,-52,-34],[-30,-18,-52,-10]].forEach(function(pz){
    ctx.beginPath();ctx.moveTo(pz[0]*s,pz[1]*s);ctx.lineTo(pz[2]*s,pz[3]*s);ctx.stroke();
    ctx.fillStyle='#a8451a';
    ctx.beginPath();ctx.ellipse(pz[2]*s,pz[3]*s,9*s,6*s,-0.4,0,7);ctx.fill();
    ctx.strokeStyle='rgba(40,12,2,.5)';ctx.lineWidth=1.8;ctx.stroke();
    ctx.strokeStyle=B.couleur;ctx.lineWidth=7*s;
  });
  // pattes
  ctx.strokeStyle=B.couleur2;ctx.lineWidth=4*s;
  for(var pa=-2;pa<=2;pa++){
    ctx.beginPath();
    ctx.moveTo(pa*11*s,-8*s);ctx.lineTo(pa*13*s-4*s,2*s);
    ctx.stroke();
  }
  // yeux
  ctx.fillStyle='#ffe14a';
  ctx.beginPath();ctx.arc(-16*s,-32*s,4.5*s,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(-6*s,-34*s,4.5*s,0,7);ctx.fill();
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.arc(-16*s,-32*s,2.2*s,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(-6*s,-34*s,2.2*s,0,7);ctx.fill();
  ctx.restore();

  barreVieBoss(bx,by,B);
}

  ctx.strokeStyle='rgba(140,95,5,.7)';ctx.lineWidth=1.6;ctx.stroke();
  ctx.fillStyle='#E32219';
  ctx.beginPath();ctx.arc(-25*s,-68*s,3*s,0,7);ctx.fill();
  // œil
  ctx.fillStyle='#ffe14a';
  ctx.beginPath();ctx.arc(-34*s,-46*s,5.5*s,0,7);ctx.fill();
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.arc(-35*s,-46*s,2.6*s,0,7);ctx.fill();
  // dents
  ctx.fillStyle='#fffbe8';
  ctx.beginPath();
  ctx.moveTo(-48*s,-33*s);ctx.lineTo(-45*s,-25*s);ctx.lineTo(-42*s,-33*s);
  ctx.closePath();ctx.fill();
  // pattes
  ctx.strokeStyle=B.couleur2;ctx.lineWidth=7*s;
  [[-16,-4],[8,-4],[24,-4]].forEach(function(pt){
    ctx.beginPath();ctx.moveTo(pt[0]*s,pt[1]*s);ctx.lineTo(pt[0]*s-3*s,4*s);ctx.stroke();
  });
  ctx.restore();
}
function dessinerBrigand(bx,by,dir,B){
  ctx.save();ctx.translate(bx,by);ctx.scale(dir,1);
  var s=boss.w/70;
  // jambes
  ctx.strokeStyle='#241428';ctx.lineWidth=8*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-8*s,-26*s);ctx.lineTo(-11*s,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8*s,-26*s);ctx.lineTo(11*s,0);ctx.stroke();
  // grand boubou
  var g=ctx.createLinearGradient(-24*s,-70*s,24*s,-20*s);
  g.addColorStop(0,'#6a4080');g.addColorStop(0.5,B.couleur);g.addColorStop(1,B.couleur2);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-14*s,-66*s);ctx.lineTo(14*s,-66*s);
  ctx.lineTo(26*s,-18*s);ctx.lineTo(-26*s,-18*s);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(20,8,28,.6)';ctx.lineWidth=2.2;ctx.stroke();
  // motifs sur le boubou
  ctx.strokeStyle='rgba(245,194,27,.5)';ctx.lineWidth=2;
  for(var m=0;m<3;m++){
    ctx.beginPath();
    ctx.moveTo(-20*s+m*14*s,-56*s);ctx.lineTo(-16*s+m*14*s,-26*s);ctx.stroke();
  }
  // bras
  ctx.strokeStyle=B.couleur;ctx.lineWidth=7*s;
  ctx.beginPath();ctx.moveTo(-13*s,-58*s);ctx.lineTo(-27*s,-40*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(13*s,-58*s);ctx.lineTo(28*s,-46*s);ctx.stroke();
  // main qui tient un caillou
  ctx.fillStyle='#7d5527';
  ctx.beginPath();ctx.arc(28*s,-46*s,6*s,0,7);ctx.fill();
  if(boss.phase==='lancer'){
    ctx.fillStyle='#8a8578';
    ctx.beginPath();ctx.arc(34*s,-50*s,5*s,0,7);ctx.fill();
  }
  // tête
  ctx.fillStyle='#7d5527';
  ctx.beginPath();ctx.arc(0,-76*s,13*s,0,7);ctx.fill();
  // LE MASQUE SACRÉ volé, porté sur le visage
  var gm=ctx.createLinearGradient(-11*s,-88*s,11*s,-64*s);
  gm.addColorStop(0,'#d8a860');gm.addColorStop(1,'#8a6030');
  ctx.fillStyle=gm;
  ctx.beginPath();
  ctx.moveTo(0,-92*s);
  ctx.quadraticCurveTo(13*s,-84*s,11*s,-70*s);
  ctx.quadraticCurveTo(6*s,-60*s,0,-62*s);
  ctx.quadraticCurveTo(-6*s,-60*s,-11*s,-70*s);
  ctx.quadraticCurveTo(-13*s,-84*s,0,-92*s);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(60,38,12,.7)';ctx.lineWidth=2;ctx.stroke();
  // yeux du masque
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.ellipse(-5*s,-79*s,3*s,4.5*s,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(5*s,-79*s,3*s,4.5*s,0,0,7);ctx.fill();
  // motifs gravés
  ctx.strokeStyle='rgba(70,42,14,.65)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(0,-88*s);ctx.lineTo(0,-70*s);ctx.stroke();
  for(var z=0;z<3;z++){
    ctx.beginPath();
    ctx.moveTo(-8*s,-84*s+z*6*s);ctx.lineTo(-4*s,-82*s+z*6*s);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(8*s,-84*s+z*6*s);ctx.lineTo(4*s,-82*s+z*6*s);ctx.stroke();
  }
  // coiffe
  ctx.fillStyle='#3a2048';
  ctx.beginPath();ctx.ellipse(0,-90*s,15*s,7*s,0,Math.PI,0);ctx.fill();
  ctx.restore();
}
function dessinerAkim(){
  var k=akim;
  if(invincible>0&&Math.floor(invincible/6)%2===0)return; // clignotement

  // --- Aura des pouvoirs actifs ---
  var auras=[];
  if(pouvoirActif('griot'))auras.push({c:'#b47ae0',r:34});
  if(pouvoirActif('grigri'))auras.push({c:'#F5C21B',r:29});
  if(pouvoirActif('ailes'))auras.push({c:'#6ec8e8',r:26});
  auras.forEach(function(a,idx){
    var t=actifs[idx===0&&pouvoirActif('griot')?'griot':(pouvoirActif('grigri')?'grigri':'ailes')]||0;
    var pulse=1+Math.sin(tempsJeu*6+idx)*0.09;
    var alpha=(t<180&&Math.floor(tempsJeu*8)%2===0)?0.15:0.32;
    var ga=ctx.createRadialGradient(k.x,k.y,a.r*0.35,k.x,k.y,a.r*pulse);
    ga.addColorStop(0,'rgba(0,0,0,0)');
    ga.addColorStop(0.65,a.c.replace('#','rgba(').length?a.c:a.c);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.strokeStyle=a.c;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(k.x,k.y,a.r*pulse,0,7);ctx.stroke();
    ctx.globalAlpha=alpha*0.4;
    ctx.fillStyle=a.c;
    ctx.beginPath();ctx.arc(k.x,k.y,a.r*pulse,0,7);ctx.fill();
    ctx.restore();
  });
  // étoiles tournantes pour le bâton de griot
  if(pouvoirActif('griot')){
    for(var et=0;et<3;et++){
      var ang=tempsJeu*3+et*(Math.PI*2/3);
      var ex=k.x+Math.cos(ang)*32, ey=k.y+Math.sin(ang)*22;
      ctx.fillStyle='#e0b8ff';
      ctx.save();ctx.translate(ex,ey);ctx.rotate(ang*2);
      ctx.beginPath();
      for(var br=0;br<5;br++){
        var a1=br*Math.PI*2/5-Math.PI/2;
        var a2=a1+Math.PI/5;
        ctx.lineTo(Math.cos(a1)*6,Math.sin(a1)*6);
        ctx.lineTo(Math.cos(a2)*2.6,Math.sin(a2)*2.6);
      }
      ctx.closePath();ctx.fill();
      ctx.restore();
    }
  }

  ctx.save();
  ctx.translate(k.x,k.y);
  ctx.scale(k.regard,1);
  // ombre
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath();ctx.ellipse(0,k.h*0.5+3,13,4,0,0,7);ctx.fill();
  var course=k.sol&&Math.abs(k.vx)>0.4;
  var bal=course?Math.sin(k.anim)*4:0;
  // jambes
  ctx.strokeStyle='#2b3a6b';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-3,6);ctx.lineTo(-4-bal*0.6,16);ctx.stroke();
  ctx.beginPath();ctx.moveTo(3,6);ctx.lineTo(4+bal*0.6,16);ctx.stroke();
  // chaussures
  ctx.strokeStyle='#1a1a18';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-4-bal*0.6,16);ctx.lineTo(-1-bal*0.6,17);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4+bal*0.6,16);ctx.lineTo(7+bal*0.6,17);ctx.stroke();
  // torse (maillot vert)
  var gt=ctx.createLinearGradient(-8,-8,8,8);
  gt.addColorStop(0,'#18a04f');gt.addColorStop(1,'#0b5c2c');
  ctx.fillStyle=gt;
  ctx.beginPath();ctx.roundRect(-8,-8,16,16,4);ctx.fill();
  // bande jaune
  ctx.fillStyle='#F5C21B';
  ctx.fillRect(-8,-3,16,3.5);
  // bras
  ctx.strokeStyle='#a8763f';ctx.lineWidth=4.5;
  ctx.beginPath();ctx.moveTo(-6,-5);ctx.lineTo(-11+bal*0.5,1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6,-5);ctx.lineTo(11-bal*0.5,1);ctx.stroke();
  // tête
  var gh=ctx.createRadialGradient(-2,-16,2,0,-14,9);
  gh.addColorStop(0,'#b8834a');gh.addColorStop(1,'#7d5527');
  ctx.fillStyle=gh;
  ctx.beginPath();ctx.arc(0,-14,8,0,7);ctx.fill();
  // cheveux
  ctx.fillStyle='#1a1410';
  ctx.beginPath();ctx.arc(0,-17,8,Math.PI,0);ctx.fill();
  // œil
  ctx.fillStyle='#12130F';
  ctx.beginPath();ctx.arc(4,-14,1.7,0,7);ctx.fill();
  // sourire
  ctx.strokeStyle='#5c3a1a';ctx.lineWidth=1.3;
  ctx.beginPath();ctx.arc(3,-11,3,0.2,1.2);ctx.stroke();
  ctx.restore();
}

// ================= COMMANDES =================
function presser(el,set){
  el.addEventListener('touchstart',function(e){set(true);e.preventDefault();},{passive:false});
  el.addEventListener('touchend',function(e){set(false);e.preventDefault();},{passive:false});
  el.addEventListener('mousedown',function(){set(true);});
  window.addEventListener('mouseup',function(){set(false);});
}
presser($('bGauche'),function(v){gauche=v;});
presser($('bDroite'),function(v){droite=v;});
$('btnTirer').addEventListener('touchstart',function(e){tirerCaillou();e.preventDefault();},{passive:false});
$('btnTirer').addEventListener('mousedown',function(){tirerCaillou();});
$('bSaut').addEventListener('touchstart',function(e){sautDemande=true;e.preventDefault();},{passive:false});
$('bSaut').addEventListener('mousedown',function(){sautDemande=true;});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')gauche=true;
  if(e.key==='ArrowRight')droite=true;
  if(e.key===' '||e.key==='ArrowUp'){sautDemande=true;e.preventDefault();}
  if(e.key==='x'||e.key==='X'){tirerCaillou();}
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')gauche=false;
  if(e.key==='ArrowRight')droite=false;
});
function majBoutons(){
  var p=PARCOURS[niveauIdx];
  $('nivMonde').textContent=p.monde;
  $('nivNom').textContent=p.num+'. '+p.nom;
  $('nivPrec').disabled=(niveauIdx<=0);
  $('nivSuiv').disabled=(niveauIdx>=Math.min(PARCOURS.length-1,maxDebloque));
  // pastilles de progression
  var h='';
  for(var i=0;i<PARCOURS.length;i++){
    var cls='past';
    if(i<maxDebloque)cls+=' fait';
    if(i>maxDebloque)cls+=' verrou';
    if(i===niveauIdx)cls+=' actif';
    h+='<div class="'+cls+'"></div>';
  }
  $('pastilles').innerHTML=h;
}
function allerNiveau(i){
  if(i<0||i>=PARCOURS.length)return;
  if(i>maxDebloque)return;   // pas encore débloqué
  niveauIdx=i;
  try{localStorage.setItem('fasogames_akim_niveau',i);}catch(e){}
  reset(true);
}
$('nivPrec').addEventListener('click',function(){allerNiveau(niveauIdx-1);});
$('nivSuiv').addEventListener('click',function(){allerNiveau(niveauIdx+1);});
$('suivant').addEventListener('click',function(){
  if(niveauIdx+1<PARCOURS.length)allerNiveau(niveauIdx+1);
});
$('rejouer').addEventListener('click',function(){reset(true);});

window.__akim={
  state:function(){return {x:Math.round(akim.x),y:Math.round(akim.y),vies:vies,cauris:nbCauris,

  allerNiveau:function(i){allerNiveau(i);},
  debloquerTout:function(){maxDebloque=PARCOURS.length-1;majBoutons();},

  terriers:function(){
    return {total:terriers.length,
      etats:terriers.reduce(function(a,t){a[t.etat]=(a[t.etat]||0)+1;return a;},{}),
      proche:terriers.filter(function(t){return Math.abs(t.x-akim.x)<300;})
        .map(function(t){return {x:Math.round(t.x),etat:t.etat};}).slice(0,3)};
  },
  ennemisDetail:function(){
    var t={};
    ennemis.filter(function(e){return e.vivant;}).forEach(function(e){t[e.type]=(t[e.type]||0)+1;});
    return {types:t,total:ennemis.filter(function(e){return e.vivant;}).length,flammes:flammes.length};
  },
  boss:function(){return boss?{pv:boss.pv,pvMax:boss.pvMax,phase:boss.phase,
    mort:boss.mort,x:Math.round(boss.x),type:boss.type}:null;},
  frapperBoss:function(){toucherBoss(1);},
  progression:function(){return {niveau:niveauIdx+1,total:PARCOURS.length,
    monde:PARCOURS[niveauIdx].monde,nom:PARCOURS[niveauIdx].nom,
    maxDebloque:maxDebloque+1,cumul:scoreCumule};},
  teleporter:function(x){akim.x=x;akim.y=SOL-56;akim.vy=0;},
  forcerFin:function(w){terminer(!!w);},



  donnerPouvoir:function(k){donnerPouvoir(k);},
  tirer:function(){tirerCaillou();},
  pouvoirs:function(){return {actifs:Object.keys(actifs).map(function(k){return k+':'+Math.ceil(actifs[k]/60)+'s';}),
    lancePierre:aLancePierre, munitions:munitions, cailloux:cailloux.length,
    affichesHUD:document.querySelectorAll('.pw').length};}


};

var last=0;
function loop(now){
  var dt=Math.min(2.5,(now-last)/16.7);last=now;
  step(dt);draw();
  requestAnimationFrame(loop);
}
resize();reset(true);
requestAnimationFrame(loop);
})();
