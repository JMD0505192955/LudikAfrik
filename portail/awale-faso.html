<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Awalé Faso</title>
<style>
  :root{
    --vert:#0E7A3C; --vert-fonce:#0A5C2D; --rouge:#E32219; --or:#F5C21B;
    --nuit:#12130F; --craie:#FAF7EF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--nuit);
    font-family:"Arial Black","Segoe UI",Arial,sans-serif;
    color:var(--craie);
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  header{
    width:100%;max-width:430px;padding:12px 16px 8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{font-size:20px;letter-spacing:1px;line-height:1;}
  .logo span{color:var(--or);}
  .logo small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:9px;letter-spacing:3px;color:#8b8f84;margin-top:3px;}
  .marque{display:flex;align-items:center;gap:8px;font-size:22px;}
  .marque .toi{color:var(--or);}
  .marque .sep{color:#57594f;font-size:16px;}
  .marque .ia{color:#c9ccc0;}
  #msg{height:26px;font-size:14px;letter-spacing:.5px;text-align:center;color:var(--or);}
  #wrap{position:relative;width:100%;max-width:430px;flex:1;display:flex;justify-content:center;padding:0 12px 4px;}
  canvas{display:block;border-radius:14px;}
  #fin{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,19,15,.88);text-align:center;padding:24px;border-radius:14px;
  }
  #fin h2{font-size:30px;color:var(--or);margin-bottom:6px;}
  #fin p{font-family:Arial,sans-serif;font-size:14px;color:#c9ccc0;margin-bottom:20px;line-height:1.5;}
  #fin button{
    font-family:inherit;font-size:16px;letter-spacing:1px;color:var(--nuit);
    background:var(--or);border:none;border-radius:999px;padding:14px 34px;
  }
  #fin button:active{transform:scale(.96);}
  footer{
    width:100%;max-width:430px;padding:8px 16px 14px;text-align:center;
    font-family:Arial,sans-serif;font-size:11px;color:#6c7064;letter-spacing:.5px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">AWALÉ <span>FASO</span><small>PREMIER À 25 GRAINES</small></div>
  <div style="display:flex;align-items:center;gap:0"><button id="btnSon" style="background:none;border:1px solid #57594f;color:var(--craie);border-radius:999px;width:32px;height:32px;font-size:14px;margin-right:8px">🔊</button>
<div class="marque"><span class="toi" id="sToi">0</span><span class="sep">—</span><span class="ia" id="sIa">0</span></div>
</div>
</header>
<div id="msg">Touche une de tes cases pour semer 🌱</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="fin">
    <h2 id="finTitre"></h2>
    <p id="finTexte"></p>
    <button id="rejouer">REJOUER</button>
  </div>
</div>
<footer>Démo VAS — classement hebdo &amp; lots airtime à venir</footer>

// ===== Kit sonore Faso Games (synthétisé, 0 Ko d'assets, silencieux par défaut respecté) =====
var SFX=(function(){
  var ctx,muet=false;
  try{muet=localStorage.getItem('fasogames_mute')==='1';}catch(e){}
  function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
  function tone(freq,dur,type,vol,glide){
    if(muet)return;
    try{
      var c=ac();var o=c.createOscillator();var g=c.createGain();
      o.type=type||'sine';o.frequency.value=freq;
      if(glide)o.frequency.linearRampToValueAtTime(glide,c.currentTime+dur);
      g.gain.value=vol||0.15;
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+dur);
    }catch(e){}
  }
  return{
    tap:function(){tone(440,0.05,'square',0.08);},
    bon:function(){tone(523,0.09,'sine',0.14);setTimeout(function(){tone(784,0.12,'sine',0.14);},70);},
    mauvais:function(){tone(160,0.22,'sawtooth',0.12,90);},
    victoire:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'sine',0.15);},i*90);});},
    defaite:function(){[392,330,262].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'sine',0.12);},i*120);});},
    piece:function(){tone(988,0.08,'triangle',0.12,1400);},
    tick:function(){tone(300,0.03,'square',0.05);},
    estMuet:function(){return muet;},
    toggle:function(){muet=!muet;try{localStorage.setItem('fasogames_mute',muet?'1':'0');}catch(e){}return muet;}
  };
})();
// Bouton mute (à placer dans le header de chaque jeu)
function initBoutonSon(id){
  var b=document.getElementById(id);
  if(!b)return;
  function maj(){b.textContent=SFX.estMuet()?'🔇':'🔊';}
  maj();
  b.addEventListener('click',function(){SFX.toggle();maj();});
}
// Confetti simple (petites particules colorées, pour les écrans de victoire)
function confetti(canvas,ctx,cx,cy){
  var parts=[];
  var couleurs=['#F5C21B','#E32219','#0E7A3C','#3d5a80','#FAF7EF'];
  for(var i=0;i<24;i++){
    var a=Math.random()*Math.PI*2,v=2+Math.random()*3;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:0.12,vie:1,col:couleurs[i%couleurs.length],taille:3+Math.random()*3});
  }
  return parts;
}
function drawConfetti(ctx,parts,dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=0.018*dt;
    if(p.vie<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.vie);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.taille/2,p.y-p.taille/2,p.taille,p.taille);
    ctx.globalAlpha=1;
  }
}

// ===== Kit visuel Faso Games : profondeur, particules, impact =====
var VFX=(function(){
  var shake={t:0,force:0}, particules=[], flashes=[];
  function secousse(force,duree){shake.force=force;shake.t=duree||12;}
  function appliquerSecousse(ctx,dt){
    if(shake.t<=0)return false;
    shake.t-=dt;
    var f=shake.force*(shake.t/12);
    ctx.save();
    ctx.translate((Math.random()-0.5)*f,(Math.random()-0.5)*f);
    return true;
  }
  function particule(x,y,opts){
    opts=opts||{};
    var n=opts.n||12;
    for(var i=0;i<n;i++){
      var a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;
      var v=(opts.vitesse||3)*(0.5+Math.random());
      particules.push({
        x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
        g:opts.gravite!==undefined?opts.gravite:0.12,
        vie:1,decl:opts.decl||0.025,
        taille:(opts.taille||4)*(0.6+Math.random()*0.8),
        col:opts.col||'#F5C21B',
        forme:opts.forme||'rond'
      });
    }
  }
  function flash(col,duree){flashes.push({col:col||'#FFFFFF',vie:1,decl:1/(duree||10)});}
  function maj(ctx,dt,W,H){
    for(var i=particules.length-1;i>=0;i--){
      var p=particules[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vie-=p.decl*dt;
      if(p.vie<=0){particules.splice(i,1);continue;}
      ctx.globalAlpha=Math.max(0,p.vie);
      ctx.fillStyle=p.col;
      if(p.forme==='carre'){ctx.fillRect(p.x-p.taille/2,p.y-p.taille/2,p.taille,p.taille);}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.taille*p.vie,0,7);ctx.fill();}
      ctx.globalAlpha=1;
    }
    for(var j=flashes.length-1;j>=0;j--){
      var f=flashes[j];
      f.vie-=f.decl*dt;
      if(f.vie<=0){flashes.splice(j,1);continue;}
      ctx.globalAlpha=f.vie*0.5;
      ctx.fillStyle=f.col;ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=1;
    }
  }
  function reset(){particules=[];flashes=[];shake.t=0;}
  return {secousse:secousse,appliquerSecousse:appliquerSecousse,particule:particule,flash:flash,maj:maj,reset:reset,
    nbParticules:function(){return particules.length;}};
})();
// Helpers de rendu enrichi
function ombrePortee(ctx,blur,coul,dx,dy){
  ctx.shadowBlur=blur;ctx.shadowColor=coul||'rgba(0,0,0,.5)';
  ctx.shadowOffsetX=dx||0;ctx.shadowOffsetY=dy||3;
}
function sansOmbre(ctx){ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}
function degradeVertical(ctx,x,y,w,h,c1,c2){
  var g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,c1);g.addColorStop(1,c2);return g;
}
function degradeRadial(ctx,x,y,r,c1,c2){
  var g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c1);g.addColorStop(1,c2);return g;
}

  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cvs.parentElement.getBoundingClientRect();
  W=r.width-24; H=r.height-8;
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  cvs.width=W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layoutPits();
}
window.addEventListener('resize',resize);

// ---- État ----
let pits, storeToi=0, storeIa=0;
let phase='player'; // player | anim | ai | over
let anim=null, flash=[], flashT=0, lastMovePit=-1;
let pitPos=[]; // positions écran des 12 cases

function reset(){
  pits=new Array(12).fill(4);
  storeToi=0; storeIa=0;
  sToi.textContent='0'; sIa.textContent='0';
  phase='player'; anim=null; flash=[]; lastMovePit=-1;
  msg.textContent="Touche une de tes cases pour semer 🌱";
}

function layoutPits(){
  pitPos=[];
  const bw=W-22, cell=bw/6;
  const R=Math.min(cell*0.475, H*0.088); // creux plus larges, presque jointifs
  const yBas=H*0.655, yHaut=H*0.345;
  for(let i=0;i<6;i++)  pitPos[i]  ={x:11+cell*(i+0.5), y:yBas,  r:R}; // joueur : gauche→droite
  for(let i=0;i<6;i++)  pitPos[6+i]={x:11+cell*(5-i+0.5), y:yHaut, r:R}; // IA : 6 à droite → 11 à gauche (cercle anti-horaire)
}

// ---- Règles ----
function simSow(p0, start){
  const p=p0.slice();
  let seeds=p[start]; p[start]=0;
  let i=start; const seq=[];
  while(seeds>0){
    i=(i+1)%12;
    if(i===start) continue; // on saute la case d'origine (tours >= 12 graines)
    p[i]++; seeds--; seq.push(i);
  }
  return {p, last:i, seq};
}

function computeCapture(p, last, side){ // side 0 = joueur, 1 = IA
  const lo=side===0?6:0, hi=side===0?11:5;
  let i=last; const capIdx=[];
  while(i>=lo&&i<=hi&&(p[i]===2||p[i]===3)){ capIdx.push(i); i--; }
  if(capIdx.length===0) return {captured:0,capIdx:[]};
  // règle du "grand chelem" : on ne peut pas affamer l'adversaire
  let remaining=0;
  for(let j=lo;j<=hi;j++) if(!capIdx.includes(j)) remaining+=p[j];
  if(remaining===0) return {captured:0,capIdx:[]};
  let captured=0;
  for(const j of capIdx){captured+=p[j];p[j]=0;}
  return {captured,capIdx};
}

function legalMoves(p, side){
  const lo=side===0?0:6, hi=side===0?5:11;
  const oppLo=side===0?6:0, oppHi=side===0?11:5;
  let oppSeeds=0; for(let i=oppLo;i<=oppHi;i++)oppSeeds+=p[i];
  const moves=[];
  for(let i=lo;i<=hi;i++){
    if(p[i]===0)continue;
    if(oppSeeds===0){
      // obligation de nourrir l'adversaire si possible
      const {seq}=simSow(p,i);
      if(!seq.some(j=>j>=oppLo&&j<=oppHi))continue;
    }
    moves.push(i);
  }
  return moves;
}

// ---- IA : minimax alpha-beta ----
function evalState(p, sT, sI){
  let bT=0,bI=0;
  for(let i=0;i<6;i++)bT+=p[i];
  for(let i=6;i<12;i++)bI+=p[i];
  // menace : cases adverses à 1 ou 2 graines (capturables)
  let vulT=0,vulI=0;
  for(let i=0;i<6;i++) if(p[i]===1||p[i]===2)vulT++;
  for(let i=6;i<12;i++) if(p[i]===1||p[i]===2)vulI++;
  return (sI-sT)*10 + (bI-bT)*0.5 + (vulT-vulI)*0.8;
}

function minimax(p, sT, sI, side, depth, alpha, beta){
  if(sT>=25) return -1000-depth;
  if(sI>=25) return 1000+depth;
  if(depth===0) return evalState(p,sT,sI);
  const moves=legalMoves(p,side);
  if(moves.length===0){
    // fin : chacun ramasse sa rangée
    let bT=0,bI=0;
    for(let i=0;i<6;i++)bT+=p[i];
    for(let i=6;i<12;i++)bI+=p[i];
    return evalState(new Array(12).fill(0), sT+bT, sI+bI);
  }
  if(side===1){ // IA maximise
    let best=-Infinity;
    for(const m of moves){
      const {p:np,last}=simSow(p,m);
      const {captured}=computeCapture(np,last,1);
      const v=minimax(np,sT,sI+captured,0,depth-1,alpha,beta);
      best=Math.max(best,v); alpha=Math.max(alpha,v);
      if(beta<=alpha)break;
    }
    return best;
  }else{
    let best=Infinity;
    for(const m of moves){
      const {p:np,last}=simSow(p,m);
      const {captured}=computeCapture(np,last,0);
      const v=minimax(np,sT+captured,sI,1,depth-1,alpha,beta);
      best=Math.min(best,v); beta=Math.min(beta,v);
      if(beta<=alpha)break;
    }
    return best;
  }
}

function aiChoose(){
  const moves=legalMoves(pits,1);
  if(moves.length===0)return -1;
  let best=-Infinity, choice=moves[0];
  for(const m of moves){
    const {p:np,last}=simSow(pits,m);
    const {captured}=computeCapture(np,last,1);
    const v=minimax(np,storeToi,storeIa+captured,0,4,-Infinity,Infinity)
            + Math.random()*0.3; // légère variété
    if(v>best){best=v;choice=m;}
  }
  return choice;
}

// ---- Déroulé d'un coup (avec animation de semis) ----
function playMove(pit, side){
  phase='anim';
  lastMovePit=pit;
  const {seq}=simSow(pits,pit);
  let hand=pits[pit];
  pits[pit]=0;
  let k=0;
  anim={
    hand, pit,
    timer:0,
    step(dt){
      this.timer-=dt;
      if(this.timer<=0){
        if(k<seq.length){
          pits[seq[k]]++;
          this.hand--;
          k++;
          this.timer=11; // ~180 ms
        }else{
          finishMove(seq[seq.length-1], side);
        }
      }
    }
  };
}

function finishMove(last, side){
  anim=null;
  const {captured,capIdx}=computeCapture(pits,last,side);
  if(captured>0){
    flash=capIdx.slice(); flashT=30;
    // gerbe de graines qui jaillit de chaque case capturée
    capIdx.forEach(function(idx){
      const P=pitPos[idx];
      if(!P)return;
      VFX.particule(P.x,P.y,{n:8,vitesse:3.4,taille:4.2,gravite:0.14,decl:0.022,
        col:side===0?'#F5C21B':'#E32219'});
      VFX.particule(P.x,P.y,{n:5,vitesse:2.6,taille:3.4,gravite:0.16,decl:0.026,col:'#e8e2d2'});
    });
    if(side===0){storeToi+=captured;sToi.textContent=storeToi;
      msg.textContent="✨ Tu captures "+captured+" graines !";SFX.bon();
      VFX.secousse(Math.min(8,3+captured),12);VFX.flash('#F5C21B',18);}
    else{storeIa+=captured;sIa.textContent=storeIa;
      msg.textContent="😤 L'IA capture "+captured+" graines...";SFX.mauvais();
      VFX.secousse(Math.min(7,2+captured),10);}
  }
  setTimeout(()=>{
    flash=[];
    nextTurn(side===0?1:0);
  }, captured>0?600:150);
}

function nextTurn(side){
  if(storeToi>=25||storeIa>=25)return endGame();
  const moves=legalMoves(pits,side);
  if(moves.length===0){
    // plus de coup possible : chacun ramasse sa rangée
    for(let i=0;i<6;i++){storeToi+=pits[i];pits[i]=0;}
    for(let i=6;i<12;i++){storeIa+=pits[i];pits[i]=0;}
    sToi.textContent=storeToi; sIa.textContent=storeIa;
    return endGame();
  }
  if(side===0){
    phase='player';
    if(!msg.textContent.includes('capture'))msg.textContent="À toi de semer 🌱";
  }else{
    phase='ai';
    msg.textContent="L'IA réfléchit...";
    setTimeout(()=>{
      const m=aiChoose();
      if(m<0)return nextTurn(0);
      playMove(m,1);
    },450);
  }
}

function endGame(){
  phase='over';
  const gagne=storeToi>storeIa, nul=storeToi===storeIa;
  finTitre.textContent=storeToi+" — "+storeIa;
  finTexte.textContent = nul ? "Égalité parfaite ! Une revanche s'impose."
    : gagne ? "Victoire ! Un vrai maître de l'awalé. Le classement hebdo t'attend."
    : "L'IA a mieux semé cette fois... Observe ses captures et prends ta revanche !";
  if(gagne){SFX.victoire();confettiParts=confetti(cvs,ctx,W/2,H*0.4);}else if(!nul){SFX.defaite();}
  const scoreEnvoi=Math.round(storeToi*6+(gagne?80:nul?20:0));
  if(window.parent!==window){try{window.parent.postMessage({type:'faso_score',jeu:'Awalé',score:scoreEnvoi,victoire:gagne},'*');}catch(e){}}
  fin.style.display='flex';
}

document.getElementById('rejouer').addEventListener('click',()=>{
  fin.style.display='none';confettiParts=[];VFX.reset();reset();
});

// ---- Rendu ----
function draw(dt){
  if(anim)anim.step(dt);
  if(flashT>0)flashT-=dt;
  const secoue=VFX.appliquerSecousse(ctx,dt);

  // ================== FOND BOGOLAN (texture réelle) ==================
  if(texPretes&&IMG.MOTIF.complete&&IMG.MOTIF.naturalWidth){
    if(!texPatterns.motif)texPatterns.motif=ctx.createPattern(IMG.MOTIF,'repeat');
    ctx.fillStyle=texPatterns.motif;
    ctx.fillRect(0,0,W,H);
  }else{
    var fond=ctx.createLinearGradient(0,0,W,H);
    fond.addColorStop(0,'#c9a978');fond.addColorStop(0.5,'#b8955f');fond.addColorStop(1,'#a37f4d');
    ctx.fillStyle=fond;ctx.fillRect(0,0,W,H);
  }
  // vignettage
  const vign=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.72);
  vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(40,22,8,.55)');
  ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);

  // ================== DEUX PLANCHES ARTICULÉES ==================
  const margeX=8;
  const pw=W-margeX*2;
  const hHaut=H*0.34, hBas=H*0.66;
  const ph=pitPos[0].r*2.62; // la planche épouse les creux (comme la référence)

  function planche(cy){
    const py=cy-ph/2;
    // ombre portée au sol
    ctx.fillStyle='rgba(30,16,5,.5)';
    ctx.beginPath();ctx.roundRect(margeX+4,py+8,pw,ph,13);ctx.fill();
    ctx.save();
    ctx.beginPath();ctx.roundRect(margeX,py,pw,ph,13);ctx.clip();
    if(texPretes&&IMG.BOIS.complete&&IMG.BOIS.naturalWidth){
      // texture bois réelle, étirée sur la planche
      ctx.drawImage(IMG.BOIS,margeX,py,pw,ph);
      // assombrissement progressif vers le bas (volume)
      const vol=ctx.createLinearGradient(margeX,py,margeX,py+ph);
      vol.addColorStop(0,'rgba(255,225,180,.18)');
      vol.addColorStop(0.45,'rgba(0,0,0,0)');
      vol.addColorStop(1,'rgba(30,14,2,.42)');
      ctx.fillStyle=vol;ctx.fillRect(margeX,py,pw,ph);
    }else{
      const bois=ctx.createLinearGradient(margeX,py,margeX+pw*0.25,py+ph);
      bois.addColorStop(0,'#9a6636');bois.addColorStop(0.35,'#7d4f28');
      bois.addColorStop(0.72,'#65401f');bois.addColorStop(1,'#4d3016');
      ctx.fillStyle=bois;ctx.fillRect(margeX,py,pw,ph);
    }
    ctx.restore();
    // chant supérieur éclairé / inférieur ombré
    ctx.strokeStyle='rgba(235,190,135,.4)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(margeX+9,py+1.5);ctx.lineTo(margeX+pw-9,py+1.5);ctx.stroke();
    ctx.strokeStyle='rgba(25,14,4,.6)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(margeX+9,py+ph-1.5);ctx.lineTo(margeX+pw-9,py+ph-1.5);ctx.stroke();
    // bordure sombre
    ctx.strokeStyle='rgba(35,20,7,.65)';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(margeX,py,pw,ph,13);ctx.stroke();
  }
  planche(hHaut);
  planche(hBas);

  // ================== CHARNIÈRES LAITON ==================
  const yCharn=(hHaut+hBas)/2;
  [W*0.27,W*0.73].forEach(function(cx){
    if(texPretes&&IMG.CHARNIERE.complete&&IMG.CHARNIERE.naturalWidth){
      const lw=44, lh=lw*IMG.CHARNIERE.naturalHeight/IMG.CHARNIERE.naturalWidth;
      ombrePortee(ctx,7,'rgba(0,0,0,.6)',1,3);
      ctx.drawImage(IMG.CHARNIERE,cx-lw/2,yCharn-lh/2,lw,lh);
      sansOmbre(ctx);
    }else{
      const lai=ctx.createLinearGradient(cx-17,yCharn-9,cx+17,yCharn+9);
      lai.addColorStop(0,'#e8c579');lai.addColorStop(0.45,'#b8912f');lai.addColorStop(1,'#7d6018');
      ombrePortee(ctx,6,'rgba(0,0,0,.55)',1,2);
      ctx.fillStyle=lai;
      ctx.beginPath();ctx.roundRect(cx-17,yCharn-9,34,18,3);ctx.fill();
      sansOmbre(ctx);
      ctx.fillStyle='rgba(60,44,10,.7)';
      ctx.fillRect(cx-1.5,yCharn-9,3,18);
      ctx.fillStyle='#f2dba0';
      [-11,11].forEach(function(dx){
        ctx.beginPath();ctx.arc(cx+dx,yCharn-4,2.1,0,7);ctx.fill();
        ctx.beginPath();ctx.arc(cx+dx,yCharn+4,2.1,0,7);ctx.fill();
      });
    }
  });

  // ================== ÉTIQUETTES ==================
  ctx.font='bold 11px Arial'; ctx.textAlign='center';
  ombrePortee(ctx,4,'rgba(0,0,0,.75)',0,1);
  ctx.fillStyle='rgba(250,240,215,.75)';
  ctx.fillText('CAMP DE L\'IA', W/2, hHaut-ph/2-9);
  ctx.fillStyle='#F5C21B';
  ctx.fillText('TON CAMP', W/2, hBas+ph/2+16);
  sansOmbre(ctx);

  // ================== CASES (creux organiques) ==================
  const jouables = phase==='player' ? legalMoves(pits,0) : [];
  for(let i=0;i<12;i++){
    const P=pitPos[i];
    const estFlash=flash.includes(i)&&flashT>0&&Math.floor(flashT/5)%2===0;
    // contour irrégulier du creux (bosselé, creusé à la main)
    ctx.save();
    ctx.beginPath();
    for(let a=0;a<=Math.PI*2+0.01;a+=Math.PI/14){
      const irr=1+Math.sin(a*3+i*1.9)*0.045+Math.cos(a*5+i)*0.03;
      const px=P.x+Math.cos(a)*P.r*irr, py=P.y+Math.sin(a)*P.r*irr*0.93;
      if(a===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    // dégradé de creusement
    const creux=ctx.createRadialGradient(P.x-P.r*0.2,P.y-P.r*0.42,P.r*0.08,P.x,P.y+P.r*0.15,P.r*1.1);
    if(estFlash){creux.addColorStop(0,'#ff6a52');creux.addColorStop(1,'#7d1208');}
    else{creux.addColorStop(0,'#6b4522');creux.addColorStop(0.45,'#4a2e14');creux.addColorStop(1,'#1f1206');}
    ctx.fillStyle=creux;ctx.fill();
    // grain de bois visible au fond du creux (comme dans un vrai plateau sculpté)
    ctx.save();
    ctx.clip();
    ctx.globalAlpha=0.30;
    for(let gv=0;gv<6;gv++){
      const gy2=P.y-P.r*0.7+gv*(P.r*0.28);
      ctx.strokeStyle=gv%2===0?'rgba(150,100,55,.55)':'rgba(30,16,4,.5)';
      ctx.lineWidth=gv%3===0?1.9:1.1;
      ctx.beginPath();
      ctx.moveTo(P.x-P.r,gy2);
      ctx.quadraticCurveTo(P.x,gy2+Math.sin(gv*1.6+i)*3.5,P.x+P.r,gy2+Math.cos(gv+i)*2);
      ctx.stroke();
    }
    ctx.restore();
    // ombre interne en croissant (haut du creux)
    ctx.strokeStyle='rgba(15,8,2,.5)';ctx.lineWidth=3.5;
    ctx.beginPath();ctx.arc(P.x,P.y,P.r*0.93,Math.PI*1.1,Math.PI*1.98);ctx.stroke();
    // lumière rasante en bas du creux
    ctx.strokeStyle='rgba(200,150,95,.22)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(P.x,P.y,P.r*0.86,Math.PI*0.15,Math.PI*0.85);ctx.stroke();
    ctx.restore();
    // halo de sélection
    if(i===lastMovePit){
      ombrePortee(ctx,12,'rgba(245,194,27,.95)',0,0);
      ctx.strokeStyle='#F5C21B';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(P.x,P.y,P.r+2,0,7);ctx.stroke();
      sansOmbre(ctx);
    }else if(jouables.includes(i)){
      ctx.strokeStyle='rgba(245,194,27,.45)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(P.x,P.y,P.r+1.5,0,7);ctx.stroke();
    }
    drawSeeds(P,pits[i],i);
  }

  // ================== COMPTEURS DE CAPTURE (jetons) ==================
  [[W/2,hHaut-ph/2-30,storeIa,'#d8cdb4'],[W/2,hBas+ph/2+36,storeToi,'#F5C21B']].forEach(function(c){
    ombrePortee(ctx,5,'rgba(0,0,0,.5)',0,2);
    const jet=degradeRadial(ctx,c[0]-3,c[1]-4,14,'#5a3a1f','#2e1c0a');
    ctx.fillStyle=jet;
    ctx.beginPath();ctx.arc(c[0],c[1],13,0,7);ctx.fill();
    sansOmbre(ctx);
    ctx.strokeStyle='rgba(200,150,95,.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(c[0],c[1],13,0,7);ctx.stroke();
    ctx.fillStyle=c[3];ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c[2],c[0],c[1]+0.5);
    ctx.textBaseline='alphabetic';
  });

  // graines en main pendant le semis
  if(anim&&anim.hand>0){
    ombrePortee(ctx,6,'rgba(0,0,0,.8)',0,2);
    ctx.fillStyle='rgba(255,248,230,.97)';
    ctx.font='bold 14px Arial';ctx.textAlign='center';
    ctx.fillText('✋ '+anim.hand, W/2, 18);
    sansOmbre(ctx);
  }

  VFX.maj(ctx,dt,W,H);
  if(secoue)ctx.restore();
}

function drawSeeds(P,n,pitIdx){
  if(n===0)return;
  const show=Math.min(n,16);
  const ech=P.r/26;
  const utiliseTex=texPretes&&IMG.GRAINE.complete&&IMG.GRAINE.naturalWidth;
  for(let s=0;s<show;s++){
    const seed=(pitIdx*37+s*61)%100;
    const a=(seed/100)*Math.PI*2+s*1.31;
    const rr=P.r*0.52*Math.sqrt((s*0.83+0.4)/show)+((seed%7)-3)*0.5;
    const sx=P.x+Math.cos(a)*rr;
    const sy=P.y+Math.sin(a)*rr*0.84+P.r*0.08;
    const rot=a+seed*0.03;
    const tw=(7.6+((seed%5)-2)*0.4)*ech, th=(5.9+((seed%3)-1)*0.32)*ech;
    // ombre au fond du creux
    ctx.fillStyle='rgba(10,5,1,.55)';
    ctx.beginPath();ctx.ellipse(sx+1.6,sy+2.4,tw,th,rot,0,7);ctx.fill();
    if(utiliseTex){
      // graine photographiée, tournée et dimensionnée
      ctx.save();
      ctx.translate(sx,sy);ctx.rotate(rot);
      const gw=tw*2.35, gh=gw*IMG.GRAINE.naturalHeight/IMG.GRAINE.naturalWidth;
      ctx.drawImage(IMG.GRAINE,-gw/2,-gh/2,gw,gh);
      ctx.restore();
    }else{
      const gr=ctx.createRadialGradient(sx-tw*0.34,sy-th*0.42,0.4,sx,sy+th*0.2,tw*1.2);
      const t=[['#fdfaf0','#b0a482'],['#f5efdd','#a49876'],['#fffdf6','#bcb08f']][seed%3];
      gr.addColorStop(0,'#ffffff');gr.addColorStop(0.35,t[0]);gr.addColorStop(1,t[1]);
      ctx.fillStyle=gr;
      ctx.beginPath();ctx.ellipse(sx,sy,tw,th,rot,0,7);ctx.fill();
      ctx.strokeStyle='rgba(105,90,60,.4)';ctx.lineWidth=0.8;
      ctx.beginPath();ctx.ellipse(sx,sy,tw,th,rot,0,7);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.beginPath();ctx.ellipse(sx-tw*0.30,sy-th*0.32,tw*0.30,th*0.24,rot,0,7);ctx.fill();
    }
  }
}

// ---- Entrées ----
function tap(clientX,clientY){
  if(phase!=='player')return;
  const r=cvs.getBoundingClientRect();
  const x=clientX-r.left, y=clientY-r.top;
  const jouables=legalMoves(pits,0);
  for(const i of jouables){
    const P=pitPos[i];
    if(Math.hypot(x-P.x,y-P.y)<P.r+8){
      playMove(i,0);
      return;
    }
  }
}
cvs.addEventListener('touchstart',e=>{tap(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();},{passive:false});
cvs.addEventListener('mousedown',e=>{tap(e.clientX,e.clientY);});

// ---- Boucle ----
let last=0;
function loop(now){
  const dt=Math.min(2.5,(now-last)/16.7); last=now;
  draw(dt);
  if(confettiParts.length)drawConfetti(ctx,confettiParts,dt);
  requestAnimationFrame(loop);
}
